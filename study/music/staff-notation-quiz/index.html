<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>五線譜ノート道場</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../shared/base.css">
<link rel="stylesheet" href="theme.css">

<style>
  .app { max-width: 1000px; gap: 28px; }

  /* ---------- Hero ---------- */
  .tagline { max-width: 46ch; }

  .tagline a { color: var(--accent); font-weight: 600; }

  /* ---------- Settings ---------- */
  .settings {
    display: flex;
    flex-wrap: wrap;
    gap: 18px 28px;
    align-items: flex-end;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    box-shadow: 0 1px 2px var(--shadow);
  }

  .setting-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .setting-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .clef-toggles { display: flex; gap: 8px; }

  .clef-chip {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--surface-2);
    color: var(--ink-muted);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .clef-chip:hover { transform: translateY(-1px); }

  .clef-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .clef-chip:focus-visible,
  .note-answer-btn:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .notation-toggle {
    display: flex;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    overflow: hidden;
  }

  .notation-btn {
    border: none;
    background: var(--surface-2);
    color: var(--ink-muted);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    cursor: pointer;
  }

  .notation-btn.active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .reset-btn {
    margin-left: auto;
    align-self: center;
    background: none;
    border: 1.5px solid var(--border);
    color: var(--ink-muted);
    border-radius: 9px;
    padding: 9px 14px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- Quiz card ---------- */
  .quiz-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 2px 10px var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .question {
    margin: 0;
    text-align: center;
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 600;
  }

  .staff-wrap {
    border-radius: 12px;
    overflow: hidden;
    background: linear-gradient(180deg, var(--paper-a), var(--paper-b));
    box-shadow: inset 0 0 0 1px var(--border), 0 4px 14px var(--shadow);
    margin: 0 auto;
  }

  #pitchQuestionArea .staff-wrap { max-width: 380px; }
  #durationQuestionArea .staff-wrap { max-width: 210px; }

  #staffSvg, #durationSvg { display: block; width: 100%; height: auto; color: var(--ink); }

  .keyboard-wrap {
    border-radius: 12px;
    overflow-x: auto;
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--border);
    padding: 4px 6px 2px;
  }

  .keyboard-wrap svg { display: block; height: auto; min-width: 860px; width: 100%; }

  .keyboard-caption {
    margin: 0;
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
  }

  .key-highlight-ring {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    opacity: 0.6;
    transform-origin: center;
    animation: keypulse 1.6s ease-out infinite;
  }

  @keyframes keypulse {
    0%   { r: 7;  opacity: 0.6; }
    70%  { r: 15; opacity: 0; }
    100% { r: 15; opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .key-highlight-ring { animation: none; opacity: 0.35; }
  }

  .feedback {
    margin: 0;
    min-height: 22px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  .answers {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
  }

  .answers.mode-duration { grid-template-columns: repeat(5, 1fr); }

  .note-answer-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 12px 4px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .note-answer-btn:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); }
  .note-answer-btn:disabled { cursor: default; }

  .note-answer-solfa {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 600;
  }

  .note-answer-letter {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-faint);
  }

  .note-answer-btn.correct {
    background: var(--good-soft);
    border-color: var(--good);
    color: var(--good);
  }
  .note-answer-btn.correct .note-answer-letter { color: var(--good); }

  .note-answer-btn.incorrect {
    background: var(--bad-soft);
    border-color: var(--bad);
    color: var(--bad);
  }
  .note-answer-btn.incorrect .note-answer-letter { color: var(--bad); }

  /* ---------- Stats ---------- */
  .stats {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .stat-tiles {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 10px;
    text-align: center;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-label {
    margin-top: 3px;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.05em;
  }

  .clef-stats {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .clef-stats-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 2px;
  }

  .clef-row {
    display: grid;
    grid-template-columns: 84px 1fr 40px;
    align-items: center;
    gap: 10px;
  }

  .clef-row-label {
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-muted);
  }

  .clef-row-track {
    height: 7px;
    border-radius: 4px;
    background: var(--surface-2);
    overflow: hidden;
  }

  .clef-row-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.3s ease;
  }

  .clef-row-pct {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-faint);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 480px) {
    .answers { grid-template-columns: repeat(4, 1fr); }
    .answers.mode-duration { grid-template-columns: repeat(3, 1fr); }
    .stat-tiles { grid-template-columns: repeat(2, 1fr); }
    .settings { flex-direction: column; align-items: stretch; }
    .reset-btn { margin-left: 0; align-self: flex-start; }
  }

  /* ---------- スマホ表示の調整 ---------- */
  @media (max-width: 480px) {
    .notation-toggle { align-self: flex-start; }
    .notation-btn { padding: 9px 14px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="hero">
    <p class="eyebrow">STAFF NOTATION · PITCH &amp; RHYTHM</p>
    <h1>五線譜ノート道場</h1>
    <p class="tagline">「音の高さ」(音名)と「音の長さ」(リズム)を切り替えて練習できる、楽譜を読む力を鍛える練習ページです。</p>
    <p class="tagline"><a href="reference.html">→ 音符の読み方帳（五線譜の基礎）で先に覚える</a></p>
  </header>

  <section class="settings" aria-label="出題設定">
    <div class="setting-group">
      <span class="setting-label">モード</span>
      <div class="notation-toggle" role="group" aria-label="出題モード">
        <button type="button" class="notation-btn active" data-app-mode="pitch">音の高さ</button>
        <button type="button" class="notation-btn" data-app-mode="duration">音の長さ</button>
      </div>
    </div>

    <div class="setting-group" id="clefSettingGroup">
      <span class="setting-label">音部記号</span>
      <div class="clef-toggles" id="clefToggles"></div>
    </div>

    <div class="setting-group" id="rangeSettingGroup">
      <span class="setting-label">音域</span>
      <div class="notation-toggle" role="group" aria-label="出題する音域">
        <button type="button" class="notation-btn active" data-range="core">基本</button>
        <button type="button" class="notation-btn" data-range="extended">加線を含む</button>
      </div>
    </div>

    <div class="setting-group" id="durTypeSettingGroup" style="display:none">
      <span class="setting-label">音符の種類</span>
      <div class="clef-toggles" id="durationTypeToggles"></div>
    </div>

    <div class="setting-group" id="restSettingGroup" style="display:none">
      <span class="setting-label">休符</span>
      <div class="notation-toggle" role="group" aria-label="休符を含めるか">
        <button type="button" class="notation-btn active" data-rests="off">音符のみ</button>
        <button type="button" class="notation-btn" data-rests="on">休符を含む</button>
      </div>
    </div>

    <button type="button" class="reset-btn" id="resetBtn">成績をリセット</button>
  </section>

  <section class="quiz-card">
    <p class="question" id="questionText">この音符の音名は?</p>

    <div id="pitchQuestionArea">
      <div class="staff-wrap">
        <svg id="staffSvg" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet" role="img" aria-label="出題される音符"></svg>
      </div>
    </div>

    <div id="durationQuestionArea" style="display:none">
      <div class="staff-wrap">
        <svg id="durationSvg" viewBox="0 0 200 240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="出題される音符・休符の長さ"></svg>
      </div>
    </div>

    <p class="feedback" id="feedbackText" aria-live="polite">&nbsp;</p>

    <div id="keyboardArea">
      <p class="keyboard-caption">鍵盤の位置（回答すると表示されます）</p>
      <div class="keyboard-wrap" id="keyboardWrap"><svg id="keyboardSvg" role="img" aria-label="鍵盤上の位置（回答後に表示）"></svg></div>
    </div>

    <div class="answers" id="answerGrid"></div>
  </section>

  <section class="stats" aria-label="成績">
    <div class="stat-tiles">
      <div class="stat-tile">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">出題数</div>
      </div>
      <div class="stat-tile">
        <div class="stat-value" id="statAccuracy">–</div>
        <div class="stat-label">正答率</div>
      </div>
      <div class="stat-tile">
        <div class="stat-value" id="statStreak">0</div>
        <div class="stat-label">連続正解</div>
      </div>
      <div class="stat-tile">
        <div class="stat-value" id="statBest">0</div>
        <div class="stat-label">最高連続</div>
      </div>
    </div>

    <div class="clef-stats">
      <div class="clef-stats-title" id="breakdownTitle">音部記号ごとの正答率</div>
      <div id="clefStatsBody"></div>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  var NOTE_LETTERS = ["C", "D", "E", "F", "G", "A", "B"];
  var SOLFA = { C: "ド", D: "レ", E: "ミ", F: "ファ", G: "ソ", A: "ラ", B: "シ" };

  var CLEF_INFO = {
    treble: { key: "treble", label: "ト音記号", glyph: "\u{1D11E}", bottomLetter: "E", bottomOctave: 4, fontScale: 8.0, baselineScale: 3.72 },
    bass:   { key: "bass",   label: "ヘ音記号", glyph: "\u{1D122}", bottomLetter: "G", bottomOctave: 2, fontScale: 4.3, baselineScale: 2.5 }
  };
  var CLEF_ORDER = ["treble", "bass"];

  var CORE_NOTES = {
    treble: [["E",4],["F",4],["G",4],["A",4],["B",4],["C",5],["D",5],["E",5],["F",5]],
    bass:   [["G",2],["A",2],["B",2],["C",3],["D",3],["E",3],["F",3],["G",3],["A",3]]
  };
  // up to 3 ledger lines on each side of the staff
  var EXTRA_NOTES = {
    treble: [["D",4],["C",4],["B",3],["A",3],["G",3],["F",3],["G",5],["A",5],["B",5],["C",6],["D",6],["E",6]],
    bass:   [["F",2],["E",2],["D",2],["C",2],["B",1],["A",1],["B",3],["C",4],["D",4],["E",4],["F",4],["G",4]]
  };

  var STAFF_TOP_Y = 90;
  var LINE_SPACING = 20;
  var STAFF_X0 = 24;
  var STAFF_X1 = 340;
  var CLEF_X = 42;
  var NOTE_X = 235;

  var svgNS = "http://www.w3.org/2000/svg";
  var el = function (id) { return document.getElementById(id); };

  function noteStep(letter, octave) {
    return octave * 7 + NOTE_LETTERS.indexOf(letter);
  }

  function clefBottomStep(clefKey) {
    var c = CLEF_INFO[clefKey];
    return noteStep(c.bottomLetter, c.bottomOctave);
  }

  function svgEl(tag, attrs) {
    var e = document.createElementNS(svgNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function drawStaffLines(svg) {
    for (var i = 0; i < 5; i++) {
      var y = STAFF_TOP_Y + i * LINE_SPACING;
      svg.appendChild(svgEl("line", { x1: STAFF_X0, x2: STAFF_X1, y1: y, y2: y, stroke: "currentColor", "stroke-width": 1.6, opacity: 0.75 }));
    }
  }

  function drawClef(svg, clefKey) {
    var info = CLEF_INFO[clefKey];
    var fontSize = LINE_SPACING * info.fontScale;
    var y = STAFF_TOP_Y + LINE_SPACING * info.baselineScale;
    var t = svgEl("text", {
      x: CLEF_X, y: y, "font-size": fontSize,
      "font-family": "'Apple Symbols','Noto Music','Segoe UI Symbol',serif",
      fill: "var(--accent)"
    });
    t.textContent = info.glyph;
    svg.appendChild(t);

    var cap = svgEl("text", {
      x: CLEF_X + 24, y: STAFF_TOP_Y + 4 * LINE_SPACING + 30,
      "font-family": "var(--font-mono)", "font-size": 10.5, "font-weight": 600,
      fill: "var(--ink-faint)", "text-anchor": "middle"
    });
    cap.textContent = info.label;
    svg.appendChild(cap);
  }

  function noteY(clefKey, letter, octave) {
    var bottomStep = clefBottomStep(clefKey);
    var step = noteStep(letter, octave);
    var half = LINE_SPACING / 2;
    var bottomLineY = STAFF_TOP_Y + 4 * LINE_SPACING;
    return bottomLineY - (step - bottomStep) * half;
  }

  function drawLedgerLines(svg, clefKey, letter, octave, x) {
    var bottomStep = clefBottomStep(clefKey);
    var topStep = bottomStep + 8;
    var step = noteStep(letter, octave);
    var half = LINE_SPACING / 2;
    var bottomLineY = STAFF_TOP_Y + 4 * LINE_SPACING;
    var w = LINE_SPACING * 1.7;
    var s, y;
    if (step < bottomStep) {
      for (s = bottomStep - 2; s >= step; s -= 2) {
        y = bottomLineY - (s - bottomStep) * half;
        svg.appendChild(svgEl("line", { x1: x - w / 2, x2: x + w / 2, y1: y, y2: y, stroke: "currentColor", "stroke-width": 1.6 }));
      }
    } else if (step > topStep) {
      for (s = topStep + 2; s <= step; s += 2) {
        y = bottomLineY - (s - bottomStep) * half;
        svg.appendChild(svgEl("line", { x1: x - w / 2, x2: x + w / 2, y1: y, y2: y, stroke: "currentColor", "stroke-width": 1.6 }));
      }
    }
  }

  function drawNoteHead(svg, x, y) {
    var rx = LINE_SPACING * 0.62, ry = LINE_SPACING * 0.46;
    svg.appendChild(svgEl("ellipse", {
      cx: x, cy: y, rx: rx, ry: ry,
      transform: "rotate(-18 " + x + " " + y + ")",
      fill: "var(--accent)"
    }));
  }

  function renderQuestionNote() {
    var svg = el("staffSvg");
    svg.innerHTML = "";
    var cur = state.current;
    drawStaffLines(svg);
    drawClef(svg, cur.clef);
    drawLedgerLines(svg, cur.clef, cur.letter, cur.octave, NOTE_X);
    var y = noteY(cur.clef, cur.letter, cur.octave);
    drawNoteHead(svg, NOTE_X, y);
  }

  // ---------- Piano keyboard (full 88-key, A0-C8) ----------
  var PIANO_WHITE_SEQUENCE = (function () {
    var seq = [["A", 0], ["B", 0]];
    for (var oct = 1; oct <= 7; oct++) {
      NOTE_LETTERS.forEach(function (letter) { seq.push([letter, oct]); });
    }
    seq.push(["C", 8]);
    return seq;
  })();

  var WHITE_W = 16, WHITE_H = 80, BLACK_W = 10, BLACK_H = 50, KEY_TOP = 8;
  var pianoKeys = {}; // "letter+octave" -> { rect, cx, cy }

  function buildPianoKeyboard() {
    var svg = el("keyboardSvg");
    svg.innerHTML = "";
    var count = PIANO_WHITE_SEQUENCE.length;
    var width = count * WHITE_W + 16;
    var height = KEY_TOP + WHITE_H + 22;
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

    PIANO_WHITE_SEQUENCE.forEach(function (pair, i) {
      var letter = pair[0], octave = pair[1];
      var x = 8 + i * WHITE_W;
      var rect = svgEl("rect", {
        x: x, y: KEY_TOP, width: WHITE_W - 1.2, height: WHITE_H, rx: 2.5,
        fill: "var(--paper-a)", stroke: "var(--border)", "stroke-width": 1,
        style: "transition: fill 0.2s ease;"
      });
      svg.appendChild(rect);
      pianoKeys[letter + octave] = { rect: rect, cx: x + (WHITE_W - 1.2) / 2, cy: KEY_TOP + WHITE_H * 0.76 };

      if (letter === "C") {
        var lbl = svgEl("text", {
          x: x + (WHITE_W - 1.2) / 2, y: KEY_TOP + WHITE_H + 14,
          "font-family": "var(--font-mono)", "font-size": 8, "font-weight": 600,
          fill: "var(--ink-faint)", "text-anchor": "middle"
        });
        lbl.textContent = octave === 4 ? "中央C" : ("C" + octave);
        svg.appendChild(lbl);
      }

      if (letter !== "E" && letter !== "B" && i < count - 1) {
        var bx = x + WHITE_W - BLACK_W / 2;
        svg.appendChild(svgEl("rect", {
          x: bx, y: KEY_TOP, width: BLACK_W, height: BLACK_H, rx: 1.5,
          fill: "var(--ink)", opacity: 0.88
        }));
      }
    });
  }

  function resetKeyboard() {
    for (var key in pianoKeys) pianoKeys[key].rect.setAttribute("fill", "var(--paper-a)");
    var ring = el("keyHighlightRing");
    if (ring) ring.remove();
  }

  function scrollKeyboardTo(cx, smooth) {
    var wrap = el("keyboardWrap");
    var svg = el("keyboardSvg");
    var vb = svg.viewBox.baseVal;
    if (!vb || vb.width === 0) return;
    var scale = svg.getBoundingClientRect().width / vb.width;
    var target = cx * scale - wrap.clientWidth / 2;
    wrap.scrollTo({ left: Math.max(0, target), behavior: smooth ? "smooth" : "auto" });
  }

  function revealKey(letter, octave) {
    var k = pianoKeys[letter + octave];
    if (!k) return;
    k.rect.setAttribute("fill", "var(--accent)");
    var svg = el("keyboardSvg");
    svg.appendChild(svgEl("circle", {
      cx: k.cx, cy: k.cy, r: 7, class: "key-highlight-ring", id: "keyHighlightRing"
    }));
    scrollKeyboardTo(k.cx, true);
  }

  // ---------- Duration / rest data ----------
  var DURATION_ORDER = ["whole", "half", "quarter", "eighth", "sixteenth"];
  var DURATION_INFO = {
    whole:     { name: "全音符",     restName: "全休符",     beat: "4拍" },
    half:      { name: "二分音符",   restName: "二分休符",   beat: "2拍" },
    quarter:   { name: "四分音符",   restName: "四分休符",   beat: "1拍" },
    eighth:    { name: "八分音符",   restName: "八分休符",   beat: "0.5拍" },
    sixteenth: { name: "十六分音符", restName: "十六分休符", beat: "0.25拍" }
  };

  function shortDurName(type) { return DURATION_INFO[type].name.replace("音符", ""); }

  // Draws a rest shape plus a short reference staff line, so whole/half rests'
  // hang-below vs. sit-above relationship to a line is visible.
  function drawRestIcon(svg, type, cx, cy, scale, color, lineColor) {
    var lineHalf = 16 * scale;
    svg.appendChild(svgEl("line", {
      x1: cx - lineHalf, x2: cx + lineHalf, y1: cy, y2: cy,
      stroke: lineColor, "stroke-width": Math.max(1, 1.4 * scale), opacity: 0.55
    }));

    var g = svgEl("g", { transform: "translate(" + cx + " " + cy + ") scale(" + scale + ")" });

    if (type === "whole") {
      g.appendChild(svgEl("rect", { x: -7, y: 0, width: 14, height: 7, fill: color }));
    } else if (type === "half") {
      g.appendChild(svgEl("rect", { x: -7, y: -7, width: 14, height: 7, fill: color }));
    } else if (type === "quarter") {
      g.appendChild(svgEl("path", {
        d: "M 9 -22 L -3 -10 L 7 -10 L -5 4 L 5 4 L -6 20",
        fill: "none", stroke: color, "stroke-width": 4, "stroke-linecap": "round", "stroke-linejoin": "round"
      }));
    } else {
      g.appendChild(svgEl("line", { x1: 6, y1: -18, x2: -6, y2: 22, stroke: color, "stroke-width": 4, "stroke-linecap": "round" }));
      g.appendChild(svgEl("circle", { cx: 6, cy: -15, r: 4.5, fill: color }));
      if (type === "sixteenth") {
        g.appendChild(svgEl("circle", { cx: 2, cy: -2, r: 4.5, fill: color }));
      }
    }

    svg.appendChild(g);
  }

  function renderDurationQuestion() {
    var svg = el("durationSvg");
    svg.innerHTML = "";
    var cur = state.current;

    if (cur.isRest) {
      drawRestIcon(svg, cur.type, 100, 135, 3.0, "var(--accent)", "var(--ink-faint)");
      return;
    }

    var filled = (cur.type === "quarter" || cur.type === "eighth" || cur.type === "sixteenth");
    var cx = 95, cy = 175, rx = 32, ry = 24;
    svg.appendChild(svgEl("ellipse", {
      cx: cx, cy: cy, rx: rx, ry: ry,
      transform: "rotate(-18 " + cx + " " + cy + ")",
      fill: filled ? "var(--accent)" : "none", stroke: "var(--accent)", "stroke-width": 5
    }));
    if (cur.type !== "whole") {
      var stemX = cx + rx * 0.92, topY = 30;
      svg.appendChild(svgEl("line", { x1: stemX, x2: stemX, y1: cy, y2: topY, stroke: "var(--accent)", "stroke-width": 5 }));
      if (cur.type === "eighth" || cur.type === "sixteenth") {
        svg.appendChild(svgEl("path", { d: "M " + stemX + " " + topY + " q 34 12 22 48", stroke: "var(--accent)", "stroke-width": 5, fill: "none", "stroke-linecap": "round" }));
      }
      if (cur.type === "sixteenth") {
        svg.appendChild(svgEl("path", { d: "M " + stemX + " " + (topY + 34) + " q 34 12 22 48", stroke: "var(--accent)", "stroke-width": 5, fill: "none", "stroke-linecap": "round" }));
      }
    }
  }

  // ---------- State ----------
  var state = {
    appMode: "pitch", // "pitch" | "duration"
    included: { treble: true, bass: true },
    range: "core",
    durTypesIncluded: { whole: true, half: true, quarter: true, eighth: true, sixteenth: true },
    durIncludeRests: false,
    locked: false,
    current: null,
    stats: {
      pitch: {
        total: 0, correct: 0, streak: 0, best: 0,
        perClef: { treble: { total: 0, correct: 0 }, bass: { total: 0, correct: 0 } }
      },
      duration: {
        total: 0, correct: 0, streak: 0, best: 0,
        perType: {
          whole: { total: 0, correct: 0 }, half: { total: 0, correct: 0 }, quarter: { total: 0, correct: 0 },
          eighth: { total: 0, correct: 0 }, sixteenth: { total: 0, correct: 0 }
        }
      }
    }
  };

  function currentStats() { return state.stats[state.appMode]; }

  function pool(clefKey) {
    var notes = CORE_NOTES[clefKey].slice();
    if (state.range === "extended") notes = notes.concat(EXTRA_NOTES[clefKey]);
    return notes;
  }

  function includedClefs() {
    return CLEF_ORDER.filter(function (c) { return state.included[c]; });
  }

  function includedDurationTypes() {
    return DURATION_ORDER.filter(function (t) { return state.durTypesIncluded[t]; });
  }

  // ---------- Clef toggles ----------
  function buildClefToggles() {
    var wrap = el("clefToggles");
    wrap.innerHTML = "";
    CLEF_ORDER.forEach(function (key) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "clef-chip" + (state.included[key] ? " active" : "");
      btn.textContent = CLEF_INFO[key].label;
      btn.setAttribute("aria-pressed", String(state.included[key]));
      btn.addEventListener("click", function () {
        var activeCount = includedClefs().length;
        if (state.included[key] && activeCount === 1) return;
        state.included[key] = !state.included[key];
        buildClefToggles();
        if (state.appMode === "pitch" && !state.included[state.current.clef]) nextQuestion();
      });
      wrap.appendChild(btn);
    });
  }

  // ---------- Duration type toggles ----------
  function buildDurationTypeToggles() {
    var wrap = el("durationTypeToggles");
    wrap.innerHTML = "";
    DURATION_ORDER.forEach(function (type) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "clef-chip" + (state.durTypesIncluded[type] ? " active" : "");
      btn.textContent = shortDurName(type);
      btn.setAttribute("aria-pressed", String(state.durTypesIncluded[type]));
      btn.addEventListener("click", function () {
        var activeCount = includedDurationTypes().length;
        if (state.durTypesIncluded[type] && activeCount === 1) return;
        state.durTypesIncluded[type] = !state.durTypesIncluded[type];
        buildDurationTypeToggles();
        if (state.appMode === "duration" && state.current && !state.durTypesIncluded[state.current.type]) nextQuestion();
      });
      wrap.appendChild(btn);
    });
  }

  // ---------- Answer grid ----------
  function buildAnswerGrid() {
    var grid = el("answerGrid");
    grid.innerHTML = "";
    grid.classList.toggle("mode-duration", state.appMode === "duration");

    if (state.appMode === "pitch") {
      NOTE_LETTERS.forEach(function (letter) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "note-answer-btn";
        btn.dataset.letter = letter;
        btn.innerHTML =
          '<span class="note-answer-solfa">' + SOLFA[letter] + '</span>' +
          '<span class="note-answer-letter">' + letter + '</span>';
        btn.setAttribute("aria-label", SOLFA[letter] + " " + letter);
        btn.addEventListener("click", onAnswer);
        grid.appendChild(btn);
      });
    } else {
      DURATION_ORDER.forEach(function (type) {
        var info = DURATION_INFO[type];
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "note-answer-btn";
        btn.dataset.durtype = type;
        btn.innerHTML =
          '<span class="note-answer-solfa">' + shortDurName(type) + '</span>' +
          '<span class="note-answer-letter">' + info.beat + '</span>';
        btn.setAttribute("aria-label", info.name + " " + info.beat);
        btn.addEventListener("click", onAnswer);
        grid.appendChild(btn);
      });
    }
  }

  // ---------- Question flow ----------
  function nextQuestion() {
    if (state.appMode === "pitch") nextPitchQuestion();
    else nextDurationQuestion();
  }

  function resetAnswerButtons() {
    el("answerGrid").querySelectorAll(".note-answer-btn").forEach(function (b) {
      b.classList.remove("correct", "incorrect");
      b.disabled = false;
    });
  }

  function nextPitchQuestion() {
    var clefs = includedClefs();
    var clef = clefs[Math.floor(Math.random() * clefs.length)];
    var notes = pool(clef);
    var pick = notes[Math.floor(Math.random() * notes.length)];
    state.current = { clef: clef, letter: pick[0], octave: pick[1] };
    state.locked = false;

    el("questionText").textContent = "この音符の音名は?";
    var fb = el("feedbackText");
    fb.textContent = " ";
    fb.className = "feedback";

    resetAnswerButtons();
    renderQuestionNote();
    resetKeyboard();
  }

  function nextDurationQuestion() {
    var types = includedDurationTypes();
    var type = types[Math.floor(Math.random() * types.length)];
    var isRest = state.durIncludeRests && Math.random() < 0.5;
    state.current = { type: type, isRest: isRest };
    state.locked = false;

    el("questionText").textContent = isRest ? "この休符の長さは?" : "この音符の長さは?";
    var fb = el("feedbackText");
    fb.textContent = " ";
    fb.className = "feedback";

    resetAnswerButtons();
    renderDurationQuestion();
  }

  function onAnswer(e) {
    if (state.locked) return;
    state.locked = true;
    if (state.appMode === "pitch") onPitchAnswer(e);
    else onDurationAnswer(e);
  }

  function onPitchAnswer(e) {
    var chosen = e.currentTarget.dataset.letter;
    var correct = state.current.letter;
    var clef = state.current.clef;
    var isRight = chosen === correct;

    var s = currentStats();
    s.total++;
    s.perClef[clef].total++;
    if (isRight) {
      s.correct++;
      s.streak++;
      s.best = Math.max(s.best, s.streak);
      s.perClef[clef].correct++;
    } else {
      s.streak = 0;
    }

    var buttons = el("answerGrid").querySelectorAll(".note-answer-btn");
    buttons.forEach(function (b) {
      b.disabled = true;
      var letter = b.dataset.letter;
      if (letter === correct) b.classList.add("correct");
      else if (letter === chosen) b.classList.add("incorrect");
    });

    var fb = el("feedbackText");
    var answerLabel = SOLFA[correct] + "（" + correct + state.current.octave + "・" + CLEF_INFO[clef].label + "）";
    if (isRight) {
      fb.textContent = "正解 — " + answerLabel;
      fb.className = "feedback good";
    } else {
      fb.textContent = "不正解 — 正解は " + answerLabel;
      fb.className = "feedback bad";
    }

    revealKey(correct, state.current.octave);
    updateStatsUI();
    window.setTimeout(nextQuestion, isRight ? 950 : 1500);
  }

  function onDurationAnswer(e) {
    var chosen = e.currentTarget.dataset.durtype;
    var correct = state.current.type;
    var isRest = state.current.isRest;
    var isRight = chosen === correct;

    var s = currentStats();
    s.total++;
    s.perType[correct].total++;
    if (isRight) {
      s.correct++;
      s.streak++;
      s.best = Math.max(s.best, s.streak);
      s.perType[correct].correct++;
    } else {
      s.streak = 0;
    }

    var buttons = el("answerGrid").querySelectorAll(".note-answer-btn");
    buttons.forEach(function (b) {
      b.disabled = true;
      var t = b.dataset.durtype;
      if (t === correct) b.classList.add("correct");
      else if (t === chosen) b.classList.add("incorrect");
    });

    var info = DURATION_INFO[correct];
    var answerLabel = (isRest ? info.restName : info.name) + "（" + info.beat + "）";
    var fb = el("feedbackText");
    if (isRight) {
      fb.textContent = "正解 — " + answerLabel;
      fb.className = "feedback good";
    } else {
      fb.textContent = "不正解 — 正解は " + answerLabel;
      fb.className = "feedback bad";
    }

    updateStatsUI();
    window.setTimeout(nextQuestion, isRight ? 950 : 1500);
  }

  function updateStatsUI() {
    var s = currentStats();
    el("statTotal").textContent = String(s.total);
    el("statAccuracy").textContent = s.total ? Math.round((s.correct / s.total) * 100) + "%" : "–";
    el("statStreak").textContent = String(s.streak);
    el("statBest").textContent = String(s.best);

    var body = el("clefStatsBody");
    body.innerHTML = "";

    if (state.appMode === "pitch") {
      CLEF_ORDER.forEach(function (key) {
        var ps = s.perClef[key];
        var pct = ps.total ? Math.round((ps.correct / ps.total) * 100) : 0;
        var row = document.createElement("div");
        row.className = "clef-row";
        row.innerHTML =
          '<span class="clef-row-label">' + CLEF_INFO[key].label + '</span>' +
          '<span class="clef-row-track"><span class="clef-row-fill" style="width:' + pct + '%"></span></span>' +
          '<span class="clef-row-pct">' + (ps.total ? pct + "%" : "–") + '</span>';
        body.appendChild(row);
      });
    } else {
      DURATION_ORDER.forEach(function (type) {
        var ps = s.perType[type];
        var pct = ps.total ? Math.round((ps.correct / ps.total) * 100) : 0;
        var row = document.createElement("div");
        row.className = "clef-row";
        row.innerHTML =
          '<span class="clef-row-label">' + shortDurName(type) + '</span>' +
          '<span class="clef-row-track"><span class="clef-row-fill" style="width:' + pct + '%"></span></span>' +
          '<span class="clef-row-pct">' + (ps.total ? pct + "%" : "–") + '</span>';
        body.appendChild(row);
      });
    }
  }

  function resetStats() {
    if (state.appMode === "pitch") {
      state.stats.pitch = {
        total: 0, correct: 0, streak: 0, best: 0,
        perClef: { treble: { total: 0, correct: 0 }, bass: { total: 0, correct: 0 } }
      };
    } else {
      state.stats.duration = {
        total: 0, correct: 0, streak: 0, best: 0,
        perType: {
          whole: { total: 0, correct: 0 }, half: { total: 0, correct: 0 }, quarter: { total: 0, correct: 0 },
          eighth: { total: 0, correct: 0 }, sixteenth: { total: 0, correct: 0 }
        }
      };
    }
    updateStatsUI();
  }

  // ---------- Mode switching ----------
  function setAppMode(mode) {
    state.appMode = mode;
    var isPitch = mode === "pitch";
    el("clefSettingGroup").style.display = isPitch ? "" : "none";
    el("rangeSettingGroup").style.display = isPitch ? "" : "none";
    el("durTypeSettingGroup").style.display = isPitch ? "none" : "";
    el("restSettingGroup").style.display = isPitch ? "none" : "";
    el("pitchQuestionArea").style.display = isPitch ? "" : "none";
    el("durationQuestionArea").style.display = isPitch ? "none" : "";
    el("keyboardArea").style.display = isPitch ? "" : "none";
    el("breakdownTitle").textContent = isPitch ? "音部記号ごとの正答率" : "音符の種類ごとの正答率";
    buildAnswerGrid();
    updateStatsUI();
    nextQuestion();
  }

  // ---------- Settings wiring ----------
  document.querySelectorAll('.notation-btn[data-app-mode]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll('.notation-btn[data-app-mode]').forEach(function (b) {
        b.classList.remove("active");
      });
      btn.classList.add("active");
      setAppMode(btn.dataset.appMode);
    });
  });

  document.querySelectorAll('.notation-btn[data-range]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll('.notation-btn[data-range]').forEach(function (b) {
        b.classList.remove("active");
      });
      btn.classList.add("active");
      state.range = btn.dataset.range;
      if (state.appMode === "pitch") nextQuestion();
    });
  });

  document.querySelectorAll('.notation-btn[data-rests]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll('.notation-btn[data-rests]').forEach(function (b) {
        b.classList.remove("active");
      });
      btn.classList.add("active");
      state.durIncludeRests = btn.dataset.rests === "on";
      if (state.appMode === "duration") nextQuestion();
    });
  });

  el("resetBtn").addEventListener("click", resetStats);

  // ---------- Init ----------
  buildClefToggles();
  buildDurationTypeToggles();
  buildAnswerGrid();
  buildPianoKeyboard();
  updateStatsUI();
  nextQuestion();
  window.setTimeout(function () {
    var midC = pianoKeys["C4"];
    if (midC) scrollKeyboardTo(midC.cx, false);
  }, 0);
})();
</script>
</body>
</html>
