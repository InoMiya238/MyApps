<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギター入門コース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../shared/base.css">
<link rel="stylesheet" href="theme.css">

<style>
  .app { max-width: 760px; gap: 22px; }
  .app.is-lesson { max-width: 980px; }
  [hidden] { display: none !important; }

  /* ---------- Hero ---------- */
  .tagline { max-width: 46ch; }
  .site-nav {
    margin: 14px 0 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 18px;
    font-size: 13px;
  }
  .site-nav a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .site-nav a:hover { text-decoration: underline; }
  .site-nav [aria-current="page"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom: 2px solid var(--accent);
  }
  .hero.is-compact { padding-bottom: 12px; }
  .hero.is-compact h1 { font-size: 24px; margin-bottom: 4px; }
  .hero.is-compact .tagline { display: none; }

  button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible, [role="button"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  h2[tabindex="-1"]:focus { outline: none; }

  /* ---------- カード・ボタン ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    box-shadow: 0 1px 2px var(--shadow);
    min-width: 0;
  }
  .card h2 {
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 14px;
  }
  .btn-primary, .btn-secondary {
    font-family: var(--font-body);
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    padding: 12px 14px;
    min-height: 44px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-decoration: none;
    line-height: 1.4;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); }
  .btn-primary:disabled, .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-small {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    min-height: 36px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .lbl-short { display: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 8px; }
  .chip-btn {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    min-height: 36px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    cursor: pointer;
  }
  .chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .chip {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }
  .hint {
    font-size: 0.8rem;
    color: var(--ink-faint);
    margin: 8px 0 0;
    line-height: 1.6;
  }
  .val {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--ink);
    white-space: nowrap;
  }

  /* ---------- 進み具合 ---------- */
  .progress { display: flex; align-items: center; gap: 12px; }
  .progress-track { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .progress-bar { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.2s ease; }
  .progress-text {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-muted);
    white-space: nowrap;
  }

  /* ---------- コースのトップ ---------- */
  .view-top { display: flex; flex-direction: column; gap: 18px; }
  .course-intro ul { margin: 0; padding-left: 1.2em; }
  .course-intro li { font-size: 14.5px; line-height: 1.75; color: var(--ink); margin-bottom: 4px; }
  .course-intro li:last-child { margin-bottom: 0; }
  .resume { align-self: stretch; }
  .lesson-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .lesson-row {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr);
    gap: 4px 14px;
    align-items: start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--ink);
    text-decoration: none;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .lesson-row:hover { border-color: var(--accent); }
  .lesson-num {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
  }
  .lesson-row.is-done .lesson-num { background: var(--good-soft); color: var(--good); }
  .lesson-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .lesson-row .lesson-title { font-size: 15.5px; font-weight: 600; line-height: 1.5; margin-top: 4px; }
  .lesson-summary { font-size: 13.5px; color: var(--ink-muted); line-height: 1.6; }
  .lesson-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .part-block { display: flex; flex-direction: column; gap: 10px; }
  .part-head { padding: 6px 2px 0; }
  .part-no { margin: 0; font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: var(--accent); }
  .part-head h2 { margin: 2px 0 4px; font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; line-height: 1.4; }
  .part-desc { margin: 0; font-size: 13.5px; line-height: 1.65; color: var(--ink-muted); }
  .top-links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .summary-card .summary-part { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 24px 0 0; padding-top: 14px; border-top: 1px solid var(--border); }
  .summary-card .summary-part:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
  .summary-card h3 { font-size: 15px; font-weight: 600; margin: 18px 0 6px; }
  .summary-card .summary-part + h3 { margin-top: 10px; }
  .summary-card ul { margin: 0; padding-left: 1.2em; }
  .summary-card li { font-size: 14px; line-height: 1.7; }

  /* ---------- レッスン画面 ---------- */
  .course-layout {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }
  .toc {
    position: sticky;
    top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 10px;
    min-width: 0;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
  }
  .toc > summary { display: none; }
  .toc-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    padding: 2px 8px 8px;
    font-size: 13px;
    font-weight: 700;
  }
  .toc-head .progress-text { font-size: 12px; }
  .toc-part {
    margin: 10px 0 2px;
    padding: 0 8px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-faint);
    line-height: 1.5;
  }
  .toc-part:first-child { margin-top: 0; }
  .toc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .toc-item {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    padding: 6px 8px;
    border-left: 3px solid transparent;
    border-radius: 8px;
    color: var(--ink);
    text-decoration: none;
    font-size: 13.5px;
    line-height: 1.4;
  }
  .toc-item:hover { background: var(--surface-2); }
  .toc-item.is-current { background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
  .toc-no {
    flex: none;
    width: 22px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .toc-item.is-done .toc-no { color: var(--good); }
  .toc-top {
    display: block;
    margin: 8px 8px 0;
    padding: 6px 0 2px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
  }
  .toc-top:hover { text-decoration: underline; }

  .lesson { padding: 26px 30px; }
  .lesson-head { margin-bottom: 8px; }
  .lesson-no {
    margin: 0 0 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--accent);
  }
  .lesson-head h2.lesson-title {
    margin: 0 0 10px;
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 600;
    line-height: 1.35;
    text-wrap: balance;
    display: block;
  }
  .lesson-lead { margin: 0; font-size: 16px; line-height: 1.7; color: var(--ink-muted); }

  .lesson-body { font-size: 15.5px; line-height: 1.85; }
  .lesson-body > * { margin: 0 0 0.9em; }
  .lesson-body > h3 { font-size: 17px; font-weight: 600; margin: 28px 0 8px; line-height: 1.5; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .lesson-body b { font-weight: 700; }
  .lesson-body a, .feedback a { color: var(--accent); font-weight: 600; }
  .tip-box {
    background: var(--surface-2);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14.5px;
    line-height: 1.8;
  }
  .note-box {
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--ink-muted);
    font-size: 14px;
    line-height: 1.75;
  }
  .box-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .note-box .box-label { color: var(--ink-faint); }
  .lesson-body ul, .lesson-body ol { padding-left: 1.4em; }
  .lesson-body li { margin-bottom: 0.35em; }

  /* ---------- 図 ---------- */
  .figure { margin: 18px 0; }
  .figure > * { margin: 0; }
  .fig-scroll {
    overflow-x: auto;
    border-radius: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .fig-scroll svg { display: block; width: 100%; height: auto; }
  .board-wrap { box-shadow: 0 2px 10px var(--shadow); }
  .fig-caption { margin-top: 8px; font-size: 13px; line-height: 1.65; color: var(--ink-muted); }
  .fig-parts { background: var(--surface-2); padding: 6px; }
  .fig-svg text { font-family: var(--font-body); }
  .board-mark { cursor: pointer; }
  .board-mark:focus { outline: none; }
  .board-mark:focus-visible circle { stroke: var(--accent); stroke-width: 3; }
  .board-mark.is-hit circle { fill: var(--marker-glow); }
  .board-mark.is-on circle { fill: var(--marker-glow); stroke: var(--marker-core); stroke-width: 2.5; }

  .how-grid { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; align-items: center; }
  .how-grid .chord-card { max-width: 170px; }
  .how-list { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 12px; font-size: 14px; line-height: 1.6; }
  .how-list dt { font-weight: 700; font-family: var(--font-mono); color: var(--accent); text-align: center; min-width: 28px; }
  .how-list dd { margin: 0; }

  .step-strip { display: flex; flex-direction: column; gap: 4px; }
  .step-notes { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
  .step-note {
    font-family: var(--font-body);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    border-radius: 10px;
    padding: 6px 0;
    min-height: 48px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.25;
  }
  .step-note b { font-family: var(--font-mono); font-size: 16px; }
  .step-note span { font-size: 11px; color: var(--ink-muted); }
  .step-gaps { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 0 6.25%; }
  .step-gap { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-faint); }
  .step-gap.is-half { color: var(--bad); }

  .staff-wrap { background: var(--surface); border: 1px solid var(--border); padding: 8px; }
  .staff-col { cursor: pointer; }
  .staff-col.is-hit .staff-head { fill: var(--accent); }

  .dur-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .dur-table th, .dur-table td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
  .dur-table th { font-size: 12px; color: var(--ink-muted); font-weight: 600; }
  .dur-table td.icon { width: 44px; }
  .dur-table svg { display: block; width: 34px; height: 40px; }
  .dur-table .dur-beats { font-family: var(--font-mono); font-weight: 700; white-space: nowrap; }
  .dur-bar { display: flex; gap: 2px; min-width: 96px; }
  .dur-bar span { flex: 1; height: 12px; border-radius: 3px; background: var(--accent); }
  .dur-bar span.rest { background: var(--surface-2); border: 1px dashed var(--ink-faint); }

  .menu-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .menu-item {
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr) auto;
    gap: 4px 12px;
    align-items: center;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.55;
  }
  .menu-no {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 13px;
  }
  .menu-item b { display: block; font-size: 15px; }
  .menu-item a { font-size: 13px; }
  .menu-min { font-family: var(--font-mono); font-weight: 700; color: var(--accent); white-space: nowrap; }
  .menu-total { text-align: right; font-size: 13.5px; font-weight: 700; color: var(--ink-muted); margin-top: 4px; }

  /* ---------- コードカード(chords.html と同じ) ---------- */
  .chord-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 190px)); gap: 12px; margin: 18px 0; }
  .chord-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .chord-card.is-ringing { animation: ring 0.6s ease; }
  @keyframes ring { 0% { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); } 100% { border-color: var(--border); box-shadow: 0 1px 2px var(--shadow); } }
  .chord-tap {
    font-family: var(--font-body);
    background: none;
    border: none;
    color: var(--ink);
    padding: 4px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .chord-tap:hover { background: var(--surface-2); }
  .chord-name { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.2; }
  .chord-sub { font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--ink-muted); margin-left: 4px; }
  .chord-read { font-size: 11.5px; color: var(--ink-faint); }
  .chord-svg { display: block; width: 100%; max-width: 150px; height: auto; margin-top: 4px; }
  .chord-hint { font-size: 11px; color: var(--accent); font-weight: 600; }
  .chord-strings { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
  .string-btn {
    font-family: var(--font-mono);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    border-radius: 7px;
    min-height: 38px;
    padding: 2px 0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.15;
  }
  .string-btn:disabled { cursor: default; background: none; color: var(--ink-faint); }
  .string-no { font-size: 9.5px; color: var(--ink-faint); }
  .string-note { font-size: 12px; font-weight: 700; }
  .chord-note { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-muted); }

  /* ---------- TAB譜 ---------- */
  .tab-block {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 12px 10px;
    background: var(--surface);
    margin: 18px 0;
  }
  .tab-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .tab-title { font-size: 13.5px; font-weight: 700; line-height: 1.5; }
  .tab-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .tab-ctl .chips { padding: 0; }
  .tab-bars { display: flex; flex-wrap: wrap; row-gap: 10px; }
  .tab-bar { display: block; height: 84px; width: auto; flex: none; }
  .tab-bar + .tab-bar { margin-left: -1.5px; }
  .tab-ev { cursor: pointer; }
  .tab-ev .tab-num-bg { fill: var(--surface); }
  .tab-ev text { font-family: var(--font-mono); font-size: 13px; font-weight: 700; fill: var(--ink); }
  .tab-ev .tab-hit { fill: transparent; }
  .tab-ev:hover .tab-hit { fill: var(--accent-soft); }
  .tab-ev.is-on .tab-hit { fill: var(--accent-soft); }
  .tab-ev.is-on text { fill: var(--accent); }
  .tab-ev:focus { outline: none; }
  .tab-ev:focus-visible .tab-hit { stroke: var(--accent); stroke-width: 2; }
  .tab-legend { margin: 6px 0 0; font-size: 12px; color: var(--ink-faint); }

  /* ---------- 練習道具 ---------- */
  section.mini {
    border: 1.5px solid var(--accent-soft);
    border-radius: 14px;
    padding: 16px;
    background: var(--surface);
    font-size: 14.5px;
    line-height: 1.6;
    margin: 22px 0;
  }
  .mini-tag { margin: 0 0 2px; font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--accent); }
  .lesson-body section.mini h3.mini-title { margin: 0 0 10px; font-size: 16px; font-weight: 600; line-height: 1.5; }
  .mini > * + * { margin-top: 10px; }
  .ctl-label { font-size: 12.5px; font-weight: 600; color: var(--ink-muted); }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn-row > * { flex: 1 1 120px; }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 6px 0 0; }
  .check-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; min-height: 36px; }
  input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 0; cursor: pointer; }
  .audio-note { font-size: 12px; color: var(--ink-faint); }

  .tuner-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  .tuner-btn {
    font-family: var(--font-body);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    border-radius: 12px;
    padding: 10px 4px;
    min-height: 72px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    line-height: 1.2;
  }
  .tuner-btn .t-str { font-size: 12px; color: var(--ink-muted); font-weight: 600; }
  .tuner-btn .t-note { font-family: var(--font-mono); font-size: 18px; font-weight: 700; }
  .tuner-btn .t-do { font-size: 12px; color: var(--ink-faint); }
  .tuner-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .choice-btn.correct { border-color: var(--good); background: var(--good-soft); color: var(--good); }

<script>
(function () {
  "use strict";

  var KEY = "guitarBeginnerCourseProgress";
  var L = GUITAR_LESSONS;
  var N = L.length;
  var PARTS = L.parts;
  var KEYS = ["A", "B", "C", "D"];
  var G = Guitar;
  var svgEl = G.svgEl;

  // ---------- 保存 ----------
  // { done: [id…], lastId: 最後に開いたレッスンの id(""= まだ) }
  var LESSON_IDS = L.map(function (l) { return l.id; });
  function sanitize(raw) {
    raw = raw && typeof raw === "object" ? raw : {};
    var done = [];
    if (Array.isArray(raw.done)) raw.done.forEach(function (v) { if (LESSON_IDS.indexOf(v) >= 0 && done.indexOf(v) < 0) done.push(v); });
    var lastId = typeof raw.lastId === "string" && LESSON_IDS.indexOf(raw.lastId) >= 0 ? raw.lastId : "";
    return { done: done, lastId: lastId };
  }
  var state = sanitize(Store.load(KEY, null));
  function save() { Store.save(KEY, state); }
  function isDone(id) { return state.done.indexOf(id) >= 0; }
  function setDone(id, on) {
    var i = state.done.indexOf(id);
    if (on && i < 0) state.done.push(id);
    if (!on && i >= 0) state.done.splice(i, 1);
    save();
  }
  function doneCount() { return state.done.length; }
  // 続き: 最後に開いたレッスンから先の最初の未完了。なければ最初の未完了
  function resumeLesson() {
    var from = Math.max(0, LESSON_IDS.indexOf(state.lastId)), k;
    for (k = from; k < N; k++) if (!isDone(L[k].id)) return L[k];
    for (k = 0; k < N; k++) if (!isDone(L[k].id)) return L[k];
    return null;
  }

  // ---------- 小さな道具 ----------
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function html(tag, cls, h) { var e = el(tag, cls); e.innerHTML = h; return e; }
  function link(href, cls, text) { var a = el("a", cls, text); a.href = href; return a; }
  function button(cls, text, onClick) {
    var b = el("button", cls, text);
    b.type = "button";
    if (onClick) b.addEventListener("click", onClick);
    return b;
  }
  // チップの選択。opts: [{ v, label }]。戻り値の .set(v) で外から選び直せる
  function chipGroup(label, opts, cur, onChange) {
    var wrap = el("div", "ctl");
    if (label) wrap.appendChild(el("div", "ctl-label", label));
    var box = el("div", "chips");
    box.setAttribute("role", "group");
    if (label) box.setAttribute("aria-label", label);
    var btns = opts.map(function (o) {
      var b = button("chip-btn", o.label, function () { set(o.v); onChange(o.v); });
      b.dataset.v = String(o.v);
      b.setAttribute("aria-pressed", String(o.v === cur));
      box.appendChild(b);
      return b;
    });
    function set(v) { btns.forEach(function (b, i) { b.setAttribute("aria-pressed", String(opts[i].v === v)); }); }
    wrap.appendChild(box);
    wrap.set = set;
    wrap.buttons = btns;
    return wrap;
  }
  // テンポのスライダー(BPM)
  function bpmField(min, max, cur, onInput) {
    var f = el("div", "ctl");
    var top = el("div", "ctl-label");
    top.appendChild(document.createTextNode("テンポ "));
    var val = el("span", "val", "BPM " + cur);
    top.appendChild(val);
    f.appendChild(top);
    var inp = el("input");
    inp.type = "range"; inp.min = min; inp.max = max; inp.step = 1; inp.value = cur;
    inp.setAttribute("aria-label", "テンポ(BPM)");
    inp.addEventListener("input", function () { var v = parseInt(inp.value, 10); val.textContent = "BPM " + v; onInput(v); });
    f.appendChild(inp);
    return f;
  }
  function checkField(text, on, onChange) {
    var lab = el("label", "check-label");
    var cb = el("input");
    cb.type = "checkbox";
    cb.checked = on;
    cb.addEventListener("change", function () { onChange(cb.checked); });
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(text));
    return lab;
  }
  function beatDots(n) {
    var box = el("div", "beats");
    box.setAttribute("aria-hidden", "true");
    var dots = [];
    for (var i = 0; i < n; i++) {
      var d = el("span", "beat" + (i === 0 ? " is-accent" : ""), String(i + 1));
      box.appendChild(d);
      dots.push(d);
    }
    box.show = function (k) { dots.forEach(function (d, i) { d.classList.toggle("is-on", i === k); }); };
    return box;
  }
  function flash(node) {
    node.classList.remove("is-hit");
    void node.getBoundingClientRect();
    node.classList.add("is-hit");
    setTimeout(function () { node.classList.remove("is-hit"); }, 350);
  }
  // SVG の中の要素をボタンとして使う
  function svgButton(g, label, onPress) {
    g.setAttribute("role", "button");
    g.setAttribute("tabindex", "0");
    g.setAttribute("aria-label", label);
    g.addEventListener("click", onPress);
    g.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPress(); }
    });
  }
  function svgText(x, y, str, attrs) {
    var t = svgEl("text", attrs || {});
    t.setAttribute("x", x);
    t.setAttribute("y", y);
    t.textContent = str;
    return t;
  }
  function noteJa(midi) {
    var d = G.doremi(midi);
    return G.noteName(midi) + (d ? "(" + d + ")" : "");
  }

  // ---------- 指板の図(横向き。上が1弦) ----------
  // o: { min, max, marks: [{ s, f, text, kind: "note"|"root"|"tone2" }], minWidth, label }
  function fretRaw(n) { return 1 - Math.pow(2, -n / 12); }
  function fretboard(o) {
    var hasOpen = o.min === 0;
    var first = hasOpen ? 1 : o.min;
    var BW = o.boardWidth || 520;
    var r0 = fretRaw(first - 1), k = BW / (fretRaw(o.max) - r0);
    function wx(n) { return (fretRaw(n) - r0) * k; }
    function cellX(f) { return f === 0 ? -34 : (wx(f - 1) + wx(f)) / 2; }
    var top = 26, gap = 30, bottom = top + gap * 5;
    function sy(s) { return top + (s - 1) * gap; }
    var left = hasOpen ? -104 : -60, right = BW + 18, H = bottom + 42;
    var svg = svgEl("svg", { viewBox: left + " 0 " + (right - left) + " " + H, class: "fig-svg", role: "group" });
    svg.setAttribute("aria-label", o.label || "指板の図");
    svg.style.minWidth = (o.minWidth || 460) + "px";
    var gid = "wood" + Math.random().toString(36).slice(2, 8);
    var defs = svgEl("defs", {});
    defs.innerHTML = '<linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--wood-a)"/><stop offset="100%" stop-color="var(--wood-b)"/></linearGradient>';
    svg.appendChild(defs);
    svg.appendChild(svgEl("rect", { x: left, y: 0, width: right - left, height: H, fill: "url(#" + gid + ")" }));
    // 目印の点
    [3, 5, 7, 9, 15].forEach(function (n) {
      if (n < first || n > o.max) return;
      svg.appendChild(svgEl("circle", { cx: cellX(n), cy: (sy(3) + sy(4)) / 2, r: 5, fill: "var(--inlay)", opacity: 0.45 }));
    });
    if (o.max >= 12 && first <= 12) {
      [sy(2) + gap / 2, sy(4) + gap / 2].forEach(function (y) {
        svg.appendChild(svgEl("circle", { cx: cellX(12), cy: y, r: 5, fill: "var(--inlay)", opacity: 0.45 }));
      });
    }
    // フレット
    for (var n = first - 1; n <= o.max; n++) {
      if (n === 0) continue;
      svg.appendChild(svgEl("line", { x1: wx(n), y1: top - 12, x2: wx(n), y2: bottom + 12, stroke: "var(--fret-wire)", "stroke-width": 2.5, "stroke-linecap": "round" }));
    }
    if (hasOpen) svg.appendChild(svgEl("line", { x1: 0, y1: top - 14, x2: 0, y2: bottom + 14, stroke: "var(--nut)", "stroke-width": 6, "stroke-linecap": "round" }));
    // 弦
    for (var s = 1; s <= 6; s++) {
      svg.appendChild(svgEl("line", {
        x1: hasOpen ? -56 : left + 44, y1: sy(s), x2: right, y2: sy(s),
        stroke: s <= 3 ? "var(--string-steel)" : "var(--string-bronze)", "stroke-width": 1.2 + (s - 1) * 0.5
      }));
      svg.appendChild(svgText(left + 8, sy(s) + 4.5, s + "弦", { "font-size": 13, "font-weight": 700, fill: "var(--inlay)", opacity: 0.8 }));
    }
    // フレット番号(部屋の真ん中)
    for (var f = hasOpen ? 0 : first; f <= o.max; f++) {
      svg.appendChild(svgText(cellX(f), bottom + 30, String(f), {

  // ---------- TAB譜 ----------
  // cfg: { title, bpm, events }  onEvent(ev): 再生中・タップのとき(ペンタトニックの指板と連動)
  function tabView(cfg, onEvent) {
    var box = el("div", "tab-block");
    var head = el("div", "tab-top");
    head.appendChild(el("span", "tab-title", cfg.title || "TAB譜"));
    var ctl = el("div", "tab-ctl");
    var speeds = [{ v: Math.round(cfg.bpm * 0.7), label: "ゆっくり" }, { v: cfg.bpm, label: "ふつう" }];
    var bpm = speeds[1].v;
    ctl.appendChild(chipGroup("", speeds, bpm, function (v) { bpm = v; }));
    var play = button("btn-small", "▶ 再生");
    ctl.appendChild(play);
    head.appendChild(ctl);
    box.appendChild(head);

    var notes = []; // 音の出る出来事だけ(小節線をのぞく)
    var bars = [[]];
    cfg.events.forEach(function (e) {
      if (e === "|") { bars.push([]); return; }
      var ev = Array.isArray(e) ? { notes: [[e[0], e[1]]], d: e[2] || 1 } : { notes: e.c, d: e.d || 1 };
      bars[bars.length - 1].push(ev);
      notes.push(ev);
    });
    bars = bars.filter(function (b) { return b.length; });
    var row = el("div", "tab-bars");
    var top = 12, gap = 12, H = 84;
    function ly(s) { return top + (s - 1) * gap; }
    bars.forEach(function (bar, bi) {
      var widths = bar.map(function (ev) { return 22 + ev.d * 6; });
      var W = 6 + widths.reduce(function (a, b) { return a + b; }, 0);
      var svg = svgEl("svg", { class: "tab-bar", viewBox: "0 0 " + W + " " + H, width: W, height: H, role: "group" });
      svg.setAttribute("aria-label", "第" + (bi + 1) + "小節");
      for (var s = 1; s <= 6; s++) svg.appendChild(svgEl("line", { x1: 0, y1: ly(s), x2: W, y2: ly(s), stroke: "var(--tab-line)", "stroke-width": 1 }));
      svg.appendChild(svgEl("line", { x1: 0.75, y1: ly(1), x2: 0.75, y2: ly(6), stroke: "var(--diagram-line)", "stroke-width": 1.5 }));
      svg.appendChild(svgEl("line", { x1: W - 0.75, y1: ly(1), x2: W - 0.75, y2: ly(6), stroke: "var(--diagram-line)", "stroke-width": 1.5 }));
      var x = 6;
      bar.forEach(function (ev, k) {
        var cx = x + widths[k] / 2;
        var g = svgEl("g", { class: "tab-ev" });
        g.appendChild(svgEl("rect", { class: "tab-hit", x: cx - 11, y: 2, width: 22, height: H - 4, rx: 6 }));
        ev.notes.forEach(function (nt) {
          var str = String(nt[1]);
          var w = str.length > 1 ? 16 : 10;
          g.appendChild(svgEl("rect", { class: "tab-num-bg", x: cx - w / 2, y: ly(nt[0]) - 6, width: w, height: 12 }));
          g.appendChild(svgText(cx, ly(nt[0]) + 4.6, str, { "text-anchor": "middle" }));
        });
        var label = ev.notes.map(function (nt) { return nt[0] + "弦" + (nt[1] === 0 ? "開放" : nt[1] + "フレット"); }).join("、");
        svgButton(g, label + "を鳴らす", function () { sound(ev, 0); light(ev); });
        ev.g = g;
        svg.appendChild(g);
        x += widths[k];
      });
      row.appendChild(svg);
    });
    box.appendChild(row);
    box.appendChild(el("p", "tab-legend", "上の線が1弦、下の線が6弦。数字はフレット(0は開放弦)。"));

    function sound(ev, t) {
      if (ev.notes.length > 1) {
        var frets = [-1, -1, -1, -1, -1, -1];
        ev.notes.forEach(function (nt) { frets[6 - nt[0]] = nt[1]; });
        G.strum({ frets: frets }, t, { spread: 0.03 });
      } else {
        G.playFret(ev.notes[0][0], ev.notes[0][1], t, 0.55);
      }
    }
    var lit = null;
    function light(ev) {
      if (lit) lit.g.classList.remove("is-on");
      lit = ev;
      if (ev) ev.g.classList.add("is-on");
      if (ev && onEvent) onEvent(ev);
    }
    var ticker = G.Ticker({
      interval: function (i) { return (60 / bpm) * (i < notes.length ? notes[i].d : 1); },
      onSchedule: function (i, t) { if (i < notes.length) sound(notes[i], t); },
      onBeat: function (i) {
        if (i >= notes.length) { ticker.stop(); return; }
        light(notes[i]);
      },
      onStop: function () { play.textContent = "▶ 再生"; light(null); }
    });
    play.addEventListener("click", function () {
      if (ticker.playing) { ticker.stop(); return; }
      if (ticker.start()) play.textContent = "■ 停止";
    });
    return box;
  }

    },
    pentatonic: {
      title: "Aマイナーペンタトニック(第1ポジション)",
      render: function (box) {
        var PTS = [[6, 5], [6, 8], [5, 5], [5, 7], [4, 5], [4, 7], [3, 5], [3, 7], [2, 5], [2, 8], [1, 5], [1, 8]];
        var FINGER = { 5: "1", 7: "3", 8: "4" };
        var mode = "note", boardBox = el("div");
        function marks() {
          return PTS.map(function (p) {
            var m = G.midiOf(p[0], p[1]), n = G.noteName(m);
            return { s: p[0], f: p[1], text: mode === "note" ? n : FINGER[p[1]], kind: n === "A" ? "root" : "note" };
          });
        }
        var board = null;
        function draw() {
          board = fretboard({ min: 4, max: 9, marks: marks(), label: "Aマイナーペンタトニック第1ポジションの図", minWidth: 280, boardWidth: 300 });
          boardBox.replaceChildren(board);
        }
        box.appendChild(chipGroup("丸の中に出すもの", [{ v: "note", label: "音名" }, { v: "finger", label: "指番号" }], mode, function (v) { mode = v; draw(); }));
        draw();
        box.appendChild(boardBox);
        box.appendChild(el("p", "hint", "明るい丸がルートのA。丸をタップすると鳴ります。"));
        var events = [];
        PTS.forEach(function (p) { events.push([p[0], p[1], 1]); });
        PTS.slice(0, -1).reverse().forEach(function (p) { events.push([p[0], p[1], 1]); });
        var withBars = [];
        events.forEach(function (e, i) { withBars.push(e); if (i % 4 === 3 || i === events.length - 1) withBars.push("|"); });
        box.appendChild(tabView({ title: "上がって下がる(TAB譜)", bpm: 80, events: withBars }, function (ev) {
          var nt = ev.notes[0];
          var g = board && board.mark(nt[0], nt[1]);
          if (g) flash(g);
        }));
      }
    }
  };

  // ---------- 画面 ----------
  var app = document.getElementById("app");
  var hero = document.getElementById("hero");
  var view = document.getElementById("view");
  var mqPC = window.matchMedia("(min-width: 820px)");
  var cleanups = [];

  function lessonHref(no) { return "#lesson-" + no; }
  function progressEl() {
    var p = el("div", "progress");
    var track = el("div", "progress-track");
    track.setAttribute("aria-hidden", "true");
    var bar = el("div", "progress-bar");
    bar.style.width = (doneCount() / N * 100) + "%";
    track.appendChild(bar);
    p.appendChild(track);
    p.appendChild(el("span", "progress-text", doneCount() + " / " + N + " 終了"));
    return p;
  }
  function partOf(no) {
    for (var i = 0; i < PARTS.length; i++) if (PARTS[i].no === no) return PARTS[i];
    return null;
  }
  function partLabel(pt) { return "第" + pt.no + "部 " + pt.title; }
  function lessonsOf(pt) { return L.filter(function (ls) { return ls.part === pt.no; }); }

  function lessonRow(ls) {
    var li = el("li");
    var done = isDone(ls.id);
    var a = link(lessonHref(ls.no), "lesson-row" + (done ? " is-done" : ""));
    var num = el("span", "lesson-num", done ? "✓" : String(ls.no));
    num.setAttribute("aria-hidden", "true");
    a.appendChild(num);
    var main = el("span", "lesson-main");
    var tt = el("span", "lesson-title", "レッスン" + ls.no + " " + ls.title);
    if (done) tt.appendChild(el("span", "sr-only", "(終了)"));
    main.appendChild(tt);
    main.appendChild(el("span", "lesson-summary", ls.summary));
    var meta = el("span", "lesson-meta");
    meta.appendChild(el("span", "chip", "約" + ls.minutes + "分"));
    if (ls.body.some(function (b) { return b.t === "mini" || b.t === "tab" || b.t === "chords"; })) meta.appendChild(el("span", "chip", "音が出る"));
    if (ls.practice.length) meta.appendChild(el("span", "chip", "練習ページあり"));
    main.appendChild(meta);
    a.appendChild(main);
    li.appendChild(a);
    return li;
  }

  function renderTop() {
    var v = el("div", "view-top");
    var minutes = L.reduce(function (sum, ls) { return sum + ls.minutes; }, 0);
    var intro = el("section", "card course-intro");
    intro.appendChild(el("h2", "", "このコースについて"));
    var ul = el("ul");
    ["ギターをはじめて持つ人向け。部分の名前とチューニングから始めます",
      "全" + N + "レッスン(約" + minutes + "分)、" + PARTS.length + "つの部。1日1〜2レッスンずつ、ギターを持って進めるのがおすすめです",
      "各レッスンに、音の出る図や練習道具、確認問題、練習ページへのリンクがあります",
      "終えたしるしは、このブラウザにだけ保存されます"].forEach(function (t) { ul.appendChild(el("li", "", t)); });
    intro.appendChild(ul);
    v.appendChild(intro);
    v.appendChild(progressEl());
    var next = resumeLesson();
    var resume;
    if (doneCount() === 0 && !state.lastId) resume = link(lessonHref(1), "btn-primary resume", "レッスン1からはじめる →");
    else if (next) resume = link(lessonHref(next.no), "btn-primary resume", "続きから: レッスン" + next.no + " " + next.short + " →");
    else resume = link(lessonHref(1), "btn-secondary resume", "もう一度レッスン1から");
    v.appendChild(resume);
    var tl = el("div", "top-links");
    tl.appendChild(link("chords.html", "btn-secondary", "コード帳(押さえ方の一覧)→"));
    tl.appendChild(link(lessonHref(5), "btn-secondary", "メトロノーム(レッスン5)→"));
    v.appendChild(tl);

    PARTS.forEach(function (pt) {
      var block = el("section", "part-block");
      var hid = "part-" + pt.no;
      block.setAttribute("aria-labelledby", hid);
      var head = el("div", "part-head");
      head.appendChild(el("p", "part-no", "PART " + pt.no));
      var h = el("h2", "", partLabel(pt));
      h.id = hid;
      head.appendChild(h);
      head.appendChild(el("p", "part-desc", pt.desc));
      block.appendChild(head);
      var ol = el("ol", "lesson-list");
      ol.setAttribute("aria-labelledby", hid);
      lessonsOf(pt).forEach(function (ls) { ol.appendChild(lessonRow(ls)); });
      block.appendChild(ol);
      v.appendChild(block);
    });

    if (doneCount() === N) {
      var sum = el("section", "card summary-card");
      sum.appendChild(el("h2", "", "総まとめ: ここだけ覚える"));
      PARTS.forEach(function (pt) {
        sum.appendChild(el("p", "summary-part", partLabel(pt)));
        lessonsOf(pt).forEach(function (ls) {
          sum.appendChild(el("h3", "", "レッスン" + ls.no + " " + ls.title));
          var u = el("ul");
          ls.points.forEach(function (p) { u.appendChild(el("li", "", p)); });
          sum.appendChild(u);
        });
      });
      v.appendChild(sum);
    }
    view.replaceChildren(v);
  }

  function fillToc(toc, cur) {
    toc.replaceChildren();
    var sm = el("summary");
    sm.appendChild(el("span", "", "目次 ・ " + doneCount() + "/" + N + " 終了"));
    var arrow = el("span", "arrow", "▾");
    arrow.setAttribute("aria-hidden", "true");
    sm.appendChild(arrow);
    toc.appendChild(sm);
    var head = el("div", "toc-head");
    head.appendChild(el("span", "", "目次"));
    head.appendChild(el("span", "progress-text", doneCount() + "/" + N + " 終了"));
    toc.appendChild(head);
    var bodyBox = el("div", "toc-body");
    PARTS.forEach(function (pt) {
      var pid = "toc-part-" + pt.no;
      var ph = el("p", "toc-part", partLabel(pt));
      ph.id = pid;
      bodyBox.appendChild(ph);
      var ol = el("ol", "toc-list");
      ol.setAttribute("aria-labelledby", pid);
      lessonsOf(pt).forEach(function (ls) {
        var li = el("li");
        var done = isDone(ls.id);
        var a = link(lessonHref(ls.no), "toc-item" + (ls.no === cur ? " is-current" : "") + (done ? " is-done" : ""));
        if (ls.no === cur) a.setAttribute("aria-current", "page");
        a.appendChild(el("span", "toc-no", done ? "✓" : String(ls.no)));
        a.appendChild(el("span", "", ls.short));
        if (done) a.setAttribute("aria-label", "レッスン" + ls.no + " " + ls.short + "(終了)");
        a.addEventListener("click", function () { if (!mqPC.matches) toc.open = false; });
        li.appendChild(a);
        ol.appendChild(li);
      });
      bodyBox.appendChild(ol);
    });
    toc.appendChild(bodyBox);
    toc.appendChild(link("#top", "toc-top", "← コースのトップ"));
  }

  function renderBody(ls, body) {
    ls.body.forEach(function (b) {
      if (b.t === "p") body.appendChild(html("p", "", b.html));
      else if (b.t === "h") body.appendChild(el("h3", "", b.text));
      else if (b.t === "tip" || b.t === "note") {
        var d = el("div", b.t === "tip" ? "tip-box" : "note-box");
        d.appendChild(el("span", "box-label", b.t === "tip" ? "コツ" : "ひとこと"));
        d.appendChild(html("span", "", b.html));
        body.appendChild(d);
      } else if (b.t === "list") {
        var ul = el(b.ordered ? "ol" : "ul");
        b.items.forEach(function (it) { ul.appendChild(html("li", "", it)); });
        body.appendChild(ul);
      } else if (b.t === "figure" && FIGURES[b.id]) {
        body.appendChild(FIGURES[b.id]());
      } else if (b.t === "chords") {
        body.appendChild(chordRow(b.ids));
      } else if (b.t === "tab") {
        body.appendChild(tabView(b));
      } else if (b.t === "mini" && MINI[b.id]) {
        var sec = el("section", "mini");
        sec.setAttribute("aria-label", "やってみよう: " + MINI[b.id].title);
        sec.appendChild(el("p", "mini-tag", "やってみよう"));
        sec.appendChild(el("h3", "mini-title", MINI[b.id].title));
        MINI[b.id].render(sec);
        if (sec.cleanup) cleanups.push(sec.cleanup);
        body.appendChild(sec);
      }
    });
  }

  function renderQuiz(ls) {
    var sec = el("section", "quiz");
    sec.appendChild(el("h3", "", "確認問題"));
    ls.quiz.forEach(function (q, qi) {
      var item = el("div", "quiz-item");
      item.appendChild(el("p", "quiz-q", "Q" + (qi + 1) + ". " + q.q));
      var ch = el("div", "choices");
      var fb = el("p", "feedback");
      fb.hidden = true;
      fb.setAttribute("aria-live", "polite");
      var again = button("btn-small quiz-again", "もう一度");
      again.hidden = true;
      var btns = q.choices.map(function (c, i) {
        var b = button("choice-btn");
        b.appendChild(el("span", "choice-key", KEYS[i]));
        b.appendChild(el("span", "", c));
        b.addEventListener("click", function () {
          var ok = i === q.answer;
          btns.forEach(function (x, j) {
            x.disabled = true;
            if (j === i) x.classList.add(ok ? "correct" : "wrong");
            if (!ok && j === q.answer) x.classList.add("correct");
          });
          fb.className = "feedback " + (ok ? "good" : "bad");
          fb.textContent = ok ? "正解! " + q.explain : "ざんねん。正解は「" + q.choices[q.answer] + "」。" + q.explain;
          fb.hidden = false;
          again.hidden = false;
        });
        ch.appendChild(b);
        return b;
      });
      again.addEventListener("click", function () {
        btns.forEach(function (x) { x.disabled = false; x.classList.remove("correct", "wrong"); });
        fb.hidden = true;
        again.hidden = true;
        btns[0].focus();
      });
      item.appendChild(ch);
      item.appendChild(fb);
      item.appendChild(again);
      sec.appendChild(item);
    });
    return sec;
  }

  function renderPractice(ls) {
    if (!ls.practice.length) return null;
    var sec = el("section", "practice");
    sec.appendChild(el("h3", "", "練習する"));
    var grid = el("div", "practice-grid");
    ls.practice.forEach(function (p) {
      var a = link(p.href, "practice-card");
      a.appendChild(el("span", "practice-tag", "PRACTICE"));
      a.appendChild(el("span", "practice-title", p.title));
      a.appendChild(el("span", "practice-desc", p.desc));
      grid.appendChild(a);
    });
    sec.appendChild(grid);
    return sec;
  }

  function renderLesson(no) {
    var ls = L[no - 1];
    var layout = el("div", "course-layout view-lesson");
    var toc = el("details", "toc");
    fillToc(toc, no);
    toc.open = mqPC.matches;
    layout.appendChild(toc);

    var art = el("article", "card lesson");
    art.setAttribute("aria-labelledby", "lesson-title");
    var head = el("div", "lesson-head");
    var pt = partOf(ls.part);
    head.appendChild(el("p", "lesson-no", "LESSON " + no + " / " + N + (pt ? " ・ 第" + pt.no + "部" : "") + " ・ 約" + ls.minutes + "分"));
    var h2 = el("h2", "lesson-title", ls.title);
    h2.id = "lesson-title";
    h2.tabIndex = -1;
    head.appendChild(h2);
    head.appendChild(el("p", "lesson-lead", ls.summary));
    art.appendChild(head);

    var body = el("div", "lesson-body");
    renderBody(ls, body);
    art.appendChild(body);

    var kp = el("aside", "keypoints");
    kp.appendChild(el("h3", "", "ここだけ覚える"));
    var ul = el("ul");
    ls.points.forEach(function (p) { ul.appendChild(el("li", "", p)); });
    kp.appendChild(ul);
    art.appendChild(kp);

    var pr = renderPractice(ls);
    if (pr) art.appendChild(pr);
    art.appendChild(renderQuiz(ls));

    var foot = el("div", "lesson-foot");
    var tg = button("done-toggle");
    function syncToggle() {
      var d = isDone(ls.id);
      tg.setAttribute("aria-pressed", String(d));
      tg.textContent = d ? "✓ このレッスンを終えました" : "このレッスンを終えた";
    }
    tg.addEventListener("click", function () {
      setDone(ls.id, !isDone(ls.id));
      syncToggle();
      var open = toc.open;
      fillToc(toc, no);
      toc.open = open;
    });
    syncToggle();
    foot.appendChild(tg);

    var pager = el("nav", "pager");
    pager.setAttribute("aria-label", "レッスンの移動");
    var prev;
    if (no === 1) prev = link("#top", "btn-secondary", "← コースのトップ");
    else {
      var pl = L[no - 2];
      prev = link(lessonHref(no - 1), "btn-secondary");
      prev.appendChild(el("span", "lbl-long", "← " + pl.no + ". " + pl.short));
      prev.appendChild(el("span", "lbl-short", "← 前へ"));
    }
    var nx;
    if (no === N) nx = link("#top", "btn-primary", "コースを終える →");
    else {
      var nl = L[no];
      nx = link(lessonHref(no + 1), "btn-primary");
      nx.appendChild(el("span", "lbl-long", "次: " + nl.no + ". " + nl.short + " →"));
      nx.appendChild(el("span", "lbl-short", "次へ →"));
    }
    // 次へ進むときは、今のレッスンを終えたことにする
    nx.addEventListener("click", function () { setDone(ls.id, true); });
    pager.appendChild(prev);
    pager.appendChild(nx);
    foot.appendChild(pager);
    art.appendChild(foot);

    layout.appendChild(art);
    view.replaceChildren(layout);
    return h2;
  }

  function currentLesson() {
    var m = /^#lesson-(\d+)$/.exec(location.hash);
    if (!m) return 0;
    var n = parseInt(m[1], 10);
    return n >= 1 && n <= N ? n : 0;
  }

  function render(changed) {
    // 画面を替えるときは、鳴っている練習道具とタイマーを止める
    G.stopAll();
    cleanups.forEach(function (f) { f(); });
    cleanups = [];
    var no = currentLesson();
    app.classList.toggle("is-lesson", no > 0);
    hero.classList.toggle("is-compact", no > 0);
    var h2 = null;
    if (no) {
      state.lastId = L[no - 1].id;
      save();
      h2 = renderLesson(no);
      document.title = "レッスン" + no + " " + L[no - 1].title + " | ギター入門コース";
    } else {
      renderTop();
      document.title = "ギター入門コース";
    }
    if (changed) {
      window.scrollTo(0, 0);
      if (h2) h2.focus({ preventScroll: true });
    }
  }

  function onMq() {
    var toc = view.querySelector("details.toc");
    if (toc) toc.open = mqPC.matches;
  }
  if (mqPC.addEventListener) mqPC.addEventListener("change", onMq);
  else if (mqPC.addListener) mqPC.addListener(onMq);

  window.addEventListener("hashchange", function () { render(true); });
  render(false);
})();
</script>
</body>
</html>
