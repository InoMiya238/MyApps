<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>中学英語の要点帳</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../shared/base.css">
<link rel="stylesheet" href="theme.css">

<style>
  .app { max-width: 900px; gap: 24px; }

  /* ---------- Hero ---------- */
  .tagline { max-width: 56ch; }
  .site-nav {
    margin: 14px 0 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 18px;
    font-size: 13px;
  }
  .site-nav a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  .site-nav a:hover { text-decoration: underline; }
  .site-nav [aria-current="page"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom: 2px solid var(--accent);
  }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Controls bar ---------- */
  .controls-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 20px;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 20px;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .controls-bar p {
    margin: 0;
    font-size: 13px;
    color: var(--ink-muted);
  }
  .quiz-link {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 9px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }
  .quiz-link.small { padding: 9px 13px; font-size: 12.5px; }

  /* ---------- TOC(分野ごとの列) ---------- */
  .toc {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 22px;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .toc-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }
  .toc-groups {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px 24px;
  }
  .toc-group { min-width: 0; }
  .toc-grade {
    margin: 0 0 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
  }
  .toc ol {
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 13.5px;
  }
  .toc li { margin-bottom: 6px; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .toc li .no {
    flex: none;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .toc a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .toc a:hover { text-decoration: underline; }
  .toc .pending-mark { font-size: 11px; color: var(--ink-faint); font-weight: 400; white-space: nowrap; }
  @media (max-width: 700px) {
    .toc-groups { grid-template-columns: 1fr; gap: 14px; }
  }

  /* ---------- 学年の区切り ---------- */
  .grade-section { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 16px; }
  .grade-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .grade-head h2 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
  }
  .grade-head .unit-count {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-faint);
  }

  /* ---------- Study cards ---------- */
  .study-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px;
  }
  .study-card {
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-margin-top: 16px;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .study-card.wide { grid-column: 1 / -1; }
  .study-card.is-target { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 1px 2px var(--shadow); }

  .study-card h2 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .study-card h2 .num {
    font-family: var(--font-mono);
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
  }
  .study-card .tag {
    align-self: flex-start;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--accent);
    background: var(--surface-2);
    padding: 3px 9px;
    border-radius: 999px;
  }
  .study-card > p {
    margin: 0;
    color: var(--ink-muted);
    font-size: 13.5px;
    line-height: 1.7;
  }
  .card-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  /* 要点と、そのすぐ下の表・語順の枠 */
  .card-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .chart { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  /* 表のある単元: 要点と表(左)、例題(右)を並べる */
  .study-card.wide .card-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px 24px;
    align-items: start;
  }
  .points {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    color: var(--ink-muted);
    font-size: 13.5px;
    line-height: 1.8;
  }
  .points li {
    position: relative;
    padding-left: 14px;
    overflow-wrap: anywhere;
  }
  .points li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.75em;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }
  .points b:not(.key) { color: var(--ink); font-weight: 700; }

  .example {
    background: var(--surface-2);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .example .ex-title {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
  }
  .example .ex-q {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  /* 問いの文の中に置いた例文・会話・表 */
  .example .ex-q > div, .example .ex-q > table { margin-top: 8px; margin-bottom: 8px; }
  .example .ex-q > :first-child { margin-top: 0; }
  .example .ex-q > :last-child { margin-bottom: 0; }
  .example .steps {
    font-size: 13px;
    line-height: 1.85;
    color: var(--ink);
    padding-left: 10px;
    border-left: 2px solid var(--border);
  }
  .example .result {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--good);
    margin-top: 2px;
    overflow-wrap: anywhere;
  }
  .example .result::before { content: "答え "; font-size: 11px; font-weight: 600; color: var(--ink-faint); margin-right: 4px; }

  .pending {
    padding: 12px 14px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    color: var(--ink-faint);
    font-size: 13px;
  }

  .card-foot {
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 12px;
  }
  .unit-stat {
    font-size: 12.5px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .weak-tag {
    display: inline-block;
    margin-left: 6px;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1;
    color: var(--bad);
    background: var(--bad-soft);
    border: 1px solid var(--bad);
    border-radius: 999px;
    padding: 3px 7px;
  }

  footer.cta {
    text-align: center;
    padding: 8px 0 0;
  }
  footer.cta p {
    margin: 10px 0 0;
    color: var(--ink-muted);
    font-size: 13px;
  }

  /* ===== 英語の表示部品(index.html と reference.html で同じ内容。変えるときは両方を直す) ===== */
  .steps { display: flex; flex-direction: column; gap: 3px; }
  .step { min-width: 0; overflow-wrap: anywhere; }
  .rule { color: var(--accent); font-weight: 700; }

  /* 日本語の文中の英語 */
  .en { font-family: var(--font-body); font-weight: 600; color: var(--ink); overflow-wrap: break-word; }
  .choice-btn .en, .miss-item .given .en, .miss-item .correct .en, .example .result .en { color: inherit; }
  .choices:not(.grid) .choice-btn .en { font-size: 16px; }

  /* 例文 */
  .eibun {
    margin: 0; padding: 12px 16px;
    background: var(--surface-2);
    border-left: 3px solid var(--accent);
    border-radius: 4px 10px 10px 4px;
    display: flex; flex-direction: column; gap: 8px;
    text-align: left; min-width: 0;
  }
  .eibun p { margin: 0; }
  .eibun-pair { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .eibun-en { font-size: 17px; font-weight: 500; line-height: 1.7; color: var(--ink); overflow-wrap: break-word; }
  .eibun-ja { font-size: 13.5px; line-height: 1.7; color: var(--ink-muted); }
  .kaiwa-row { display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: 6px; align-items: baseline; }
  .kaiwa-who { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--accent); }
  /* surface-2 や色つきの面の上では、面を --surface にして沈まないようにする */
  .example .eibun, .feedback .eibun, .example .gojun-slot, .feedback .gojun-slot { background: var(--surface); }
  .miss-q .eibun { padding: 8px 12px; margin-top: 6px; }
  .miss-q .eibun-en { font-size: 15px; }

  /* 空所 */
  .blank {
    display: inline-block; min-width: 3.2em; height: 1.3em; margin: 0 0.15em;
    border-bottom: 2px solid var(--accent);
    vertical-align: -0.2em; text-align: center; line-height: 1.3;
    font-size: 0.72em; font-weight: 700; color: var(--accent);   /* 番号つきのとき */
  }
  .nobr { white-space: nowrap; }
  .blank.filled { min-width: 2em; height: auto; padding: 0 0.35em; font-size: 1em; vertical-align: baseline; }

  /* 注目する語 */
  .chumoku {
    text-decoration: underline solid var(--accent);
    text-decoration-thickness: 2px;
    text-underline-offset: 0.24em;
  }
  .chumoku-no { font-size: 0.7em; font-weight: 700; color: var(--accent); margin-right: 0.15em; }
  .key { color: var(--accent); font-weight: 700; }
  .henka { white-space: nowrap; font-weight: 600; color: var(--ink); }
  .henka-arrow { color: var(--ink-faint); font-weight: 400; margin: 0 0.15em; }

  /* 誤文と正文 */
  .seigo { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .seigo p { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.7; color: var(--ink); overflow-wrap: break-word; }
  .seigo-mark { display: inline-block; width: 1.4em; font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; font-weight: 700; }
  .seigo-ng .seigo-mark { color: var(--bad); }
  .seigo-ok .seigo-mark { color: var(--good); }

  /* 表 */
  .en-table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.5; color: var(--ink); }
  .en-table th, .en-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  .en-table th { background: var(--surface-2); font-weight: 600; font-size: 12px; color: var(--ink-muted); overflow-wrap: anywhere; }
  .en-table td[lang="en"] { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .en-table caption { font-size: 12px; color: var(--ink-faint); text-align: left; padding-bottom: 6px; }
  .en-table.compact th, .en-table.compact td { padding: 5px 6px; }
  .en-table.compact td[lang="en"] { font-size: 13.5px; }
  .example .en-table th, .feedback .en-table th { background: var(--surface); }
  .miss-q .en-table, .miss-q .gojun-set, .miss-q .seigo { margin-top: 6px; }

  /* 語順 */
  .gojun-set { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .gojun-label { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-faint); }
  .gojun { display: flex; flex-wrap: wrap; gap: 6px; }
  .gojun-slot {
    display: inline-flex; flex-direction: column; gap: 1px; max-width: 100%;
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); text-align: left;
  }
  .gojun-role { font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-faint); }
  .gojun-en { font-size: 16px; font-weight: 600; line-height: 1.4; color: var(--ink); overflow-wrap: break-word; }
  .gojun-ja { font-size: 11.5px; line-height: 1.4; color: var(--ink-muted); }
  .gojun-slot.is-key, .example .gojun-slot.is-key, .feedback .gojun-slot.is-key { border-color: var(--accent); background: var(--accent-soft); }
  .gojun-slot.is-key .gojun-role { color: var(--accent); }

  @media (max-width: 480px) {
    .eibun { padding: 10px 12px; }
    .eibun-en { font-size: 16px; }
    .gojun-en { font-size: 15px; }
  }
  /* ===== 英語の表示部品 ここまで ===== */

  @media (max-width: 700px) {
    .study-grid { grid-template-columns: minmax(0, 1fr); }
    .study-card.wide .card-body { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 480px) {
    .controls-bar { padding: 14px 16px; }
    .toc { padding: 16px; }
    .study-card { padding: 16px; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="page-links" aria-label="ページの移動">
    <a class="back-link" href="../../../index.html">← ページ一覧</a>
    <a class="back-link" href="../../../study/review/habit-planner/index.html">習慣プランナー →</a>
  </nav>
  <header class="hero">
    <p class="eyebrow" id="eyebrow">JUNIOR HIGH ENGLISH · 中1 全13単元</p>
    <h1>中学英語の要点帳</h1>
    <p class="tagline">単元ごとの要点と例題をまとめた早見帳です。読んだらその単元のクイズへ進めます。</p>
    <nav class="site-nav" aria-label="中学英語道場のページ">
      <a href="index.html">クイズ道場</a>
      <span aria-current="page">要点帳</span>
      <a href="vocab.html">単語帳</a>
    </nav>
  </header>

  <section class="controls-bar" aria-label="ナビゲーション">
    <p>読んだらその単元のクイズへ。各単元の下のボタンから進めます。</p>
    <a class="quiz-link" href="index.html">道場でクイズに挑戦 →</a>
  </section>

  <nav class="toc" aria-label="目次">
    <p class="toc-title">目次</p>
    <div class="toc-groups" id="tocGroups"></div>
  </nav>

  <div id="sections" style="display: contents"></div>

  <footer class="cta">
    <a class="quiz-link" href="index.html">道場でクイズに挑戦 →</a>
    <p>道場では、単元を選んで4択クイズで練習できます。正答率は単元ごとに残ります。</p>
  </footer>
</div>

<script src="../../../shared/store.js"></script>
<script src="data.js"></script>
<script src="data-g1.js"></script>
<script src="data-g1-2.js"></script>
<script src="data-g2.js"></script>
<script src="data-g2-2.js"></script>
<script src="data-g3.js"></script>
<script src="data-g3-2.js"></script>
<script>
(function () {
  "use strict";

  var tocGroups = document.getElementById("tocGroups");
  var sections = document.getElementById("sections");
  var stats = JHE.loadStats();   // 読むだけ。このページでは保存しない
  var grades = JHE.activeGrades();

  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  // データファイルの例文や表(作者が書いたHTML)を入れる
  function htmlEl(tag, className, html) {
    var e = el(tag, className);
    e.innerHTML = html;
    return e;
  }
  function pct(correct, total) { return Math.round((correct / total) * 100) + "%"; }

  // 見出しの学年と単元数は、データから作る
  if (grades.length > 0) {
    document.getElementById("eyebrow").textContent = "JUNIOR HIGH ENGLISH · " +
      (grades.length === 1 ? grades[0].short : grades[0].short + "〜" + grades[grades.length - 1].short) +
      " 全" + JHE.UNITS.length + "単元";
  }

  function buildCard(u) {
    var c = JHE.contentOf(u.id), ready = JHE.isReady(u.id);
    var card = el("article", "study-card" + (c && u.wide ? " wide" : ""));
    card.id = u.id;

    var h2 = el("h2");
    h2.appendChild(el("span", "num", u.no));
    h2.appendChild(document.createTextNode(u.name));
    card.appendChild(h2);
    card.appendChild(el("span", "tag", u.area));
    if (u.sub) card.appendChild(el("p", "", u.sub));

    if (!c) {
      card.appendChild(el("div", "pending", "準備中です。この単元の要点とクイズは、あとから追加されます。"));
      return card;
    }

    var body = el("div", "card-body");
    // 要点と、そのすぐ下の表・語順の枠
    if (c.points.length > 0 || c.chart) {
      var main = el("div", "card-main");
      if (c.points.length > 0) {
        var ul = el("ul", "points");
        c.points.forEach(function (p) { ul.appendChild(htmlEl("li", "", p)); });
        main.appendChild(ul);
      }
      if (c.chart) main.appendChild(htmlEl("div", "chart", c.chart));
      body.appendChild(main);
    }
    if (c.example) {
      var ex = el("div", "example");
      ex.appendChild(el("div", "ex-title", "例題"));
      ex.appendChild(htmlEl("div", "ex-q", c.example.title || ""));
      if (Array.isArray(c.example.steps) && c.example.steps.length > 0) {
        var holder = el("div");
        holder.innerHTML = JHE.steps(c.example.steps);
        ex.appendChild(holder.firstChild);
      }
      if (c.example.result) ex.appendChild(htmlEl("div", "result", c.example.result));
      body.appendChild(ex);
    }
    card.appendChild(body);

    var foot = el("div", "card-foot");
    var rec = stats.byUnit[u.id];
    var stat = el("span", "unit-stat");
    if (rec && rec.total > 0) {
      stat.textContent = "正答率 " + pct(rec.correct, rec.total) + "(" + rec.correct + "/" + rec.total + ")";
      if (JHE.isWeak(rec)) stat.appendChild(el("span", "weak-tag", "苦手"));
    } else {
      stat.textContent = ready ? "まだ解いていません" : "クイズは準備中";
    }
    foot.appendChild(stat);
    if (ready) {
      var link = el("a", "quiz-link small", "この単元をクイズで練習 →");
      link.href = "index.html?unit=" + encodeURIComponent(u.id);
      foot.appendChild(link);
    }
    card.appendChild(foot);
    return card;
  }

  grades.forEach(function (g) {
    var units = JHE.unitsOf(g.id);

    // 目次: 分野ごとの列(学年が2つ以上あるときは、分野名の前に学年をつける)
    JHE.AREAS.forEach(function (area) {
      var inArea = units.filter(function (u) { return u.area === area; });
      if (inArea.length === 0) return;
      var group = el("div", "toc-group");
      group.appendChild(el("p", "toc-grade", (grades.length > 1 ? g.short + " " : "") + area));
      var ol = el("ol");
      inArea.forEach(function (u) {
        var li = el("li");
        li.appendChild(el("span", "no", u.no));
        var wrap = el("span");
        var a = el("a", "", u.name);
        a.href = "#" + u.id;
        wrap.appendChild(a);
        if (!JHE.contentOf(u.id)) wrap.appendChild(el("span", "pending-mark", "(準備中)"));
        li.appendChild(wrap);
        ol.appendChild(li);
      });
      group.appendChild(ol);
      tocGroups.appendChild(group);
    });

    // 学年のまとまり
    var sec = el("section", "grade-section");
    sec.id = g.id;
    var head = el("div", "grade-head");
    head.appendChild(el("h2", "", g.name));
    head.appendChild(el("span", "unit-count", units.length + "単元"));
    sec.appendChild(head);
    var grid = el("div", "study-grid");
    units.forEach(function (u) { grid.appendChild(buildCard(u)); });
    sec.appendChild(grid);
    sections.appendChild(sec);
  });

  // #単元ID つきで開かれたとき、描き終えてからその単元へ移動して目立たせる
  function focusHash() {
    var id = "";
    try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) { /* こわれたアンカーは無視 */ }
    sections.querySelectorAll(".is-target").forEach(function (c) { c.classList.remove("is-target"); });
    if (!id) return;
    var target = document.getElementById(id);
    if (!target || !sections.contains(target)) return;
    if (target.classList.contains("study-card")) target.classList.add("is-target");
    target.scrollIntoView({ block: "start" });
  }
  window.addEventListener("hashchange", focusHash);
  focusHash();
  // フォントが読みこまれると高さが変わるので、もう一度合わせる
  if (location.hash && document.fonts && document.fonts.ready) document.fonts.ready.then(focusHash);
})();
</script>
</body>
</html>
