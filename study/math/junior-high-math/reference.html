<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>中学数学の要点帳</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../shared/base.css">
<link rel="stylesheet" href="theme.css">

<style>
  .app { max-width: 900px; gap: 24px; }

  /* ---------- Hero ---------- */
  .tagline { max-width: 56ch; }
  .site-nav {
    margin: 14px 0 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 18px;
    font-size: 13px;
  }
  .site-nav a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  .site-nav a:hover { text-decoration: underline; }
  .site-nav [aria-current="page"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom: 2px solid var(--accent);
  }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Controls bar ---------- */
  .controls-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 20px;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 20px;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .controls-bar p {
    margin: 0;
    font-size: 13px;
    color: var(--ink-muted);
  }
  .quiz-link {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 9px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }
  .quiz-link.small { padding: 9px 13px; font-size: 12.5px; }

  /* ---------- TOC ---------- */
  .toc {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 22px;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .toc-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }
  .toc-groups {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 24px;
  }
  .toc-group { min-width: 0; }
  .toc-grade {
    margin: 0 0 6px;
    font-size: 13px;
    font-weight: 700;
  }
  .toc-grade a { color: var(--ink); text-decoration: none; }
  .toc ol {
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 13.5px;
  }
  .toc li { margin-bottom: 6px; display: flex; gap: 6px; align-items: baseline; }
  .toc li .no {
    flex: none;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .toc a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .toc a:hover { text-decoration: underline; }
  .toc .pending-mark { font-size: 11px; color: var(--ink-faint); font-weight: 400; white-space: nowrap; }
  @media (max-width: 700px) {
    .toc-groups { grid-template-columns: 1fr; gap: 14px; }
    .toc ol { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    .toc li { min-width: 0; }
  }

  /* ---------- 学年の区切り ---------- */
  .grade-section { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 16px; }
  .grade-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .grade-head h2 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
  }
  .grade-head .unit-count {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-faint);
  }

  /* ---------- Study cards ---------- */
  .study-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .study-card {
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-margin-top: 16px;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .study-card.wide { grid-column: 1 / -1; }
  .study-card.is-target { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 1px 2px var(--shadow); }

  .study-card h2 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .study-card h2 .num {
    font-family: var(--font-mono);
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
  }
  .study-card .tag {
    align-self: flex-start;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--accent);
    background: var(--surface-2);
    padding: 3px 9px;
    border-radius: 999px;
  }
  .study-card p {
    margin: 0;
    color: var(--ink-muted);
    font-size: 13.5px;
    line-height: 1.7;
  }
  .card-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .card-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .study-card.wide .card-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
    gap: 16px 24px;
    align-items: start;
  }
  .points {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    color: var(--ink-muted);
    font-size: 13.5px;
    line-height: 1.8;
  }
  .points li {
    position: relative;
    padding-left: 14px;
    overflow-wrap: anywhere;
  }
  .points li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.75em;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }
  .points b { color: var(--ink); font-weight: 700; }
  .points .rule { display: inline-block; margin: 0 2px; }

  .example {
    background: var(--surface-2);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .example .ex-title {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
  }
  .example .ex-q {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  .example .steps {
    font-size: 13px;
    line-height: 1.85;
    color: var(--ink);
    overflow-x: auto;
    overflow-y: hidden;
    padding-left: 10px;
    border-left: 2px solid var(--border);
  }
  .example .result {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--good);
    margin-top: 2px;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .example .result::before { content: "答え "; font-size: 11px; font-weight: 600; color: var(--ink-faint); margin-right: 4px; }

  .figure { margin: 0; text-align: center; min-width: 0; }
  .figure svg { width: 100%; max-width: 300px; height: auto; }
  .figure figcaption {
    margin-top: 6px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--ink-faint);
  }
  .pending {
    padding: 12px 14px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    color: var(--ink-faint);
    font-size: 13px;
  }

  .card-foot {
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 12px;
  }
  .unit-stat {
    font-size: 12.5px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .weak-tag {
    display: inline-block;
    margin-left: 6px;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1;
    color: var(--bad);
    background: var(--bad-soft);
    border: 1px solid var(--bad);
    border-radius: 999px;
    padding: 3px 7px;
  }

  footer.cta {
    text-align: center;
    padding: 8px 0 0;
  }
  footer.cta p {
    margin: 10px 0 0;
    color: var(--ink-muted);
    font-size: 13px;
  }

  /* ===== 数式と図(index.html と同じ内容。変えるときは両方を直す) ===== */
  .math { font-family: var(--font-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* 変数の斜体は、小さい文字用の字形(opsz 9)に固定する。大きい式でも b が「6」に見える字形に変わらないようにするため */
  .math .v { font-family: var(--font-display); font-style: italic; font-size: 1.08em; font-variation-settings: "opsz" 9; }
  /* 平行の記号は本文フォントで出す(等幅フォントだと直立の「‖」に見えるため) */
  .math .sym-par { font-family: var(--font-body); }
  .math .op { margin: 0 0.25em; }
  sup { line-height: 0; }
  .math sup { font-size: 0.68em; line-height: 0; position: relative; top: -0.55em; vertical-align: baseline; }
  .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: 0.82em; line-height: 1.15; margin: 0 0.12em; }
  .frac .num { padding: 0 0.25em 0.08em; }
  .frac .den { padding: 0.08em 0.25em 0; border-top: 0.09em solid currentColor; align-self: stretch; text-align: center; }
  .sqrt { display: inline-flex; align-items: baseline; }
  /* 横線を √ の右上の先につなげる: 行の高さを 0.8 にして線の高さを決め、左へ少し重ねる */
  .sqrt-body { border-top: 0.08em solid currentColor; line-height: 0.8; padding: 0.04em 0.12em 0 0.2em; margin-left: -0.07em; }
  .sys { display: inline-grid; grid-template-columns: auto auto; align-items: center; column-gap: 0.15em; vertical-align: middle; text-align: left; }
  .sys::before { content: "{"; grid-row: 1 / span 2; font-family: var(--font-body); font-weight: 300; font-size: 2.5em; line-height: 1; transform: translateY(-0.07em); }
  .sys-row { grid-column: 2; line-height: 1.5; }
  .steps { display: flex; flex-direction: column; gap: 3px; }
  .step { min-width: 0; }
  .rule { color: var(--accent); font-weight: 700; }
  .fig-grid { stroke: var(--ink-faint); stroke-opacity: 0.45; stroke-width: 1; }
  .fig-axis { stroke: var(--ink-muted); stroke-width: 1.5; fill: none; }
  .fig-line { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .fig-line-2 { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
  .fig-shape { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linejoin: round; }
  .fig-fill { fill: var(--accent-soft); }
  .fig-bar { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.5; }
  .fig-point { fill: var(--accent); }
  .fig-label { fill: var(--ink); font-family: var(--font-mono); font-size: 13px; }
  .fig-small { font-size: 11px; fill: var(--ink-muted); }
  .fig-v { font-family: var(--font-display); font-style: italic; font-size: 1.1em; font-variation-settings: "opsz" 9; }
  .data-table { border-collapse: collapse; margin: 0 auto; font-size: 13.5px; font-variant-numeric: tabular-nums; color: var(--ink); }
  .data-table caption { font-size: 12px; color: var(--ink-faint); padding-bottom: 6px; }
  .data-table th, .data-table td { border: 1px solid var(--border); padding: 5px 12px; text-align: left; font-weight: 400; }
  .data-table th { background: var(--surface-2); font-weight: 600; }
  .data-table td:last-child { text-align: right; font-family: var(--font-mono); }
  .data-table .total td { font-weight: 600; }
  /* ===== 数式と図 ここまで ===== */

  @media (max-width: 700px) {
    .study-grid { grid-template-columns: 1fr; }
    .study-card.wide .card-body { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 480px) {
    .controls-bar { padding: 14px 16px; }
    .toc { padding: 16px; }
    .study-card { padding: 16px; }
  }
</style>
</head>
<body>

<div class="app">
  <a class="back-link" href="../../../index.html">← ページ一覧</a>
  <header class="hero">
    <p class="eyebrow">JUNIOR HIGH MATH · 中1〜中3 全22単元</p>
    <h1>中学数学の要点帳</h1>
    <p class="tagline">単元ごとの要点と例題をまとめた早見帳です。読んだらその単元のクイズへ進めます。</p>
    <nav class="site-nav" aria-label="中学数学道場のページ">
      <a href="index.html">クイズ道場</a>
      <span aria-current="page">要点帳</span>
    </nav>
  </header>

  <section class="controls-bar" aria-label="ナビゲーション">
    <p>読んだらその単元のクイズへ。各単元の下のボタンから進めます。</p>
    <a class="quiz-link" href="index.html">道場でクイズに挑戦 →</a>
  </section>

  <nav class="toc" aria-label="目次">
    <p class="toc-title">目次</p>
    <div class="toc-groups" id="tocGroups"></div>
  </nav>

  <div id="sections" style="display: contents"></div>

  <footer class="cta">
    <a class="quiz-link" href="index.html">道場でクイズに挑戦 →</a>
    <p>道場では、単元を選んで4択クイズで練習できます。正答率は単元ごとに残ります。</p>
  </footer>
</div>

<script src="../../../shared/store.js"></script>
<script src="math.js"></script>
<script src="data.js"></script>
<script src="data-g1.js"></script>
<script src="data-g2.js"></script>
<script src="data-g3.js"></script>
<script>
(function () {
  "use strict";

  var tocGroups = document.getElementById("tocGroups");
  var sections = document.getElementById("sections");
  var stats = JHM.loadStats();   // 読むだけ。このページでは保存しない

  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  // データファイルの式や図(作者が書いたHTML)を入れる
  function htmlEl(tag, className, html) {
    var e = el(tag, className);
    e.innerHTML = html;
    return e;
  }
  function pct(correct, total) { return Math.round((correct / total) * 100) + "%"; }

  function buildCard(u) {
    var c = JHM.contentOf(u.id), ready = JHM.isReady(u.id);
    var card = el("article", "study-card" + (c && c.figure ? " wide" : ""));
    card.id = u.id;

    var h2 = el("h2");
    h2.appendChild(el("span", "num", u.no));
    h2.appendChild(document.createTextNode(u.name));
    card.appendChild(h2);
    card.appendChild(el("span", "tag", u.area));

    if (!c) {
      card.appendChild(el("div", "pending", "準備中です。この単元の要点とクイズは、あとから追加されます。"));
      return card;
    }

    var body = el("div", "card-body"), main = el("div", "card-main");
    if (c.points.length > 0) {
      var ul = el("ul", "points");
      c.points.forEach(function (p) { ul.appendChild(htmlEl("li", "", p)); });
      main.appendChild(ul);
    }
    if (c.example) {
      var ex = el("div", "example");
      ex.appendChild(el("div", "ex-title", "例題"));
      ex.appendChild(htmlEl("div", "ex-q", c.example.title || ""));
      if (Array.isArray(c.example.steps) && c.example.steps.length > 0) {
        var holder = el("div");
        holder.innerHTML = M.steps(c.example.steps);
        ex.appendChild(holder.firstChild);
      }
      if (c.example.result) ex.appendChild(htmlEl("div", "result", c.example.result));
      main.appendChild(ex);
    }
    body.appendChild(main);
    if (c.figure && c.figure.html) {
      var fg = htmlEl("figure", "figure", c.figure.html);
      if (c.figure.caption) fg.appendChild(el("figcaption", "", c.figure.caption));
      body.appendChild(fg);
    }
    card.appendChild(body);

    var foot = el("div", "card-foot");
    var rec = stats.byUnit[u.id];
    var stat = el("span", "unit-stat");
    if (rec && rec.total > 0) {
      stat.textContent = "正答率 " + pct(rec.correct, rec.total) + "(" + rec.correct + "/" + rec.total + ")";
      if (JHM.isWeak(rec)) stat.appendChild(el("span", "weak-tag", "苦手"));
    } else {
      stat.textContent = ready ? "まだ解いていません" : "クイズは準備中";
    }
    foot.appendChild(stat);
    if (ready) {
      var link = el("a", "quiz-link small", "この単元をクイズで練習 →");
      link.href = "index.html?unit=" + encodeURIComponent(u.id);
      foot.appendChild(link);
    }
    card.appendChild(foot);
    return card;
  }

  JHM.GRADES.forEach(function (g) {
    var units = JHM.unitsOf(g.id);

    // 目次
    var group = el("div", "toc-group");
    var gp = el("p", "toc-grade");
    var ga = el("a", "", g.name);
    ga.href = "#" + g.id;
    gp.appendChild(ga);
    group.appendChild(gp);
    var ol = el("ol");
    units.forEach(function (u) {
      var li = el("li");
      li.appendChild(el("span", "no", u.no));
      var wrap = el("span");
      var a = el("a", "", u.name);
      a.href = "#" + u.id;
      wrap.appendChild(a);
      if (!JHM.contentOf(u.id)) wrap.appendChild(el("span", "pending-mark", "(準備中)"));
      li.appendChild(wrap);
      ol.appendChild(li);
    });
    group.appendChild(ol);
    tocGroups.appendChild(group);

    // 学年のまとまり
    var sec = el("section", "grade-section");
    sec.id = g.id;
    var head = el("div", "grade-head");
    head.appendChild(el("h2", "", g.name));
    head.appendChild(el("span", "unit-count", units.length + "単元"));
    sec.appendChild(head);
    var grid = el("div", "study-grid");
    units.forEach(function (u) { grid.appendChild(buildCard(u)); });
    sec.appendChild(grid);
    sections.appendChild(sec);
  });

  // #単元ID つきで開かれたとき、描き終えてからその単元へ移動して目立たせる
  function focusHash() {
    var id = "";
    try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) { /* こわれたアンカーは無視 */ }
    sections.querySelectorAll(".is-target").forEach(function (c) { c.classList.remove("is-target"); });
    if (!id) return;
    var target = document.getElementById(id);
    if (!target || !sections.contains(target)) return;
    if (target.classList.contains("study-card")) target.classList.add("is-target");
    target.scrollIntoView({ block: "start" });
  }
  window.addEventListener("hashchange", focusHash);
  focusHash();
  // フォントが読みこまれると高さが変わるので、もう一度合わせる
  if (location.hash && document.fonts && document.fonts.ready) document.fonts.ready.then(focusHash);
})();
</script>
</body>
</html>
