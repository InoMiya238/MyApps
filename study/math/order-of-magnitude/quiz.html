<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>オーダークイズ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../shared/base.css">
<link rel="stylesheet" href="theme.css">

<style>
  body { padding-bottom: 72px; }

  .app { max-width: 640px; gap: 22px; }

  header.top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .title-block h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 28px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .title-block p {
    margin: 0;
    color: var(--ink-muted);
    font-size: 14px;
    max-width: 46ch;
    line-height: 1.6;
  }

  nav.top-nav a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 16px;
    border-radius: 10px;
    transition: all 0.15s ease;
  }

  nav.top-nav a:hover { border-color: var(--accent); color: var(--accent); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 1px 3px var(--shadow);
  }

  /* --- setup --- */
  .section-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }

  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }

  .cat-check {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-muted);
    transition: all 0.15s ease;
    user-select: none;
  }

  .cat-check.checked {
    border-color: var(--accent);
    color: var(--ink);
    background: var(--good-soft);
  }

  .cat-check input { accent-color: var(--accent); }

  .mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 22px;
  }

  .mode-opt {
    padding: 14px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .mode-opt.checked { border-color: var(--accent); background: var(--good-soft); }

  .mode-opt .mode-title { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
  .mode-opt .mode-desc { font-size: 12px; color: var(--ink-muted); line-height: 1.5; }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px var(--shadow); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

  .best-line {
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-faint);
    margin-top: 12px;
  }

  /* --- quiz --- */
  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--ink-muted);
  }

  .progress-bar {
    height: 6px;
    border-radius: 4px;
    background: var(--surface-2);
    overflow: hidden;
    margin: 6px 0 4px;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.25s ease;
  }

  .prompt {
    text-align: center;
    font-size: 13px;
    color: var(--ink-faint);
    margin: 0 0 16px;
  }

  .qcard {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
    padding: 8px 4px 22px;
  }

  .qcard .emoji { font-size: 44px; }
  .qcard .name { font-family: var(--font-display); font-size: 21px; font-weight: 600; }
  .qcard .note { font-size: 13px; color: var(--ink-muted); max-width: 40ch; line-height: 1.6; }

  .compare-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
  }

  .compare-vs {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--ink-faint);
  }

  .compare-card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 10px;
    text-align: center;
    cursor: pointer;
    background: var(--surface);
    transition: all 0.15s ease;
  }

  .compare-card:hover:not(.locked) { border-color: var(--accent); }
  .compare-card .emoji { font-size: 32px; }
  .compare-card .name { font-weight: 700; font-size: 13.5px; margin: 6px 0 2px; }
  .compare-card .note { font-size: 11px; color: var(--ink-muted); line-height: 1.4; }
  .compare-card .reveal { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); margin-top: 6px; min-height: 15px; }

  .compare-card.correct { border-color: var(--good); background: var(--good-soft); }
  .compare-card.wrong { border-color: var(--bad); background: var(--bad-soft); }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .choice-btn {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 17px;
    padding: 16px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .choice-btn:hover:not(:disabled) { border-color: var(--accent); }
  .choice-btn:disabled { cursor: not-allowed; }

  .choice-btn.correct { border-color: var(--good); background: var(--good-soft); color: var(--good); }
  .choice-btn.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }

  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }

  .feedback.show { display: block; }
  .feedback.good { background: var(--good-soft); color: var(--good); }
  .feedback.bad { background: var(--bad-soft); color: var(--bad); }
  .feedback b { font-family: var(--font-mono); }

  .next-row { margin-top: 16px; }

  /* --- result --- */
  .result {
    text-align: center;
    padding: 12px 4px;
  }

  .result .score {
    font-family: var(--font-display);
    font-size: 48px;
    font-weight: 700;
    margin: 6px 0;
  }

  .result .score span { font-size: 24px; color: var(--ink-faint); }
  .result .label { color: var(--ink-muted); font-size: 14px; margin-bottom: 18px; }
  .result .stats { display: flex; justify-content: center; gap: 26px; margin-bottom: 22px; }
  .result .stat b { display: block; font-family: var(--font-mono); font-size: 20px; }
  .result .stat span { font-size: 11.5px; color: var(--ink-faint); }
  .result .actions { display: flex; gap: 10px; }
  .btn-secondary {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 12px;
    padding: 13px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
    padding-top: 8px;
  }
</style>
</head>
<body>

<div class="app">
  <a class="back-link" href="../../../index.html">← ページ一覧</a>
  <header class="top">
    <div class="title-block">
      <h1>オーダークイズ</h1>
      <p>身の回りのモノの大きさ・重さ・時間・数を見て、そのオーダー(桁)を当てよう。</p>
    </div>
    <nav class="top-nav"><a href="index.html">← 図鑑を見る</a></nav>
  </header>

  <div class="card" id="stage"></div>

  <footer>オーダークイズ — 数値は代表的な概算値です</footer>
</div>

<script src="../../../shared/store.js"></script>
<script src="data.js"></script>
<script>
  const TOTAL_QUESTIONS = 10;
  const VERB = { length: "大きい", mass: "重い", time: "長い", quantity: "多い" };
  const stage = document.getElementById("stage");
  const categories = Object.keys(OOM_DATA);

  const state = {
    screen: "setup",
    selectedCats: new Set(categories),
    mode: "guess",
    questions: [],
    index: 0,
    score: 0,
    streak: 0,
    bestStreak: 0,
    answered: false,
  };

  function loadBest() {
    return Store.load("oomQuizBest", {});
  }

  function saveBest(score) {
    const best = loadBest();
    if (!best.score || score > best.score) {
      best.score = score;
      Store.save("oomQuizBest", best);
    }
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function buildChoices(catKey, correctExp) {
    const allExps = [...new Set(OOM_DATA[catKey].items.map((it) => it.exp))].filter((e) => e !== correctExp);
    const distractors = shuffle(allExps).slice(0, 3);
    while (distractors.length < 3) {
      const offset = pick([-2, -1, 1, 2, 3, -3]) * 3;
      const candidate = correctExp + offset;
      if (candidate !== correctExp && !distractors.includes(candidate)) distractors.push(candidate);
    }
    return shuffle([correctExp, ...distractors]);
  }

  function buildQuestions() {
    const cats = [...state.selectedCats];
    const qs = [];
    for (let i = 0; i < TOTAL_QUESTIONS; i++) {
      const catKey = pick(cats);
      const cat = OOM_DATA[catKey];
      if (state.mode === "guess") {
        const item = pick(cat.items);
        qs.push({ type: "guess", catKey, item, choices: buildChoices(catKey, item.exp) });
      } else {
        if (cat.items.length < 2) { i--; continue; }
        const [a, b] = shuffle(cat.items).slice(0, 2);
        qs.push({ type: "compare", catKey, a, b });
      }
    }
    return qs;
  }

  function startQuiz() {
    if (state.selectedCats.size === 0) return;
    state.questions = buildQuestions();
    state.index = 0;
    state.score = 0;
    state.streak = 0;
    state.bestStreak = 0;
    state.screen = "quiz";
    render();
  }

  function renderSetup() {
    const best = loadBest();
    stage.innerHTML = `
      <p class="section-label">出題ジャンル</p>
      <div class="cat-grid" id="catGrid">
        ${categories
          .map((key) => {
            const cat = OOM_DATA[key];
            const checked = state.selectedCats.has(key) ? "checked" : "";
            return `<label class="cat-check ${checked}" data-cat="${key}">
              <input type="checkbox" ${checked ? "checked" : ""} />
              ${cat.icon} ${cat.label}
            </label>`;
          })
          .join("")}
      </div>

      <p class="section-label">クイズ形式</p>
      <div class="mode-grid" id="modeGrid">
        <div class="mode-opt ${state.mode === "guess" ? "checked" : ""}" data-mode="guess">
          <div class="mode-title">🎯 オーダーを当てる</div>
          <div class="mode-desc">モノを見て「10の何乗」かを4択で答える</div>
        </div>
        <div class="mode-opt ${state.mode === "compare" ? "checked" : ""}" data-mode="compare">
          <div class="mode-title">⚖️ 大小比較</div>
          <div class="mode-desc">2つのモノのどちらが大きいかを選ぶ</div>
        </div>
      </div>

      <button class="btn-primary" id="startBtn" ${state.selectedCats.size === 0 ? "disabled" : ""}>クイズを始める(全${TOTAL_QUESTIONS}問)</button>
      ${best.score ? `<p class="best-line">自己ベスト: ${best.score} / ${TOTAL_QUESTIONS} 問正解</p>` : ""}
    `;

    stage.querySelectorAll(".cat-check").forEach((label) => {
      label.addEventListener("click", (e) => {
        e.preventDefault();
        const key = label.dataset.cat;
        if (state.selectedCats.has(key)) state.selectedCats.delete(key);
        else state.selectedCats.add(key);
        renderSetup();
      });
    });

    stage.querySelectorAll(".mode-opt").forEach((el) => {
      el.addEventListener("click", () => {
        state.mode = el.dataset.mode;
        renderSetup();
      });
    });

    document.getElementById("startBtn").addEventListener("click", startQuiz);
  }

  function currentQuestion() {
    return state.questions[state.index];
  }

  function renderQuiz() {
    const q = currentQuestion();
    const cat = OOM_DATA[q.catKey];
    const progressPct = Math.round((state.index / TOTAL_QUESTIONS) * 100);
    state.answered = false;

    const header = `
      <div class="progress-row">
        <span>問題 ${state.index + 1} / ${TOTAL_QUESTIONS}</span>
        <span>正解 ${state.score} ・ 連続 ${state.streak}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    `;

    if (q.type === "guess") {
      stage.innerHTML = `
        ${header}
        <p class="prompt">${cat.icon} ${cat.label}のオーダーは?</p>
        <div class="qcard">
          <div class="emoji">${q.item.emoji}</div>
          <div class="name">${q.item.name}</div>
          <div class="note">${q.item.note}</div>
        </div>
        <div class="choices" id="choices">
          ${q.choices.map((exp) => `<button class="choice-btn" data-exp="${exp}">${formatExp(exp)}</button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="next-row" id="nextRow"></div>
      `;

      stage.querySelectorAll(".choice-btn").forEach((btn) => {
        btn.addEventListener("click", () => onGuessAnswer(Number(btn.dataset.exp)));
      });
    } else {
      stage.innerHTML = `
        ${header}
        <p class="prompt">どちらが${VERB[q.catKey]}?</p>
        <div class="compare-row" id="compareRow">
          <div class="compare-card" data-side="a">
            <div class="emoji">${q.a.emoji}</div>
            <div class="name">${q.a.name}</div>
            <div class="note">${q.a.note}</div>
            <div class="reveal"></div>
          </div>
          <div class="compare-vs">VS</div>
          <div class="compare-card" data-side="b">
            <div class="emoji">${q.b.emoji}</div>
            <div class="name">${q.b.name}</div>
            <div class="note">${q.b.note}</div>
            <div class="reveal"></div>
          </div>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="next-row" id="nextRow"></div>
      `;

      stage.querySelectorAll(".compare-card").forEach((el) => {
        el.addEventListener("click", () => onCompareAnswer(el.dataset.side));
      });
    }
  }

  function showNext(isLast) {
    const nextRow = document.getElementById("nextRow");
    nextRow.innerHTML = `<button class="btn-primary" id="nextBtn">${isLast ? "結果を見る" : "次の問題 →"}</button>`;
    document.getElementById("nextBtn").addEventListener("click", () => {
      state.index++;
      if (state.index >= TOTAL_QUESTIONS) {
        state.screen = "result";
      }
      render();
    });
  }

  function onGuessAnswer(chosenExp) {
    if (state.answered) return;
    state.answered = true;
    const q = currentQuestion();
    const correct = chosenExp === q.item.exp;
    if (correct) { state.score++; state.streak++; state.bestStreak = Math.max(state.bestStreak, state.streak); }
    else state.streak = 0;

    document.querySelectorAll(".choice-btn").forEach((btn) => {
      btn.disabled = true;
      const exp = Number(btn.dataset.exp);
      if (exp === q.item.exp) btn.classList.add("correct");
      else if (exp === chosenExp) btn.classList.add("wrong");
    });

    const fb = document.getElementById("feedback");
    fb.classList.add("show", correct ? "good" : "bad");
    fb.innerHTML = correct
      ? `正解! <b>${formatExp(q.item.exp)}</b> — ${q.item.name}は実際には ${q.item.valueText} です。`
      : `残念、正解は <b>${formatExp(q.item.exp)}</b>。${q.item.name}は実際には ${q.item.valueText} です。`;

    showNext(state.index + 1 >= TOTAL_QUESTIONS);
  }

  function onCompareAnswer(side) {
    if (state.answered) return;
    state.answered = true;
    const q = currentQuestion();
    const winner = q.a.exp > q.b.exp ? "a" : "b";
    const correct = side === winner;
    if (correct) { state.score++; state.streak++; state.bestStreak = Math.max(state.bestStreak, state.streak); }
    else state.streak = 0;

    document.querySelectorAll(".compare-card").forEach((el) => {
      const s = el.dataset.side;
      const it = s === "a" ? q.a : q.b;
      el.querySelector(".reveal").textContent = `${formatExp(it.exp)} (${it.valueText})`;
      if (s === winner) el.classList.add("correct");
      else if (s === side) el.classList.add("wrong");
    });

    const fb = document.getElementById("feedback");
    fb.classList.add("show", correct ? "good" : "bad");
    const winnerItem = winner === "a" ? q.a : q.b;
    fb.innerHTML = correct
      ? `正解! ${winnerItem.name}の方が${VERB[q.catKey]}です。`
      : `残念、${winnerItem.name}の方が${VERB[q.catKey]}です。`;

    showNext(state.index + 1 >= TOTAL_QUESTIONS);
  }

  function renderResult() {
    saveBest(state.score);
    const pct = Math.round((state.score / TOTAL_QUESTIONS) * 100);
    stage.innerHTML = `
      <div class="result">
        <div class="label">クイズ終了!</div>
        <div class="score">${state.score}<span> / ${TOTAL_QUESTIONS}</span></div>
        <div class="label">正答率 ${pct}%</div>
        <div class="stats">
          <div class="stat"><b>${state.bestStreak}</b><span>最大連続正解</span></div>
        </div>
        <div class="actions">
          <button class="btn-secondary" id="retryBtn">もう一度</button>
          <button class="btn-secondary" id="setupBtn">設定を変える</button>
        </div>
      </div>
    `;
    document.getElementById("retryBtn").addEventListener("click", startQuiz);
    document.getElementById("setupBtn").addEventListener("click", () => {
      state.screen = "setup";
      render();
    });
  }

  function render() {
    if (state.screen === "setup") renderSetup();
    else if (state.screen === "quiz") renderQuiz();
    else renderResult();
  }

  render();
</script>
</body>
</html>
