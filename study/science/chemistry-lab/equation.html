<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>反応式の組み立て | 化学基礎ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../shared/base.css">
<link rel="stylesheet" href="theme.css">

<style>
  .app { max-width: 860px; gap: 22px; }
  /* ---------- Hero ---------- */
  .tagline { max-width: 46ch; }
  .site-nav {
    margin: 14px 0 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 18px;
    font-size: 13px;
  }
  .site-nav a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .site-nav a:hover { text-decoration: underline; }
  .site-nav [aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom: 2px solid var(--accent); }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    box-shadow: 0 1px 2px var(--shadow);
    min-width: 0;
  }
  .card h2 {
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 14px;
  }
  .card h3 {
    margin: 18px 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    color: var(--ink-faint);
  }
  .hint { font-size: 0.78rem; color: var(--ink-faint); margin: 10px 0 0; line-height: 1.6; }
  button {
    font-family: var(--font-body);
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    padding: 12px 20px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: var(--surface-2); color: var(--ink); font-weight: 600; }
  .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .btn-row button { flex: 1 1 140px; }
  select, input[type="search"] {
    font-family: var(--font-body);
    font-size: 0.95rem;
    padding: 8px 10px;
    border-radius: 9px;
    border: 1.5px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    min-width: 0;
  }
  button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  /* 切り替えボタン(中学理科道場の .grade-tab と同じ形) */
  .mode-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  .mode-tab {
    min-width: 0;
    min-height: 44px;
    padding: 8px 6px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-muted);
    font-weight: 600;
    font-size: 14px;
    transition: all 0.15s ease;
  }
  .mode-tab:hover { border-color: var(--accent); color: var(--ink); }
  .mode-tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* ===== 化学の表示部品 ここから(4ページで同じ内容。変えるときはすべて直す) ===== */
  .qty { white-space: nowrap; }
  .qty .n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .qty .u, .u { font-family: var(--font-body); font-size: .92em; margin-left: .18em; }
  .qty .u.tight { margin-left: 0; }
  .qty sup { font-size: .7em; line-height: 0; position: relative; top: -.45em; vertical-align: baseline; }
  .chem { font-family: var(--font-body); white-space: nowrap; }
  .chem sub { font-size: .7em; line-height: 0; position: relative; top: .32em; vertical-align: baseline; }
  .chem sup { font-size: .7em; line-height: 0; position: relative; top: -.45em; vertical-align: baseline; }
  .given { display: grid; grid-template-columns: auto auto; justify-content: center; gap: 4px 14px; margin: 0; padding: 10px 14px; background: var(--surface-2); border-radius: 10px; font-size: 14.5px; color: var(--ink); }
  .given dt { color: var(--ink-muted); }
  .given dd { margin: 0; font-weight: 600; text-align: right; }
  /* ===== 化学の表示部品 ここまで ===== */


  /* ---------- 反応を選ぶ ---------- */
  .pick { display: flex; align-items: center; gap: 8px; }
  .pick select { flex: 1 1 auto; font-size: 16px; padding: 9px 10px; }
  .pick button { flex: none; width: 44px; height: 44px; padding: 0; font-size: 18px; }
  .done-count { margin: 10px 0 0; font-size: 0.82rem; color: var(--ink-muted); }

  /* ---------- 反応式 ---------- */
  .eq-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 10px; }
  .term {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-width: 0;
    padding: 10px 8px;
    border-radius: 12px;
    background: var(--surface-2);
  }
  .op { font-size: 22px; font-weight: 700; color: var(--ink-muted); }
  .op .down { display: none; }
  .coef { display: flex; align-items: center; gap: 4px; }
  .coef button { width: 44px; height: 44px; padding: 0; font-size: 20px; font-weight: 700; background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
  .coef button:disabled { opacity: .4; cursor: not-allowed; }
  .coef .val { min-width: 1.6em; text-align: center; font-family: var(--font-mono); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
  .term .formula-text { font-size: 20px; font-weight: 600; }
  .term .formula-text .k { color: var(--accent); font-family: var(--font-mono); margin-right: 1px; }
  .mols { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; max-width: 150px; min-height: 22px; }
  .mols svg { display: block; height: auto; }
  .mols .more { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--ink-muted); }
  .atom-c { stroke: var(--el-stroke); stroke-width: 1; }
  .atom-t { font-family: var(--font-body); font-size: 8px; font-weight: 700; fill: var(--el-ink); text-anchor: middle; dominant-baseline: central; }
  .atom-t.light { fill: var(--el-ink-light); }
  .atom-t.two { font-size: 7px; }

  .status {
    margin: 18px 0 0;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.6;
    text-align: center;
    background: var(--surface-2);
    color: var(--ink);
  }
  .status.ok { background: var(--good-soft); color: var(--good); }
  .status.notmin { background: var(--accent-soft); color: var(--ink); }

  .count-table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
  .count-table th, .count-table td { border: 1px solid var(--border); padding: 7px 10px; text-align: center; }
  .count-table th { background: var(--surface-2); font-weight: 600; font-size: 13px; }
  .count-table td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .count-table td.st-ok { color: var(--good); font-weight: 700; }
  .count-table td.st-ng { color: var(--bad); font-weight: 700; }

  @media (max-width: 480px) {
    .card { padding: 18px 14px; }
    .eq-row { flex-direction: column; align-items: stretch; gap: 6px; }
    .term { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "f c" "m c"; align-items: center; gap: 4px 8px; padding: 8px 10px; }
    .term .formula-text { grid-area: f; }
    .term .mols { grid-area: m; justify-content: flex-start; max-width: none; }
    .term .coef { grid-area: c; }
    .op { text-align: center; font-size: 18px; line-height: 1; }
    .op .right { display: none; }
    .op .down { display: inline; }
    .count-table { font-size: 13px; }
    .count-table th, .count-table td { padding: 6px 4px; }
  }
</style>
</head>
<body>

<div class="app">
  <a class="back-link" href="../../../index.html">← ページ一覧</a>
  <header class="hero">
    <p class="eyebrow">CHEMISTRY LAB · 反応式の組み立て</p>
    <h1>反応式の組み立て</h1>
    <p class="tagline">係数を変えて、左辺と右辺の原子の数をそろえます。原子の数の表を見ながら、化学反応式を完成させましょう。</p>
    <nav class="site-nav" aria-label="化学基礎ラボのページ">
      <a href="index.html">道場</a>
      <a href="periodic.html">周期表</a>
      <a href="atom.html">原子の組み立て</a>
      <span aria-current="page">反応式の組み立て</span>
    </nav>
  </header>

  <div class="card">
    <h2><label for="rxSelect">反応を選ぶ</label></h2>
    <div class="pick">
      <button type="button" class="btn-secondary" id="prevBtn" aria-label="前の反応">←</button>
      <select id="rxSelect"></select>
      <button type="button" class="btn-secondary" id="nextBtn" aria-label="次の反応">→</button>
    </div>
    <p class="done-count" id="doneCount"></p>
  </div>

  <div class="card">
    <h2 id="rxTitle">化学反応式</h2>
    <div class="eq-row" id="eqRow"></div>
    <p class="status" id="status" role="status"></p>

    <table class="count-table" id="countTable">
      <caption class="hint" style="caption-side: top; text-align: left; margin: 0 0 6px;">原子の数</caption>
      <thead><tr><th scope="col">原子</th><th scope="col">左辺</th><th scope="col">右辺</th><th scope="col">状態</th></tr></thead>
      <tbody id="countBody"></tbody>
    </table>

    <div class="btn-row">
      <button type="button" class="btn-secondary" id="onesBtn">係数をすべて1に</button>
      <button type="button" class="btn-secondary" id="answerBtn">答えを見る</button>
    </div>
    <p class="hint">係数は1〜12。1のときは式に書きません。原子の丸は、分子(または単位)1つ分を表します。</p>
  </div>
</div>

<script src="../../../shared/store.js"></script>
<script src="data.js"></script>
<script src="data-elements.js"></script>
<script>
(function () {
  "use strict";

  var MAX = 12, SHOW = 6;
  var NS = "http://www.w3.org/2000/svg";
  var COLORED = ["H", "C", "N", "O", "Na", "Mg", "Al", "S", "Cl", "Ca", "Fe", "Cu", "Zn", "Ag"];
  var rxSelect = document.getElementById("rxSelect");
  var eqRow = document.getElementById("eqRow");
  var statusEl = document.getElementById("status");
  var countBody = document.getElementById("countBody");

  // ---------- 保存 ----------
  function loadSaved() {
    var raw = Store.load(CHEM.EQUATION_KEY, null), s = { done: [], last: null };
    if (!raw || typeof raw !== "object") return s;
    if (Array.isArray(raw.done)) s.done = raw.done.filter(function (id) { return typeof id === "string" && CHEM.reaction(id); });
    if (typeof raw.last === "string" && CHEM.reaction(raw.last)) s.last = raw.last;
    return s;
  }
  var saved = loadSaved();
  function save() { Store.save(CHEM.EQUATION_KEY, saved); }

  // revealed: 「答えを見る」を押した(次に反応を開くまで ✓ はつけない) / touched: 係数を自分で動かした
  var rx = null, coefs = [], revealed = false, touched = false;

  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function svgEl(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  }

  // ---------- 反応の一覧 ----------
  function buildSelect() {
    var keep = rxSelect.value;
    rxSelect.innerHTML = "";
    CHEM.LEVELS.forEach(function (lv) {
      var og = document.createElement("optgroup");
      og.label = lv.name;
      CHEM.REACTIONS.forEach(function (r) {
        if (r.level !== lv.id) return;
        var o = document.createElement("option");
        o.value = r.id;
        var done = saved.done.indexOf(r.id) >= 0;
        o.textContent = (done ? "✓ " : "") + r.name;
        og.appendChild(o);
      });
      rxSelect.appendChild(og);
    });
    if (keep) rxSelect.value = keep;
    var n = saved.done.length;
    document.getElementById("doneCount").textContent = "完成した反応: " + n + " / " + CHEM.REACTIONS.length + (n > 0 ? "(✓ がついています)" : "");
  }

  // ---------- 分子の図 ----------
  function molecule(formula) {
    var atoms = CHEM.parseFormula(formula).order;
    var n = atoms.length;
    var cols = n <= 4 ? n : Math.ceil(Math.sqrt(n));
    var rows = Math.ceil(n / cols), step = 15, r = 9;
    var w = 2 * r + (cols - 1) * step + 2, h = 2 * r + (rows - 1) * step + 2;
    var s = svgEl("svg", { viewBox: "0 0 " + w + " " + h, width: w, height: h, "aria-hidden": "true" });
    atoms.forEach(function (sym, i) {
      var x = 1 + r + (i % cols) * step, y = 1 + r + Math.floor(i / cols) * step;
      var fill = COLORED.indexOf(sym) >= 0 ? "var(--el-" + sym + ")" : "var(--surface)";
      s.appendChild(svgEl("circle", { "class": "atom-c", cx: x, cy: y, r: r, style: "fill:" + fill }));
      var t = svgEl("text", { "class": "atom-t" + (sym === "H" ? " light" : "") + (sym.length > 1 ? " two" : ""), x: x, y: y });
      t.textContent = sym;
      s.appendChild(t);
    });
    return s;
  }

  // ---------- 描く ----------
  function renderEquation() {
    eqRow.innerHTML = "";
    var species = CHEM.speciesOf(rx), nl = rx.reactants.length;
    species.forEach(function (f, i) {
      if (i > 0) {
        var op = el("span", "op");
        op.setAttribute("aria-hidden", "true");
        if (i === nl) {
          op.appendChild(el("span", "right", "→"));
          op.appendChild(el("span", "down", "↓"));
        } else {
          op.textContent = "+";
        }
        eqRow.appendChild(op);
      }
      var term = el("div", "term");
      term.setAttribute("role", "group");
      var plain = CHEM.text(CHEM.chem(f)).replace(/_/g, "");
      term.setAttribute("aria-label", (i < nl ? "反応物 " : "生成物 ") + plain);

      var coef = el("div", "coef");
      var minus = el("button", "", "−");
      minus.type = "button";
      minus.setAttribute("aria-label", plain + " の係数をへらす");
      var val = el("span", "val");
      val.setAttribute("aria-live", "polite");
      var plus = el("button", "", "+");
      plus.type = "button";
      plus.setAttribute("aria-label", plain + " の係数をふやす");
      minus.addEventListener("click", function () { setCoef(i, coefs[i] - 1); });
      plus.addEventListener("click", function () { setCoef(i, coefs[i] + 1); });
      coef.appendChild(minus); coef.appendChild(val); coef.appendChild(plus);

      var ft = el("div", "formula-text");
      var mols = el("div", "mols");
      term.appendChild(coef);
      term.appendChild(ft);
      term.appendChild(mols);
      term.dataset.i = i;
      eqRow.appendChild(term);
    });
    renderState();
  }

  function renderTerms() {
    var species = CHEM.speciesOf(rx);
    eqRow.querySelectorAll(".term").forEach(function (term) {
      var i = Number(term.dataset.i), k = coefs[i], f = species[i];
      var b = term.querySelectorAll(".coef button");
      b[0].disabled = k <= 1;
      b[1].disabled = k >= MAX;
      term.querySelector(".val").textContent = k;
      term.querySelector(".formula-text").innerHTML = (k > 1 ? '<span class="k">' + k + "</span>" : "") + CHEM.chem(f);
      var mols = term.querySelector(".mols");
      mols.innerHTML = "";
      for (var j = 0; j < Math.min(k, SHOW); j++) mols.appendChild(molecule(f));
      if (k > SHOW) mols.appendChild(el("span", "more", "×" + k));
    });
  }

  function renderState() {
    renderTerms();
    var counts = CHEM.countAtoms(rx, coefs);
    countBody.innerHTML = "";
    var bad = [];
    counts.forEach(function (c) {
      var tr = document.createElement("tr");
      tr.appendChild(el("th", "", c.el));
      tr.firstChild.setAttribute("scope", "row");
      tr.appendChild(el("td", "num", String(c.left)));
      tr.appendChild(el("td", "num", String(c.right)));
      var d = c.left - c.right;
      var td = el("td", d === 0 ? "st-ok" : "st-ng", d === 0 ? "○ そろった" : (d > 0 ? "左が" + d + "多い" : "右が" + (-d) + "多い"));
      tr.appendChild(td);
      countBody.appendChild(tr);
      if (d !== 0) bad.push(c.el);
    });
    var g = CHEM.gcdAll(coefs);
    statusEl.className = "status";
    if (bad.length > 0) {
      statusEl.textContent = bad.join(" と ") + " の数がそろっていません";
    } else if (g > 1) {
      statusEl.className = "status notmin";
      statusEl.textContent = "原子の数はそろいましたが、係数が最小の整数比ではありません。すべての係数を " + g + " でわりましょう。";
    } else {
      statusEl.className = "status ok";
      var allOne = coefs.every(function (k) { return k === 1; });
      if (revealed) statusEl.textContent = "完成!(答えを表示しました。反応を開き直して自分でそろえると ✓ がつきます)";
      else if (!touched && allOne) statusEl.textContent = "係数はすべて1でそろっています(1は書かない)。";
      else statusEl.textContent = "完成!";
      if (!revealed && touched && saved.done.indexOf(rx.id) < 0) {
        saved.done.push(rx.id);
        save();
        buildSelect();
      }
    }
  }

  function setCoef(i, v) {
    v = Math.max(1, Math.min(MAX, v));
    if (v === coefs[i]) return;
    coefs[i] = v;
    touched = true;
    renderState();
  }

  function open(id) {
    rx = CHEM.reaction(id) || CHEM.REACTIONS[0];
    coefs = CHEM.speciesOf(rx).map(function () { return 1; });
    revealed = false;
    touched = false;
    rxSelect.value = rx.id;
    document.getElementById("rxTitle").textContent = rx.name;
    saved.last = rx.id;
    save();
    try { history.replaceState(null, "", "?r=" + rx.id); } catch (err) { /* 無視 */ }
    renderEquation();
  }

  function step(d) {
    var i = CHEM.REACTIONS.indexOf(rx);
    var n = CHEM.REACTIONS.length;
    open(CHEM.REACTIONS[(i + d + n) % n].id);
  }

  rxSelect.addEventListener("change", function () { open(rxSelect.value); });
  document.getElementById("prevBtn").addEventListener("click", function () { step(-1); });
  document.getElementById("nextBtn").addEventListener("click", function () { step(1); });
  document.getElementById("onesBtn").addEventListener("click", function () {
    coefs = coefs.map(function () { return 1; });
    touched = false;   // 最初の状態に戻すだけなので、自分でそろえたことにはしない
    renderState();
  });
  document.getElementById("answerBtn").addEventListener("click", function () {
    coefs = rx.answer.slice();
    revealed = true;
    renderState();
  });

  buildSelect();
  var want = null;
  try { want = new URLSearchParams(location.search).get("r"); } catch (err) { want = null; }
  open(want && CHEM.reaction(want) ? want : (saved.last || CHEM.REACTIONS[0].id));
})();
</script>
</body>
</html>
