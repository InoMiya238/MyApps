<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周期表 | 化学基礎ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../shared/base.css">
<link rel="stylesheet" href="theme.css">

<style>
  .app { max-width: 1100px; gap: 22px; }
  /* ---------- Hero ---------- */
  .tagline { max-width: 46ch; }
  .site-nav {
    margin: 14px 0 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 18px;
    font-size: 13px;
  }
  .site-nav a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .site-nav a:hover { text-decoration: underline; }
  .site-nav [aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom: 2px solid var(--accent); }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    box-shadow: 0 1px 2px var(--shadow);
    min-width: 0;
  }
  .card h2 {
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 14px;
  }
  .card h3 {
    margin: 18px 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    color: var(--ink-faint);
  }
  .hint { font-size: 0.78rem; color: var(--ink-faint); margin: 10px 0 0; line-height: 1.6; }
  button {
    font-family: var(--font-body);
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    padding: 12px 20px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: var(--surface-2); color: var(--ink); font-weight: 600; }
  .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .btn-row button { flex: 1 1 140px; }
  select, input[type="search"] {
    font-family: var(--font-body);
    font-size: 0.95rem;
    padding: 8px 10px;
    border-radius: 9px;
    border: 1.5px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    min-width: 0;
  }
  button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  /* 切り替えボタン(中学理科道場の .grade-tab と同じ形) */
  .mode-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  .mode-tab {
    min-width: 0;
    min-height: 44px;
    padding: 8px 6px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-muted);
    font-weight: 600;
    font-size: 14px;
    transition: all 0.15s ease;
  }
  .mode-tab:hover { border-color: var(--accent); color: var(--ink); }
  .mode-tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* ===== 化学の表示部品 ここから(4ページで同じ内容。変えるときはすべて直す) ===== */
  .qty { white-space: nowrap; }
  .qty .n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .qty .u, .u { font-family: var(--font-body); font-size: .92em; margin-left: .18em; }
  .qty .u.tight { margin-left: 0; }
  .qty sup { font-size: .7em; line-height: 0; position: relative; top: -.45em; vertical-align: baseline; }
  .chem { font-family: var(--font-body); white-space: nowrap; }
  .chem sub { font-size: .7em; line-height: 0; position: relative; top: .32em; vertical-align: baseline; }
  .chem sup { font-size: .7em; line-height: 0; position: relative; top: -.45em; vertical-align: baseline; }
  .given { display: grid; grid-template-columns: auto auto; justify-content: center; gap: 4px 14px; margin: 0; padding: 10px 14px; background: var(--surface-2); border-radius: 10px; font-size: 14.5px; color: var(--ink); }
  .given dt { color: var(--ink-muted); }
  .given dd { margin: 0; font-weight: 600; text-align: right; }
  /* ===== 化学の表示部品 ここまで ===== */


  /* ---------- 操作 ---------- */
  .controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 24px; }
  .control-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .control-group .label { font-size: 12px; font-weight: 600; color: var(--ink-muted); }
  .mode-tabs { min-width: min(100%, 420px); }
  .search-row { display: flex; gap: 8px; }
  .search-row input { width: 15em; }
  .search-row button { padding: 8px 14px; font-size: 0.92rem; }
  .search-msg { min-height: 1.2em; margin: 4px 0 0; font-size: 0.82rem; color: var(--bad); }

  /* ---------- 周期表 ---------- */
  .pt-wrap { position: relative; }
  .pt-scroll { overflow-x: auto; overscroll-behavior-x: contain; padding: 4px 4px 6px; }
  .pt {
    --cw: 54px;
    --ch: 62px;
    display: grid;
    grid-template-columns: 22px repeat(18, var(--cw));
    grid-template-rows: 20px repeat(7, var(--ch)) 14px repeat(2, var(--ch));
    gap: 2px;
    width: max-content;
    margin: 0 auto;
  }
  .pt-head, .pt-period {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
  }
  .pt-period { background: var(--surface); }
  .pt-cell {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 2px 1px 3px;
    min-width: 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--cat-unknown);
    color: var(--ink);
    font-size: 10px;
    line-height: 1.1;
    text-align: center;
  }
  .pt-cell:hover { border-color: var(--accent); }
  .pt-cell .z { position: absolute; top: 3px; left: 4px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-muted); }
  .pt-cell .sym { margin-top: 8px; font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.1; }
  /* 名前は10px。6文字以上は8.5px(8文字以上は2行に折り返す) */
  .pt-cell .nm { font-size: 10px; letter-spacing: -0.04em; color: var(--ink-muted); max-width: 100%; overflow-wrap: anywhere; text-wrap: balance; }
  .pt-cell .nm.long { font-size: 8.5px; letter-spacing: -0.06em; }
  .pt-cell[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 0; z-index: 2; }
  .pt-guide {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    border: 1px dashed var(--border);
    font-size: 8px;
    letter-spacing: -0.05em;
    line-height: 1.25;
    color: var(--ink-muted);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
  }
  .pt-guide .range { font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; color: var(--ink); }
  .pt-series-label { display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: 11px; color: var(--ink-muted); }

  /* 色分け */
  .pt[data-mode="cat"] [data-cat="alkali"] { background: var(--cat-alkali); }
  .pt[data-mode="cat"] [data-cat="alkaline-earth"] { background: var(--cat-alkaline-earth); }
  .pt[data-mode="cat"] [data-cat="transition"] { background: var(--cat-transition); }
  .pt[data-mode="cat"] [data-cat="lanthanoid"] { background: var(--cat-lanthanoid); }
  .pt[data-mode="cat"] [data-cat="actinoid"] { background: var(--cat-actinoid); }
  .pt[data-mode="cat"] [data-cat="metal"] { background: var(--cat-metal); }
  .pt[data-mode="cat"] [data-cat="nonmetal"] { background: var(--cat-nonmetal); }
  .pt[data-mode="cat"] [data-cat="halogen"] { background: var(--cat-halogen); }
  .pt[data-mode="cat"] [data-cat="noble"] { background: var(--cat-noble); }
  .pt[data-mode="cat"] [data-cat="unknown"] { background: var(--cat-unknown); }
  .pt[data-mode="state"] [data-state="solid"] { background: var(--state-solid); }
  .pt[data-mode="state"] [data-state="liquid"] { background: var(--state-liquid); }
  .pt[data-mode="state"] [data-state="gas"] { background: var(--state-gas); }
  .pt[data-mode="state"] [data-state="unknown"] { background: var(--state-unknown); }
  .pt[data-mode="type"] [data-type="metal"] { background: var(--type-metal); }
  .pt[data-mode="type"] [data-type="nonmetal"] { background: var(--type-nonmetal); }
  .pt[data-mode="type"] [data-type="unknown"] { background: var(--cat-unknown); }
  .pt-guide[data-cat="lanthanoid"] { background: var(--cat-lanthanoid); }
  .pt-guide[data-cat="actinoid"] { background: var(--cat-actinoid); }
  .pt:not([data-mode="cat"]) .pt-guide { background: var(--surface); }
  /* 金属と非金属の境界(階段状の太線) */
  .pt[data-mode="type"] .bd-l::before {
    content: ""; position: absolute; left: -3px; top: -2px; bottom: -2px;
    border-left: 3px solid var(--pt-boundary); pointer-events: none;
  }
  .pt[data-mode="type"] .bd-b::after {
    content: ""; position: absolute; left: -2px; right: -2px; bottom: -3px;
    border-bottom: 3px solid var(--pt-boundary); pointer-events: none;
  }

  /* 空きマスの要約(PCだけ) */
  .pt-summary {
    grid-column: 4 / 14;
    grid-row: 2 / 5;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 16px;
    margin: 4px 10px;
    border-radius: 12px;
    background: var(--surface-2);
    min-width: 0;
  }
  .pt-summary .big { font-family: var(--font-display); font-weight: 700; font-size: 54px; line-height: 1; min-width: 1.4em; text-align: center; }
  .pt-summary .lines { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--ink-muted); min-width: 0; }
  .pt-summary .lines .name { font-size: 17px; font-weight: 700; color: var(--ink); }
  .pt-summary .lines .mono { font-family: var(--font-mono); }
  .pt-summary.empty { color: var(--ink-faint); font-size: 13px; justify-content: center; }

  .scroll-hint { display: none; text-align: center; margin: 6px 0 0; }

  /* 凡例 */
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 14px 0 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--ink-muted); }
  .legend li { display: flex; align-items: center; gap: 6px; }
  .legend .sw { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border); flex: none; }
  .legend .sw.line { border: none; border-radius: 0; height: 0; border-top: 3px solid var(--pt-boundary); width: 18px; }

  /* ---------- 詳細 ---------- */
  .detail { display: grid; grid-template-columns: 150px 1fr; gap: 18px 22px; align-items: start; scroll-margin: 16px; }
  .detail-empty { margin: 0; color: var(--ink-faint); font-size: 0.92rem; text-align: center; padding: 20px 0; }
  .el-block {
    position: relative;
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 26px 10px 14px;
    text-align: center;
  }
  .el-block .z { position: absolute; top: 8px; left: 10px; font-family: var(--font-mono); font-size: 14px; color: var(--ink-muted); }
  .el-block .sym { font-family: var(--font-display); font-weight: 700; font-size: 56px; line-height: 1; }
  .el-block .nm { margin-top: 6px; font-size: 15px; font-weight: 700; }
  .el-block .mass { margin-top: 2px; font-family: var(--font-mono); font-size: 13px; color: var(--ink-muted); }
  .detail-body { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .detail-body .given { justify-content: start; grid-template-columns: auto 1fr; }
  .detail-body .given dd { text-align: left; }
  .note { margin: 0; font-size: 0.92rem; line-height: 1.75; }
  .atom-link { font-size: 0.88rem; font-weight: 600; color: var(--accent); text-decoration: none; }
  .atom-link:hover { text-decoration: underline; }

  /* ---------- スマホ表示の調整 ---------- */
  @media (max-width: 480px) {
    .card { padding: 18px 14px; }
    .controls { flex-direction: column; align-items: stretch; }
    .mode-tabs { min-width: 0; }
    .mode-tab { font-size: 13px; padding: 8px 4px; }
    .search-row input { flex: 1; width: auto; font-size: 16px; }
    .pt { --cw: 40px; --ch: 46px; }
    .pt-cell .nm { display: none; }
    .pt-cell .sym { font-size: 16px; margin-top: 7px; }
    .pt-cell .z { font-size: 9px; top: 2px; left: 3px; }
    .pt-period { position: sticky; left: 0; z-index: 3; }
    .pt-scroll { padding-left: 0; }
    .pt-wrap::after {
      content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 22px; pointer-events: none;
      background: linear-gradient(to right, transparent, var(--surface));
    }
    .pt-summary { display: none; }
    .pt-guide .word { display: none; }
    .pt-guide .range { font-size: 8px; }
    .pt-series-label { font-size: 9.5px; padding-right: 3px; }
    .scroll-hint { display: block; }
    .detail { grid-template-columns: 1fr; }
    .el-block { max-width: 220px; width: 100%; justify-self: center; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="page-links" aria-label="ページの移動">
    <a class="back-link" href="../../../index.html">← ページ一覧</a>
    <a class="back-link" href="../../../study/review/habit-planner/index.html">習慣プランナー →</a>
  </nav>
  <header class="hero">
    <p class="eyebrow">CHEMISTRY LAB · 周期表</p>
    <h1>周期表</h1>
    <p class="tagline">118の元素を、分類・常温の状態・金属と非金属で色分けして見られます。元素を押すと、性質がわかります。</p>
    <nav class="site-nav" aria-label="化学基礎ラボのページ">
      <a href="index.html">道場</a>
      <span aria-current="page">周期表</span>
      <a href="atom.html">原子の組み立て</a>
      <a href="equation.html">反応式の組み立て</a>
    </nav>
  </header>

  <div class="card">
    <div class="controls">
      <div class="control-group">
        <span class="label" id="modeLabel">色分け</span>
        <div class="mode-tabs" id="modeTabs" role="group" aria-labelledby="modeLabel">
          <button type="button" class="mode-tab" data-mode="cat" aria-pressed="true">分類</button>
          <button type="button" class="mode-tab" data-mode="state" aria-pressed="false">常温の状態</button>
          <button type="button" class="mode-tab" data-mode="type" aria-pressed="false">金属・非金属</button>
        </div>
      </div>
      <div class="control-group">
        <label class="label" for="searchInput">元素を探す(記号・名前・原子番号)</label>
        <div class="search-row">
          <input type="search" id="searchInput" placeholder="例: Na、鉄、26" autocomplete="off" enterkeyhint="search">
          <button type="button" class="btn-secondary" id="searchBtn">探す</button>
        </div>
        <p class="search-msg" id="searchMsg" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="pt-wrap">
      <div class="pt-scroll" id="ptScroll">
        <div class="pt" id="pt" data-mode="cat"></div>
      </div>
    </div>
    <p class="hint scroll-hint" aria-hidden="true">← 横にスクロールできます →</p>
    <ul class="legend" id="legend" aria-label="色の意味"></ul>
  </div>

  <div class="card" id="detailCard">
    <h2>元素の詳しい情報</h2>
    <div id="detail" aria-live="polite"><p class="detail-empty">元素を押すと詳しく表示します</p></div>
  </div>
</div>

<script src="../../../shared/store.js"></script>
<script src="data.js"></script>
<script src="data-elements.js"></script>
<script>
(function () {
  "use strict";

  var pt = document.getElementById("pt");
  var ptScroll = document.getElementById("ptScroll");
  var legend = document.getElementById("legend");
  var detail = document.getElementById("detail");
  var detailCard = document.getElementById("detailCard");
  var searchInput = document.getElementById("searchInput");
  var searchMsg = document.getElementById("searchMsg");
  var MODES = ["cat", "state", "type"];
  var mode = Store.load(CHEM.PERIODIC_MODE_KEY, "cat");
  if (MODES.indexOf(mode) < 0) mode = "cat";
  var current = null;   // 選んでいる元素
  var cells = {};       // 原子番号 → ボタン
  var summary = null;

  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function place(node, col, row, colEnd) {
    node.style.gridColumn = colEnd ? col + " / " + colEnd : String(col);
    node.style.gridRow = String(row);
  }
  function isSmall() { return window.matchMedia("(max-width: 480px)").matches; }

  // 表の位置: 列 1 は周期番号、族 g は列 g+1。行 1 は族番号、周期 p は行 p+1、ランタノイドは行 10、アクチノイドは行 11
  function cellPos(e) {
    if (e.series) return { col: 1 + 3 + (e.z - (e.series === "lanthanoid" ? 57 : 89)), row: e.series === "lanthanoid" ? 10 : 11 };
    return { col: e.group + 1, row: e.period + 1 };
  }

  // ---------- 表を組み立てる ----------
  function build() {
    for (var g = 1; g <= 18; g++) { var h = el("div", "pt-head", String(g)); place(h, g + 1, 1); h.setAttribute("aria-hidden", "true"); pt.appendChild(h); }
    for (var p = 1; p <= 7; p++) { var pe = el("div", "pt-period", String(p)); place(pe, 1, p + 1); pe.setAttribute("aria-hidden", "true"); pt.appendChild(pe); }
    // 6・7周期の3族の案内と、下の2行の見出し
    [["lanthanoid", "57–71", "ランタノイド", 7, 10], ["actinoid", "89–103", "アクチノイド", 8, 11]].forEach(function (s) {
      var gd = el("div", "pt-guide");
      gd.dataset.cat = s[0];
      gd.appendChild(el("span", "range", s[1]));
      gd.appendChild(el("span", "word", s[2]));
      place(gd, 4, s[3]);
      pt.appendChild(gd);
      var lb = el("div", "pt-series-label", s[2]);
      place(lb, 1, s[4], 4);
      pt.appendChild(lb);
    });
    // 空きマスの要約
    summary = el("div", "pt-summary empty", "元素を押すと、ここに要点を出します");
    summary.setAttribute("aria-hidden", "true");
    pt.appendChild(summary);

    var grid = {};
    CHEM.ELEMENTS.forEach(function (e) { if (!e.series) grid[e.period + "-" + e.group] = e; });
    CHEM.ELEMENTS.forEach(function (e) {
      var b = el("button", "pt-cell");
      b.type = "button";
      b.dataset.z = e.z;
      b.dataset.cat = e.category;
      b.dataset.state = e.state;
      b.dataset.type = e.type;
      b.setAttribute("aria-pressed", "false");
      b.setAttribute("aria-label", e.z + "番 " + e.sym + " " + e.name);
      b.appendChild(el("span", "z", String(e.z)));
      b.appendChild(el("span", "sym", e.sym));
      b.appendChild(el("span", "nm" + (e.name.length >= 6 ? " long" : ""), e.name));
      // 金属・非金属の境界: 非金属の左が金属(または13族の左の空き)なら左に、下が金属なら下に線を引く
      if (e.type === "nonmetal" && !e.series) {
        var left = grid[e.period + "-" + (e.group - 1)];
        if ((left && left.type === "metal") || (!left && e.group === 13)) b.classList.add("bd-l");
        var below = grid[(e.period + 1) + "-" + e.group];
        if (below && below.type === "metal" && e.group >= 13) b.classList.add("bd-b");
      }
      var pos = cellPos(e);
      place(b, pos.col, pos.row);
      b.addEventListener("click", function () { select(e.z, { from: "click" }); });
      cells[e.z] = b;
      pt.appendChild(b);
    });
  }

  // ---------- 色分け ----------
  var LEGENDS = {
    cat: CHEM.CAT_ORDER.map(function (k) { return { v: "--cat-" + k, t: CHEM.CAT_INFO[k].short }; }),
    state: [{ v: "--state-solid", t: "固体" }, { v: "--state-liquid", t: "液体" }, { v: "--state-gas", t: "気体" }, { v: "--state-unknown", t: "不明" }],
    type: [{ v: "--type-metal", t: "金属元素" }, { v: "--type-nonmetal", t: "非金属元素" }, { v: "--cat-unknown", t: "不明(109番以降)" }, { line: true, t: "金属と非金属の境界" }]
  };
  function setMode(m) {
    mode = m;
    pt.dataset.mode = m;
    document.querySelectorAll(".mode-tab").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.mode === m ? "true" : "false"); });
    legend.innerHTML = "";
    LEGENDS[m].forEach(function (it) {
      var li = el("li");
      var sw = el("span", "sw" + (it.line ? " line" : ""));
      if (!it.line) sw.style.background = "var(" + it.v + ")";
      li.appendChild(sw);
      li.appendChild(el("span", "", it.t));
      legend.appendChild(li);
    });
    if (m === "state") {
      var note = el("li", "", "25℃・1気圧での単体の状態。Ga(融点約30℃)と Cs(約28℃)は固体。");
      legend.appendChild(note);
    }
    Store.save(CHEM.PERIODIC_MODE_KEY, m);
  }
  document.querySelectorAll(".mode-tab").forEach(function (b) {
    b.addEventListener("click", function () { setMode(b.dataset.mode); });
  });

  // ---------- 選ぶ ----------
  function groupText(e) { return e.series ? "3族(" + CHEM.CAT_INFO[e.series].short + ")" : e.group + "族"; }
  function catVar(e) { return "var(--cat-" + e.category + ")"; }

  function renderDetail(e) {
    detail.innerHTML = "";
    var wrap = el("div", "detail");
    var block = el("div", "el-block");
    block.style.background = catVar(e);
    block.appendChild(el("span", "z", String(e.z)));
    block.appendChild(el("div", "sym", e.sym));
    block.appendChild(el("div", "nm", e.name));
    block.appendChild(el("div", "mass", "原子量 " + e.mass));
    wrap.appendChild(block);

    var body = el("div", "detail-body");
    var dl = el("dl", "given");
    [
      ["族", groupText(e)],
      ["周期", "第" + e.period + "周期"],
      ["分類", CHEM.CAT_INFO[e.category].label],
      ["典型/遷移", e.block],
      ["金属/非金属", CHEM.TYPE_INFO[e.type]],
      ["常温の状態", CHEM.STATE_INFO[e.state]],
      ["電子配置", e.z <= 20 ? CHEM.configText(e.z) : "—(化学基礎の範囲外)"]
    ].forEach(function (r) {
      dl.appendChild(el("dt", "", r[0]));
      dl.appendChild(el("dd", "", r[1]));
    });
    body.appendChild(dl);
    body.appendChild(el("p", "note", e.note));
    if (e.z <= 20) {
      var iso = CHEM.isotopesOf(e.z);
      var a = el("a", "atom-link", "原子の組み立てで見る →");
      a.href = "atom.html?z=" + e.z + "&n=" + (iso ? iso.main - e.z : e.z) + "&e=" + e.z;
      body.appendChild(a);
    }
    wrap.appendChild(body);
    detail.appendChild(wrap);
  }

  function renderSummary(e) {
    summary.className = "pt-summary";
    summary.innerHTML = "";
    var big = el("div", "big", e.sym);
    summary.appendChild(big);
    var lines = el("div", "lines");
    lines.appendChild(el("span", "name", e.name));
    lines.appendChild(el("span", "mono", "原子番号 " + e.z + " · 原子量 " + e.mass));
    lines.appendChild(el("span", "", CHEM.CAT_INFO[e.category].label));
    summary.appendChild(lines);
  }

  function select(z, opt) {
    var e = CHEM.element(z);
    if (!e) return;
    opt = opt || {};
    if (current && cells[current.z]) cells[current.z].setAttribute("aria-pressed", "false");
    current = e;
    cells[z].setAttribute("aria-pressed", "true");
    renderDetail(e);
    renderSummary(e);
    try { history.replaceState(null, "", "?z=" + z); } catch (err) { /* ファイルで開いたときなど */ }
    if (opt.from === "search") {
      cells[z].scrollIntoView({ inline: "center", block: "nearest" });
      if (isSmall()) detailCard.scrollIntoView({ block: "nearest", behavior: "smooth" });
    } else if (opt.from === "click" && isSmall()) {
      detailCard.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }

  // ---------- 検索 ----------
  function doSearch() {
    var s = searchInput.value.trim();
    if (!s) { searchMsg.textContent = ""; return; }
    var e = CHEM.findElement(s);
    if (!e) { searchMsg.textContent = "「" + s + "」は見つかりません"; return; }
    searchMsg.textContent = "";
    select(e.z, { from: "search" });
  }
  searchInput.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.isComposing) { ev.preventDefault(); doSearch(); }
  });
  searchInput.addEventListener("input", function () { if (!searchInput.value.trim()) searchMsg.textContent = ""; });
  document.getElementById("searchBtn").addEventListener("click", doSearch);

  build();
  setMode(mode);
  // ?z= で開いたとき
  var z0 = null;
  try { z0 = Number(new URLSearchParams(location.search).get("z")); } catch (err) { z0 = null; }
  if (z0 && CHEM.element(z0)) {
    select(z0);
    // スマホでは、選んだ元素が表の中で見えるようにする(ページは動かさない)
    var c = cells[z0];
    if (c) ptScroll.scrollLeft = Math.max(0, c.offsetLeft - ptScroll.clientWidth / 2 + c.offsetWidth / 2);
  }
})();
</script>
</body>
</html>
