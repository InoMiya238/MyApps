<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投資入門コース | 投資シミュレーション道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../shared/base.css">
<link rel="stylesheet" href="theme.css">

<style>
  .app { max-width: 760px; gap: 22px; }
  .app.is-lesson { max-width: 960px; }
  [hidden] { display: none !important; }

  /* ---------- Hero ---------- */
  .tagline { max-width: 46ch; }
  .site-nav {
    margin: 14px 0 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 18px;
    font-size: 13px;
  }
  .site-nav a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .site-nav a:hover { text-decoration: underline; }
  .site-nav [aria-current="page"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom: 2px solid var(--accent);
  }
  .notice {
    margin: 16px auto 0;
    max-width: 60ch;
    background: var(--surface-2);
    color: var(--ink-muted);
    font-size: 13px;
    line-height: 1.7;
    border-radius: 10px;
    padding: 12px 14px;
    text-align: left;
  }
  .hero.is-compact { padding-bottom: 12px; }
  .hero.is-compact h1 { font-size: 24px; margin-bottom: 4px; }
  .hero.is-compact .tagline,
  .hero.is-compact .notice { display: none; }

  button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  h2[tabindex="-1"]:focus { outline: none; }

  /* ---------- カード・ボタン(index.html と同じ) ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    box-shadow: 0 1px 2px var(--shadow);
    min-width: 0;
  }
  .card h2 {
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 14px;
  }
  .btn-primary, .btn-secondary {
    font-family: var(--font-body);
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    padding: 12px 14px;
    min-height: 44px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-decoration: none;
    line-height: 1.4;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); }
  .btn-primary:disabled, .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-small {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    min-height: 36px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .lbl-short { display: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 8px; }
  .chip-btn {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    min-height: 36px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    cursor: pointer;
  }
  .chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }
  .hint {
    font-size: 0.78rem;
    color: var(--ink-faint);
    margin: 8px 0 0;
    line-height: 1.6;
  }
  .val {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--ink);
    white-space: nowrap;
  }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .pos { color: var(--good); }
  .neg { color: var(--bad); }

  /* ---------- 進み具合 ---------- */
  .progress { display: flex; align-items: center; gap: 12px; }
  .progress-track { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .progress-bar { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.2s ease; }
  .progress-text {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-muted);
    white-space: nowrap;
  }

  /* ---------- コースのトップ ---------- */
  .view-top { display: flex; flex-direction: column; gap: 18px; }
  .course-intro ul { margin: 0; padding-left: 1.2em; }
  .course-intro li { font-size: 14.5px; line-height: 1.75; color: var(--ink); margin-bottom: 4px; }
  .course-intro li:last-child { margin-bottom: 0; }
  .resume { align-self: stretch; }
  .lesson-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .lesson-row {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr);
    gap: 4px 14px;
    align-items: start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--ink);
    text-decoration: none;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .lesson-row:hover { border-color: var(--accent); }
  .lesson-num {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
  }
  .lesson-row.is-done .lesson-num { background: var(--good-soft); color: var(--good); }
  .lesson-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .lesson-row .lesson-title { font-size: 15.5px; font-weight: 600; line-height: 1.5; margin-top: 4px; }
  .lesson-summary { font-size: 13.5px; color: var(--ink-muted); line-height: 1.6; }
  .lesson-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .part-block { display: flex; flex-direction: column; gap: 10px; }
  .part-head { padding: 6px 2px 0; }
  .part-no { margin: 0; font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: var(--accent); }
  .part-head h2 { margin: 2px 0 4px; font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; line-height: 1.4; }
  .part-desc { margin: 0; font-size: 13.5px; line-height: 1.65; color: var(--ink-muted); }
  .skip-note { margin: -6px 0 0; font-size: 13.5px; line-height: 1.7; color: var(--ink-muted); text-align: center; }
  .skip-note a { color: var(--accent); font-weight: 600; }
  .summary-card .summary-part { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 24px 0 0; padding-top: 14px; border-top: 1px solid var(--border); }
  .summary-card .summary-part:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
  .summary-card h3 { font-size: 15px; font-weight: 600; margin: 18px 0 6px; }
  .summary-card .summary-part + h3 { margin-top: 10px; }
  .summary-card ul { margin: 0; padding-left: 1.2em; }
  .summary-card li { font-size: 14px; line-height: 1.7; }

  /* ---------- レッスン画面 ---------- */
  .course-layout {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }
  .toc {
    position: sticky;
    top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 10px;
    min-width: 0;
  }
  .toc > summary { display: none; }
  .toc-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    padding: 2px 8px 8px;
    font-size: 13px;
    font-weight: 700;
  }
  .toc-head .progress-text { font-size: 12px; }
  .toc-part {
    margin: 10px 0 2px;
    padding: 0 8px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-faint);
    line-height: 1.5;
  }
  .toc-part:first-child { margin-top: 0; }
  .toc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .toc-item {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    padding: 6px 8px;
    border-left: 3px solid transparent;
    border-radius: 8px;
    color: var(--ink);
    text-decoration: none;
    font-size: 13.5px;
    line-height: 1.4;
  }
  .toc-item:hover { background: var(--surface-2); }
  .toc-item.is-current { background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
  .toc-no {
    flex: none;
    width: 22px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .toc-item.is-done .toc-no { color: var(--good); }
  .toc-top {
    display: block;
    margin: 8px 8px 0;
    padding: 6px 0 2px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
  }
  .toc-top:hover { text-decoration: underline; }

  .lesson { padding: 26px 30px; }
  .lesson-head { margin-bottom: 8px; }
  .lesson-no {
    margin: 0 0 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--accent);
  }
  .lesson-head h2.lesson-title {
    margin: 0 0 10px;
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 600;
    line-height: 1.35;
    text-wrap: balance;
    display: block;
  }
  .lesson-lead { margin: 0; font-size: 16px; line-height: 1.7; color: var(--ink-muted); }

  .lesson-body { font-size: 15.5px; line-height: 1.85; }
  .lesson-body > * { margin: 0 0 0.9em; }
  .lesson-body > h3 { font-size: 17px; font-weight: 600; margin: 28px 0 8px; line-height: 1.5; }
  .lesson-body > p { margin: 0 0 0.9em; }
  .c-faint { color: var(--ink-faint); font-weight: 400; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .lesson-body b { font-weight: 700; }
  .lesson-body a, .feedback a { color: var(--accent); font-weight: 600; }
  a.term-link { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; font-weight: 600; }
  .analogy {
    background: var(--surface-2);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .note-box {
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--ink-muted);
    font-size: 14px;
    line-height: 1.75;
  }
  .box-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .note-box .box-label { color: var(--ink-faint); }
  ul.bullets { padding-left: 1.3em; }
  ul.plain { list-style: none; padding: 0; }
  ul.bullets li, ul.plain li { margin-bottom: 0.35em; }

  /* 図: 株式・債券・投資信託 */
  .kind-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .kind-card {
    background: var(--surface-2);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.6;
    min-width: 0;
  }
  .kind-card h4 { margin: 0 0 6px; font-family: var(--font-display); font-size: 17px; font-weight: 600; }
  .kind-card dl { margin: 0; display: flex; flex-direction: column; gap: 6px; }
  .kind-card dt { font-size: 11.5px; font-weight: 700; color: var(--ink-faint); }
  .kind-card dd { margin: 0; }

  /* ---------- ミニ体験 ---------- */
  section.mini {
    border: 1.5px solid var(--accent-soft);
    border-radius: 14px;
    padding: 16px;
    background: var(--surface);
    font-size: 14.5px;
    line-height: 1.6;
    margin: 22px 0;
  }
  .mini-tag { margin: 0 0 2px; font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--accent); }
  .lesson-body section.mini h3.mini-title { margin: 0 0 10px; font-size: 16px; font-weight: 600; line-height: 1.5; }
  .mini-controls { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .ctl-label { font-size: 12.5px; font-weight: 600; color: var(--ink-muted); }
  .mini-out { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .mini-out > * { margin: 0; }
  .mini-note { margin-top: 10px; }
  .mini .btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .mini .btn-row > * { flex: 1 1 140px; }
  .mini-line { font-size: 14px; line-height: 1.7; }
  .field { padding: 6px 0; }
  .field.stack { display: flex; flex-direction: column; gap: 2px; }
  .field-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 6px 0 0; }
  input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 2px 0 0; cursor: pointer; }
  .check-list .field { border-bottom: 1px solid var(--border); padding: 4px 0; }
  .check-list .field:last-child { border-bottom: none; }
  .check-label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 14.5px; line-height: 1.6; padding: 6px 0; min-height: 36px; }
  .check-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

  /* グラフ(index.html と同じ描き方) */
  .chart-wrap { position: relative; width: 100%; height: 220px; }
  .chart-wrap svg { display: block; overflow: visible; }
  .chart-wrap svg text { font-family: var(--font-mono); font-size: 11px; fill: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .grid-line { stroke: var(--chart-grid); stroke-width: 1; }
  .ln { fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .dash { stroke-dasharray: 4 4; }
  .s1 { stroke: var(--series-1); }
  .s2 { stroke: var(--series-2); }
  .s3 { stroke: var(--series-3); }
  .s5 { stroke: var(--series-5); }
  .f1 { fill: var(--series-1); }
  .legend {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    font-size: 12px;
    color: var(--ink-muted);
  }
  .legend li { display: flex; align-items: center; gap: 6px; }
  .sw { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid currentColor; }
  .sw.dashed { border-top-style: dashed; }
  .sw.dot { width: 10px; height: 10px; border: none; border-radius: 50%; background: currentColor; }
  .c1 { color: var(--series-1); }
  .c2 { color: var(--series-2); }
  .c3 { color: var(--series-3); }
  .c5 { color: var(--series-5); }

  .stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .stat-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat-box { text-align: center; background: var(--surface-2); border-radius: 12px; padding: 12px 6px; min-width: 0; }
  .stat-label { font-size: 11.5px; color: var(--ink-muted); line-height: 1.4; }
  .stat-num {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--ink);
    margin-top: 4px;
    overflow-wrap: anywhere;
  }
  .stat-sub { font-size: 11px; color: var(--ink-faint); margin-top: 3px; line-height: 1.4; }
  .badge {
    display: inline-block;
    margin-left: 4px;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--good-soft);
    color: var(--good);
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    vertical-align: middle;
  }
  .extra-line {
    font-size: 0.88rem;
    line-height: 1.7;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--surface-2);
  }
  .readout {
    min-height: 1.6em;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    line-height: 1.6;
  }
  .auto-point { padding: 12px 14px; border-radius: 10px; font-size: 0.92rem; line-height: 1.6; font-weight: 600; }
  .auto-point.good { background: var(--good-soft); color: var(--good); }

  .tbl { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  .tbl th, .tbl td { padding: 7px 6px; border-bottom: 1px solid var(--border); text-align: right; }
  .tbl th { font-weight: 600; color: var(--ink-muted); font-size: 0.78rem; line-height: 1.4; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; }
  .tbl td { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .tbl td.txt { font-family: var(--font-body); }
  .tbl tr.total td { font-weight: 700; border-bottom: none; }
  .rule-box { font-size: 13.5px; line-height: 1.7; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }

  /* 範囲バー */
  .range-list { display: flex; flex-direction: column; gap: 14px; }
  .range-head { display: flex; justify-content: space-between; gap: 4px 8px; flex-wrap: wrap; font-size: 0.86rem; margin-bottom: 4px; }
  .range-head .num { font-size: 0.8rem; color: var(--ink-muted); margin-left: auto; text-align: right; }
  .range-track { position: relative; height: 14px; background: var(--surface-2); border-radius: 7px; }
  .range-bar { position: absolute; top: 3px; height: 8px; border-radius: 4px; background: currentColor; opacity: 0.55; }
  .range-dot { position: absolute; top: 1px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: currentColor; border: 2px solid var(--surface); }
  .range-dot.pt { top: 2px; width: 10px; height: 10px; margin-left: -5px; border: none; opacity: 0.75; }
  .range-zero { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1.5px dashed var(--ink-faint); }
  .range-sub { font-size: 0.78rem; color: var(--ink-faint); margin-top: 3px; }
  .range-axis { position: relative; height: 16px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
  .range-axis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .range-axis span:first-child { transform: none; }
  .range-axis span:last-child { transform: translateX(-100%); }

  /* お金の流れ(銀行) */
  .flow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1fr); align-items: center; gap: 6px; }
  .flow-node { background: var(--surface-2); border-radius: 12px; padding: 10px 6px; text-align: center; font-weight: 700; font-size: 14px; line-height: 1.4; min-width: 0; }
  .flow-node small { display: block; font-size: 11px; font-weight: 500; color: var(--ink-muted); margin-top: 2px; }
  .flow-node.is-bank { background: var(--accent-soft); color: var(--accent); }
  .flow-link { display: flex; flex-direction: column; gap: 4px; text-align: center; font-size: 11.5px; line-height: 1.35; min-width: 0; }
  .flow-link .fwd { color: var(--ink-muted); }
  .flow-link .back { color: var(--good); font-weight: 700; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .flow .v-only { display: none; }
  .formula { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px; line-height: 1.7; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; overflow-wrap: anywhere; }

  /* 10×10 マス */
  .basket { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; max-width: 240px; }
  .basket span { aspect-ratio: 1; border-radius: 3px; background: var(--surface-2); }
  .basket span.hit-bad { background: var(--bad); }
  .basket span.hit-good { background: var(--good); }

  /* ---------- ここだけ覚える ---------- */
  aside.keypoints {
    background: var(--accent-soft);
    border-left: 4px solid var(--accent);
    border-radius: 12px;
    padding: 14px 18px;
    margin: 26px 0 0;
  }
  aside.keypoints h3 { margin: 0 0 8px; font-size: 15px; font-weight: 700; color: var(--accent); }

<script>
(function () {
  "use strict";

  var KEY = "investmentSimulatorCourse";
  var L = INVEST_LESSONS;
  var N = L.length;
  var PARTS = L.parts || [];
  var TAB_LABEL = { compound: "複利と長期", dca: "積立と一括", diversify: "分散投資", timing: "売買ルール" };
  var KEYS = ["A", "B", "C", "D"];
  var svgNS = "http://www.w3.org/2000/svg";
  var MAN = 10000;

  var CHECKS = [
    { id: "fund", text: "生活防衛資金を、預金で別に取ってある" },
    { id: "spare", text: "投資に回すのは、当面使う予定のないお金だけにする" },
    { id: "drop", text: "何%くらい下がっても売らずにいられるか、考えた" },
    { id: "long", text: "10年以上など、長く続けるつもりでいる" },
    { id: "know", text: "買うもののしくみ(何に投資しているか)と手数料を説明できる" },
    { id: "scam", text: "「必ずもうかる」話は詐欺を疑う" },
    { id: "noloan", text: "借金をしてまで投資はしない" },
    { id: "official", text: "NISAなど制度の最新情報を、公式サイトで確かめる" }
  ];

  var TERM_BY_ID = {};
  INVEST_TERMS.forEach(function (t) { TERM_BY_ID[t.id] = t; });

  // ---------- 保存 ----------
  // { done: [id…], lastId: 最後に開いたレッスンの id(""= まだ), checks: [id…] }
  // 古い形(10レッスンの時期)の last: 1〜10 は読まない。続きは最初の未読(新しい第1部)から
  var LESSON_IDS = L.map(function (l) { return l.id; });
  function uniqKnown(arr, known) {
    if (!Array.isArray(arr)) return [];
    var out = [];
    arr.forEach(function (v) { if (known.indexOf(v) >= 0 && out.indexOf(v) < 0) out.push(v); });
    return out;
  }
  function sanitize(raw) {
    raw = raw && typeof raw === "object" ? raw : {};
    var lastId = "";
    if (typeof raw.lastId === "string" && LESSON_IDS.indexOf(raw.lastId) >= 0) lastId = raw.lastId;
    return {
      done: uniqKnown(raw.done, LESSON_IDS),
      lastId: lastId,
      checks: uniqKnown(raw.checks, CHECKS.map(function (c) { return c.id; }))
    };
  }
  var state = sanitize(Store.load(KEY, null));
  function save() { Store.save(KEY, state); }
  function isDone(id) { return state.done.indexOf(id) >= 0; }
  function setDone(id, on) {
    var i = state.done.indexOf(id);
    if (on && i < 0) state.done.push(id);
    if (!on && i >= 0) state.done.splice(i, 1);
    save();
  }
  function doneCount() { return state.done.length; }
  // 続きから読むレッスン: 最後に開いたレッスンから先の最初の未読。なければ最初の未読
  function resumeLesson() {
    var from = Math.max(0, LESSON_IDS.indexOf(state.lastId)), k;
    for (k = from; k < N; k++) if (!isDone(L[k].id)) return L[k];
    for (k = 0; k < N; k++) if (!isDone(L[k].id)) return L[k];
    return null;
  }

  // ---------- 小さな道具 ----------
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function html(tag, cls, h) { var e = el(tag, cls); e.innerHTML = h; return e; }
  function link(href, cls, text) { var a = el("a", cls, text); a.href = href; return a; }

  function roundTo(v, d) { var f = Math.pow(10, d); return Math.round(v * f) / f; }
  // 1万円以上は「約◯◯万円」(小数 d 桁)、それ未満は「◯,◯◯◯円」。ちょうどの値なら「約」をつけない
  function fmtMan(yen, d) {
    if (d === undefined) d = 1;
    var a = Math.abs(yen), sign = yen < 0 ? "−" : "";
    if (a < 0.5) return "0円";
    if (a < MAN) {
      var r = Math.round(a);
      return sign + (Math.abs(r - a) < 0.01 ? "" : "約") + r.toLocaleString("ja-JP") + "円";
    }
    var v = roundTo(a / MAN, d);
    var exact = Math.abs(v * MAN - a) < 1;
    var dd = exact && v % 1 === 0 ? 0 : d;
    return sign + (exact ? "" : "約") + v.toLocaleString("ja-JP", { minimumFractionDigits: dd, maximumFractionDigits: dd }) + "万円";
  }
  function fmtYen(v) { return Math.round(v).toLocaleString("ja-JP") + "円"; }
  // 割合(0.24 → +24%)。1%未満は小数1桁
  function fmtPct(x, signed) {
    var p = x * 100, a = Math.abs(p);
    var s = (a < 1 && a >= 0.05 ? a.toFixed(1) : String(Math.round(a))) + "%";
    if (s === "0%" || s === "0.0%") return "0%";
    if (x < 0) return "−" + s;
    return (signed ? "+" : "") + s;
  }
  function statBox(label, num, sub, cls) {
    return '<div class="stat-box"><div class="stat-label">' + label + '</div><div class="stat-num ' + (cls || "") + '">' + num + "</div>" +
      (sub ? '<div class="stat-sub">' + sub + "</div>" : "") + "</div>";
  }
  function legend(items) {
    var ul = el("ul", "legend");
    ul.innerHTML = items.map(function (it) {
      return '<li><span class="sw ' + (it.kind || "") + " " + it.c + '"></span>' + it.label + "</li>";
    }).join("");
    return ul;
  }
  // チップの選択。opts: [{ v, label }]
  function chipGroup(label, opts, cur, onChange) {
    var wrap = el("div", "ctl");
    wrap.appendChild(el("div", "ctl-label", label));
    var box = el("div", "chips");
    box.setAttribute("role", "group");
    box.setAttribute("aria-label", label);
    opts.forEach(function (o) {
      var b = el("button", "chip-btn", o.label);
      b.type = "button";
      b.setAttribute("aria-pressed", String(o.v === cur));
      b.addEventListener("click", function () {
        box.querySelectorAll(".chip-btn").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        onChange(o.v);
      });
      box.appendChild(b);
    });
    wrap.appendChild(box);
    return wrap;
  }
  var uid = 0;
  function rangeField(label, min, max, step, cur, fmt, onInput) {
    var id = "rng-" + (++uid);
    var f = el("div", "field stack");
    var top = el("div", "field-top");
    var lb = el("label", "", label); lb.htmlFor = id;
    var val = el("span", "val", fmt(cur));
    top.appendChild(lb); top.appendChild(val);
    var inp = el("input");
    inp.type = "range"; inp.id = id; inp.min = min; inp.max = max; inp.step = step; inp.value = cur;
    inp.addEventListener("input", function () { var v = parseFloat(inp.value); val.textContent = fmt(v); onInput(v); });
    f.appendChild(top); f.appendChild(inp);
    // あとから値を変える(チップでまとめて設定するときなど)
    f.setValue = function (v) { inp.value = v; val.textContent = fmt(v); };
    return f;
  }

  // ---------- 線グラフ(index.html と同じ描き方: viewBox なし、幅は親の clientWidth) ----------
  function svgEl(tag, attrs) {
    var e = document.createElementNS(svgNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function textWidth(str) {
    var w = 0;
    for (var i = 0; i < str.length; i++) w += str.charCodeAt(i) > 0x2000 ? 11 : 6.7;
    return w;
  }
  function niceStep(raw) {
    var p = Math.pow(10, Math.floor(Math.log10(raw)));
    var f = raw / p;
    var n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return n * p;
  }
  function fmtAxis(v) {
    var a = Math.abs(v), s;
    if (a >= MAN) {
      var n = a / MAN;
      s = (Math.abs(n - Math.round(n)) < 1e-9 ? Math.round(n).toLocaleString("ja-JP") : String(Number(n.toFixed(2)))) + "万";
    } else s = Math.round(a).toLocaleString("ja-JP");
    return (v < 0 ? "−" : "") + s;
  }
  var ro = typeof ResizeObserver === "function" ? new ResizeObserver(function (entries) {
    entries.forEach(function (en) { drawChart(en.target); });
  }) : null;

  // cfg: { xMax, xTicks: [{ v, label }], series: [{ ys, cls, dash, w }], zeroBase, aria }
  function lineChart(wrap, cfg) {
    wrap._cfg = cfg;
    drawChart(wrap);
    if (ro && !wrap._observed) { ro.observe(wrap); wrap._observed = true; }
  }
  function drawChart(wrap) {
    var cfg = wrap._cfg;
    if (!cfg) return;
    var W = wrap.clientWidth, H = wrap.clientHeight;
    if (!W || !H) return;
    var l = 46, r = 10, tp = 10, b = 24;
    var ph = H - tp - b;
    var lo = Infinity, hi = -Infinity;
    cfg.series.forEach(function (s) { s.ys.forEach(function (v) { if (isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }); });
    if (cfg.zeroBase) lo = Math.min(0, lo);
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    if (hi - lo < 1e-9) { hi = lo + Math.max(1, Math.abs(lo) * 0.1); if (!cfg.zeroBase) lo -= Math.max(1, Math.abs(lo) * 0.1); }
    var step = niceStep((hi - lo) / 4);
    var y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
    var ticks = [];
    for (var tv = y0; tv <= y1 + step * 1e-6; tv += step) ticks.push(Math.abs(tv) < step * 1e-6 ? 0 : tv);
    var labelW = 0;
    ticks.forEach(function (t) { labelW = Math.max(labelW, textWidth(fmtAxis(t))); });
    l = Math.max(40, Math.ceil(labelW) + 10);
    var pw = W - l - r;
    function X(t) { return l + (t / cfg.xMax) * pw; }
    function Y(v) { return tp + (1 - (v - y0) / (y1 - y0)) * ph; }

    var svg = svgEl("svg", { width: W, height: H, role: "img", "aria-label": cfg.aria || "" });
    ticks.forEach(function (v) {
      var yy = Y(v);
      svg.appendChild(svgEl("line", { "class": "grid-line", x1: l, x2: W - r, y1: yy, y2: yy }));
      var tx = svgEl("text", { x: l - 6, y: yy + 4, "text-anchor": "end" });
      tx.textContent = fmtAxis(v);
      svg.appendChild(tx);
    });
    cfg.xTicks.forEach(function (tk) {
      var xx = X(tk.v);
      var anchor = tk.v === 0 ? "start" : (tk.v === cfg.xMax ? "end" : "middle");
      var t2 = svgEl("text", { x: xx, y: H - 6, "text-anchor": anchor });
      t2.textContent = tk.label;
      svg.appendChild(t2);
      svg.appendChild(svgEl("line", { "class": "grid-line", x1: xx, x2: xx, y1: tp + ph, y2: tp + ph + 4 }));
    });
    cfg.series.forEach(function (s) {
      var d = "";
      s.ys.forEach(function (v, i) { d += (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); });
      if (d) svg.appendChild(svgEl("path", { "class": "ln " + s.cls + (s.dash ? " dash" : ""), d: d, "stroke-width": s.w || 2 }));
      if (s.endDot && s.ys.length) {
        var li = s.ys.length - 1;
        svg.appendChild(svgEl("circle", { "class": s.endDot, cx: X(li), cy: Y(s.ys[li]), r: 3.5 }));
      }
    });
    wrap.replaceChildren(svg);
  }
  function yearTicks(Y) {
    var st = Y <= 5 ? 1 : Y <= 12 ? 2 : Y <= 25 ? 5 : 10;
    var out = [];
    for (var y = 0; y <= Y; y += st) out.push({ v: y, label: y + "年" });
    if (out[out.length - 1].v !== Y) {
      // 最後の目盛りが近すぎるときは、ひとつ前を消す
      if (Y - out[out.length - 1].v < st * 0.6 && out.length > 1) out.pop();
      out.push({ v: Y, label: Y + "年" });
    }
    return out;
  }

  // 範囲バーの位置(%)
  function pos(v, lo, hi) { return (Math.max(0, Math.min(1, (v - lo) / (hi - lo))) * 100).toFixed(2) + "%"; }
  function rangeAxis(lo, hi, marks) {
    var ax = el("div", "range-axis");
    ax.setAttribute("aria-hidden", "true");
    marks.forEach(function (m) {
      var s = el("span", "", fmtPct(m, m > 0));
      s.style.left = pos(m, lo, hi);
      ax.appendChild(s);
    });
    return ax;
  }

  // ---------- ミニ体験 ----------
  var MINI = {};

  // 金額の表示: 1億円以上は「◯億円」
  function fmtBig(yen) { return yen >= 1e8 && yen % 1e8 === 0 ? (yen / 1e8).toLocaleString("ja-JP") + "億円" : fmtMan(yen); }
  // 割合(%)の表示。0.2 → "0.2%"
  function pctLabel(pct) { return String(roundTo(pct, 2)) + "%"; }
  // 月数 → 「◯年◯か月」
  function fmtMonths(m) {
    var y = Math.floor(m / 12), r = m % 12;
    return (y ? y + "年" : "") + (r ? r + "か月" : (y ? "" : "0か月"));
  }
  // 月の横軸(年ごとの目盛り)
  function monthTicks(months) {
    var Y = months / 12;
    var st = Y <= 5 ? 1 : Y <= 12 ? 2 : Y <= 25 ? 5 : 10;
    var out = [{ v: 0, label: "0" }];
    for (var y = st; y * 12 <= months; y += st) {
      if (months - y * 12 < st * 12 * 0.4 && y * 12 !== months) break; // 右端に近すぎる目盛りは出さない
      out.push({ v: y * 12, label: y + "年" });
    }
    return out;
  }

  // 第1部 1. 利息の計算
  MINI.interest = {
    title: "利息を計算してみる",
    render: function (box) {
      var s = { amount: 1e6, pct: 0.2, years: 1 };
      var ctl = el("div", "mini-controls");
      ctl.appendChild(chipGroup("金額", [1e4, 1e5, 1e6].map(function (v) { return { v: v, label: fmtMan(v) }; }), s.amount, function (v) { s.amount = v; draw(); }));
      ctl.appendChild(chipGroup("年利(例)", [0.2, 1, 3, 15].map(function (v) { return { v: v, label: "年" + pctLabel(v) }; }), s.pct, function (v) { s.pct = v; draw(); }));
      ctl.appendChild(chipGroup("期間", [1, 5].map(function (v) { return { v: v, label: v + "年" }; }), s.years, function (v) { s.years = v; draw(); }));
      box.appendChild(ctl);

  var REVO_RATE = 0.15, REVO_MAX = 600;
  function revolvePlan(principal, pay) {
    var bal = principal, months = 0, interest = 0, path = [principal];
    var first = Math.floor(principal * REVO_RATE / 12);
    if (pay <= first) {
      // 返済が利息以下: 10年分だけ残高の動きを出す
      for (var k = 0; k < 120; k++) {
        var it = Math.floor(bal * REVO_RATE / 12);
        bal = bal + it - pay;
        path.push(bal);
      }
      return { never: true, first: first, path: path, balance: bal };
    }
    while (bal > 0 && months < REVO_MAX) {
      var i = Math.floor(bal * REVO_RATE / 12);
      interest += i;
      bal += i;
      bal -= Math.min(pay, bal);
      months++;
      path.push(bal);
    }
    return { never: false, first: first, months: months, interest: interest, paid: principal + interest, path: path };
  }

  var HORIZONS = [1, 5, 10, 20, 30];
  var horizonCache = null;
  function calcHorizon() {
    var o = { initial: 1e6, monthly: 0, r: 0.06, sigma: 0.18, years: 30, fee: 0 };
    var finals = HORIZONS.map(function () { return []; });
    for (var i = 0; i < 1000; i++) {
      var path = Sim.compoundPath(o, Sim.trialSeed(MC_NO, i));
      HORIZONS.forEach(function (y, k) { finals[k].push(path[y]); });
    }
    return HORIZONS.map(function (y, k) {
      var s = Sim.summarize(finals[k]);
      function an(v) { return Math.pow(v / o.initial, 1 / y) - 1; }
      return {
        y: y, p10: an(s.p10), p50: an(s.p50), p90: an(s.p90),
        loss: finals[k].filter(function (v) { return v < o.initial; }).length / finals[k].length
      };
    });
  }

  function lessonHref(no) { return "#lesson-" + no; }
  function progressEl() {
    var p = el("div", "progress");
    var track = el("div", "progress-track");
    track.setAttribute("aria-hidden", "true");
    var bar = el("div", "progress-bar");
    bar.style.width = (doneCount() / N * 100) + "%";
    track.appendChild(bar);
    p.appendChild(track);
    p.appendChild(el("span", "progress-text", doneCount() + " / " + N + " 読了"));
    return p;
  }

  function partOf(no) {
    for (var i = 0; i < PARTS.length; i++) if (PARTS[i].no === no) return PARTS[i];
    return null;
  }
  function partLabel(pt) { return "第" + pt.no + "部 " + pt.title; }
  function lessonsOf(pt) { return L.filter(function (ls) { return ls.part === pt.no; }); }
  // 部がないとき(古い lessons.js)は、全部を1つの部として扱う
  function partGroups() {
    if (!PARTS.length) return [{ part: null, lessons: L }];
    return PARTS.map(function (pt) { return { part: pt, lessons: lessonsOf(pt) }; });
  }

  function lessonRow(ls) {
    var li = el("li");
    var done = isDone(ls.id);
    var a = link(lessonHref(ls.no), "lesson-row" + (done ? " is-done" : ""));
    var num = el("span", "lesson-num", done ? "✓" : String(ls.no));
    num.setAttribute("aria-hidden", "true");
    a.appendChild(num);
    var main = el("span", "lesson-main");
    var tt = el("span", "lesson-title", "レッスン" + ls.no + " " + ls.title);
    if (done) tt.appendChild(el("span", "sr-only", "(読了)"));
    main.appendChild(tt);
    main.appendChild(el("span", "lesson-summary", ls.summary));
    var meta = el("span", "lesson-meta");
    meta.appendChild(el("span", "chip", "約" + ls.minutes + "分"));
    if (ls.tryTab && TAB_LABEL[ls.tryTab]) meta.appendChild(el("span", "chip", "シミュレーター: " + TAB_LABEL[ls.tryTab]));
    main.appendChild(meta);
    a.appendChild(main);
    li.appendChild(a);
    return li;
  }

  function renderTop() {
    var v = el("div", "view-top");
    var minutes = L.reduce(function (sum, ls) { return sum + ls.minutes; }, 0);

    var intro = el("section", "card course-intro");
    intro.appendChild(el("h2", "", "このコースについて"));
    var ul = el("ul");
    ["お金や投資をまったく知らない人向け。「金利とは何か」から始めます",
      "1レッスン5分ほど、全" + N + "レッスン(約" + minutes + "分)。" + (PARTS.length ? PARTS.length + "つの部に分かれています" : ""),
      "順番に読むのがおすすめ。各レッスンに、小さな体験・ここだけ覚える・確認クイズがあります",
      "読んだしるしは、このブラウザにだけ保存されます"].forEach(function (t) { ul.appendChild(el("li", "", t)); });
    intro.appendChild(ul);
    v.appendChild(intro);

    v.appendChild(progressEl());

    var next = resumeLesson();
    var resume;
    if (doneCount() === 0) resume = link(lessonHref(1), "btn-primary resume", "レッスン1からはじめる →");
    else if (next) resume = link(lessonHref(next.no), "btn-primary resume", "続きから: レッスン" + next.no + " " + next.short + " →");
    else resume = link(lessonHref(1), "btn-secondary resume", "もう一度レッスン1から");
    v.appendChild(resume);

    var p2 = partOf(2), p2first = p2 ? lessonsOf(p2)[0] : null;
    if (p2first) {
      var skip = el("p", "skip-note", "投資のことをすでに少し知っている人は、第2部から読んでもかまいません。");
      skip.appendChild(document.createTextNode(" "));
      skip.appendChild(link(lessonHref(p2first.no), "", partLabel(p2) + "へ →"));
      v.appendChild(skip);
    }

    partGroups().forEach(function (g) {
      var block = el("section", "part-block");
      var ol = el("ol", "lesson-list");
      if (g.part) {
        var hid = "part-" + g.part.no;
        var head = el("div", "part-head");
        head.appendChild(el("p", "part-no", "PART " + g.part.no));
        var h = el("h2", "", partLabel(g.part));
        h.id = hid;
        head.appendChild(h);
        head.appendChild(el("p", "part-desc", g.part.desc));
        block.appendChild(head);
        block.setAttribute("aria-labelledby", hid);
        ol.setAttribute("aria-labelledby", hid);
      } else ol.setAttribute("aria-label", "レッスンの一覧");
      g.lessons.forEach(function (ls) { ol.appendChild(lessonRow(ls)); });
      block.appendChild(ol);
      v.appendChild(block);
    });

    if (doneCount() === N) {
      var sum = el("section", "card summary-card");
      sum.appendChild(el("h2", "", "総まとめ: ここだけ覚える"));
      partGroups().forEach(function (g) {
        if (g.part) sum.appendChild(el("p", "summary-part", partLabel(g.part)));
        g.lessons.forEach(function (ls) {
          sum.appendChild(el("h3", "", "レッスン" + ls.no + " " + ls.title));
          var u = el("ul");
          ls.points.forEach(function (p) { u.appendChild(el("li", "", p)); });
          sum.appendChild(u);
        });
      });
      v.appendChild(sum);
    }
    view.replaceChildren(v);
  }

  // 目次
  function fillToc(toc, cur) {
    toc.replaceChildren();
    var sm = el("summary");
    sm.appendChild(el("span", "", "目次 ・ " + doneCount() + "/" + N + " 読了"));
    var arrow = el("span", "arrow", "▾"); arrow.setAttribute("aria-hidden", "true");
    sm.appendChild(arrow);
    toc.appendChild(sm);
    var head = el("div", "toc-head");
    head.appendChild(el("span", "", "目次"));
    head.appendChild(el("span", "progress-text", doneCount() + "/" + N + " 読了"));
    toc.appendChild(head);
    var bodyBox = el("div", "toc-body");
    partGroups().forEach(function (g) {
      var ol = el("ol", "toc-list");
      if (g.part) {
        var pid = "toc-part-" + g.part.no;
        var ph = el("p", "toc-part", partLabel(g.part));
        ph.id = pid;
        bodyBox.appendChild(ph);
        ol.setAttribute("aria-labelledby", pid);
      }
      g.lessons.forEach(function (ls) {
        var li = el("li");
        var done = isDone(ls.id);
        var a = link(lessonHref(ls.no), "toc-item" + (ls.no === cur ? " is-current" : "") + (done ? " is-done" : ""));
        if (ls.no === cur) a.setAttribute("aria-current", "page");
        var no = el("span", "toc-no", done ? "✓" : String(ls.no));
        a.appendChild(no);
        a.appendChild(el("span", "", ls.short));
        if (done) a.setAttribute("aria-label", "レッスン" + ls.no + " " + ls.short + "(読了)");
        a.addEventListener("click", function () { if (!mqPC.matches) toc.open = false; });
        li.appendChild(a);
        ol.appendChild(li);
      });
      bodyBox.appendChild(ol);
    });
    toc.appendChild(bodyBox);
    toc.appendChild(link("#top", "toc-top", "← コースのトップ"));
  }

  function renderBody(ls, body, minis) {
    ls.body.forEach(function (b) {
      if (b.t === "p") body.appendChild(html("p", "", b.html));
      else if (b.t === "h") body.appendChild(el("h3", "", b.text));
      else if (b.t === "analogy" || b.t === "note") {
        var d = el("div", b.t === "analogy" ? "analogy" : "note-box");
        d.appendChild(el("span", "box-label", b.t === "analogy" ? "たとえば" : "ひとこと"));
        d.appendChild(html("span", "", b.html));
        body.appendChild(d);
      } else if (b.t === "list") {
        var ul = el("ul", b.plain ? "plain" : "bullets");
        b.items.forEach(function (it) { ul.appendChild(el("li", "", it)); });
        body.appendChild(ul);
      } else if (b.t === "figure" && FIGURES[b.id]) {
        body.appendChild(FIGURES[b.id]());
      } else if (b.t === "mini" && MINI[ls.mini]) {
        var sec = el("section", "mini");
        sec.setAttribute("aria-label", "やってみよう: " + MINI[ls.mini].title);
        sec.appendChild(el("p", "mini-tag", "やってみよう"));
        sec.appendChild(el("h3", "mini-title", MINI[ls.mini].title));
        body.appendChild(sec);
        minis.push({ sec: sec, mini: MINI[ls.mini] });
      }
    });
  }

  function renderQuiz(ls) {
    var sec = el("section", "quiz");
    sec.appendChild(el("h3", "", "確認クイズ"));
    ls.quiz.forEach(function (q, qi) {
      var item = el("div", "quiz-item");
      item.appendChild(el("p", "quiz-q", "Q" + (qi + 1) + ". " + q.q));
      var ch = el("div", "choices");
      var fb = el("p", "feedback");
      fb.hidden = true;
      fb.setAttribute("aria-live", "polite");
      var again = el("button", "btn-small quiz-again", "もう一度");
      again.type = "button";
      again.hidden = true;
      var btns = q.choices.map(function (c, i) {
        var b = el("button", "choice-btn");
        b.type = "button";
        b.appendChild(el("span", "choice-key", KEYS[i]));
        b.appendChild(el("span", "", c));
        b.addEventListener("click", function () {
          var ok = i === q.answer;
          btns.forEach(function (x, j) {
            x.disabled = true;
            if (j === i) x.classList.add(ok ? "correct" : "wrong");
            if (!ok && j === q.answer) x.classList.add("correct");
          });
          fb.className = "feedback " + (ok ? "good" : "bad");
          fb.textContent = ok ? "正解! " + q.explain : "ざんねん。正解は「" + q.choices[q.answer] + "」。" + q.explain;
          fb.hidden = false;
          again.hidden = false;
        });
        ch.appendChild(b);
        return b;
      });
      again.addEventListener("click", function () {
        btns.forEach(function (x) { x.disabled = false; x.classList.remove("correct", "wrong"); });
        fb.hidden = true;
        again.hidden = true;
        btns[0].focus();
      });
      item.appendChild(ch);
      item.appendChild(fb);
      item.appendChild(again);
      sec.appendChild(item);
    });
    return sec;
  }

  function renderLinks(ls) {
    var box = el("div", "lesson-links");
    if (ls.no === N) {
      var row = el("div", "btn-row");
      row.appendChild(link("index.html", "btn-secondary try-link", "シミュレーターで自由に試す →"));
      row.appendChild(link("reference.html", "btn-secondary", "投資用語帳 →"));
      box.appendChild(row);
    } else if (ls.tryTab && TAB_LABEL[ls.tryTab]) {
      box.appendChild(link("index.html#" + ls.tryTab, "btn-secondary try-link", "シミュレーターで試す: " + TAB_LABEL[ls.tryTab] + " →"));
      if (ls.tryText) box.appendChild(el("p", "hint", ls.tryText));
    }
    var terms = ls.terms.filter(function (id) { return TERM_BY_ID[id]; });
    if (terms.length) {
      var tl = el("div", "term-links");
      tl.appendChild(el("span", "term-links-label", "この回の用語"));
      terms.forEach(function (id) { tl.appendChild(link("reference.html#" + id, "term-chip", TERM_BY_ID[id].name)); });
      box.appendChild(tl);
    }
    return box;
  }

  function renderLesson(no) {
    var ls = L[no - 1];
    var layout = el("div", "course-layout view-lesson");
    var toc = el("details", "toc");
    fillToc(toc, no);
    toc.open = mqPC.matches;
    layout.appendChild(toc);

    var art = el("article", "card lesson");
    art.setAttribute("aria-labelledby", "lesson-title");
    var head = el("div", "lesson-head");
    var pt = partOf(ls.part);
    head.appendChild(el("p", "lesson-no", "LESSON " + no + " / " + N + (pt ? " ・ 第" + pt.no + "部" : "") + " ・ 約" + ls.minutes + "分"));
    var h2 = el("h2", "lesson-title", ls.title);
    h2.id = "lesson-title";
    h2.tabIndex = -1;
    head.appendChild(h2);
    head.appendChild(el("p", "lesson-lead", ls.summary));
    art.appendChild(head);

    var body = el("div", "lesson-body");
    var minis = [];
    renderBody(ls, body, minis);
    art.appendChild(body);

    var kp = el("aside", "keypoints");
    kp.appendChild(el("h3", "", "ここだけ覚える"));
    var ul = el("ul");
    ls.points.forEach(function (p) { ul.appendChild(el("li", "", p)); });
    kp.appendChild(ul);
    art.appendChild(kp);

    art.appendChild(renderQuiz(ls));
    art.appendChild(renderLinks(ls));

    var foot = el("div", "lesson-foot");
    var tg = el("button", "done-toggle");
    tg.type = "button";
    function syncToggle() {
      var d = isDone(ls.id);
      tg.setAttribute("aria-pressed", String(d));
      tg.textContent = d ? "✓ 読みました" : "読んだしるしをつける";
    }
    tg.addEventListener("click", function () {
      setDone(ls.id, !isDone(ls.id));
      syncToggle();
      var open = toc.open;
      fillToc(toc, no);
      toc.open = open;
    });
    syncToggle();
    foot.appendChild(tg);

    var pager = el("nav", "pager");
    pager.setAttribute("aria-label", "レッスンの移動");
    var prev;
    if (no === 1) prev = link("#top", "btn-secondary pager-prev", "← コースのトップ");
    else {
      var pl = L[no - 2];
      prev = link(lessonHref(no - 1), "btn-secondary pager-prev");
      prev.appendChild(el("span", "lbl-long", "← " + pl.no + ". " + pl.short));
      prev.appendChild(el("span", "lbl-short", "← 前へ"));
    }
    var nx;
    if (no === N) nx = link("#top", "btn-primary pager-next", "コースを終える →");
    else {
      var nl = L[no];
      nx = link(lessonHref(no + 1), "btn-primary pager-next");
      nx.appendChild(el("span", "lbl-long", "次: " + nl.no + ". " + nl.short + " →"));
      nx.appendChild(el("span", "lbl-short", "次へ →"));
    }
    // 次へ進むときは、今のレッスンを読了にする
    nx.addEventListener("click", function () { setDone(ls.id, true); });
    pager.appendChild(prev);
    pager.appendChild(nx);
    foot.appendChild(pager);
    art.appendChild(foot);

    layout.appendChild(art);
    view.replaceChildren(layout);
    minis.forEach(function (m) { m.mini.render(m.sec); });
    return h2;
  }

  function currentLesson() {
    var m = /^#lesson-(\d+)$/.exec(location.hash);
    if (!m) return 0;
    var n = parseInt(m[1], 10);
    return n >= 1 && n <= N ? n : 0;
  }

  function render(changed) {
    if (ro) ro.disconnect();
    var no = currentLesson();
    app.classList.toggle("is-lesson", no > 0);
    hero.classList.toggle("is-compact", no > 0);
    var h2 = null;
    if (no) {
      state.lastId = L[no - 1].id;
      save();
      h2 = renderLesson(no);
      document.title = "レッスン" + no + " " + L[no - 1].title + " | 投資入門コース";
    } else {
      renderTop();
      document.title = "投資入門コース | 投資シミュレーション道場";
    }
    if (changed) {
      window.scrollTo(0, 0);
      if (h2) h2.focus({ preventScroll: true });
    }
  }

  function onMq() {
    var toc = view.querySelector("details.toc");
    if (toc) toc.open = mqPC.matches;
  }
  if (mqPC.addEventListener) mqPC.addEventListener("change", onMq);
  else if (mqPC.addListener) mqPC.addListener(onMq);

  window.addEventListener("hashchange", function () { render(true); });
  render(false);
})();
</script>
</body>
</html>
