<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投資用語帳 | 投資シミュレーション道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../shared/base.css">
<link rel="stylesheet" href="theme.css">

<style>
  .app { max-width: 720px; gap: 22px; }

  /* ---------- Hero ---------- */
  .tagline { max-width: 46ch; }

  .site-nav {
    margin: 14px 0 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 18px;
    font-size: 13px;
  }
  .site-nav a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  .site-nav a:hover { text-decoration: underline; }
  .site-nav [aria-current="page"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom: 2px solid var(--accent);
  }

  /* ---------- 免責 ---------- */
  .notice {
    margin: 16px auto 0;
    max-width: 60ch;
    background: var(--surface-2);
    color: var(--ink-muted);
    font-size: 13px;
    line-height: 1.7;
    border-radius: 10px;
    padding: 12px 14px;
    text-align: left;
  }

  /* ---------- 絞り込みタブ ---------- */
  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tab {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-muted);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab:hover { border-color: var(--accent); color: var(--ink); }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .tab:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- カード ---------- */
  .ref-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
  }
  .ref-card {
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px 18px;
    box-shadow: 0 1px 2px var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-margin-top: 16px;
  }
  .ref-card[hidden] { display: none; }
  .ref-card:target,
  .ref-card.is-target { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

  .card-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 10px;
  }
  .card-head h2 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 600;
  }
  .yomi {
    font-size: 12px;
    color: var(--ink-faint);
  }
  .chip {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }

  .meaning {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--ink);
  }
  .extra {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--ink-muted);
  }
  .try-link {
    align-self: flex-start;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    padding: 4px 0;
  }
  .try-link:hover { text-decoration: underline; }

  /* ---------- フッター ---------- */
  .page-foot {
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-faint);
    line-height: 1.8;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .page-foot a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .page-foot a:hover { text-decoration: underline; }

  /* ---------- スマホ表示の調整 ---------- */
  @media (max-width: 480px) {
    .ref-card { padding: 18px 16px 20px; }
    .tab { padding: 10px 10px; font-size: 13.5px; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="page-links" aria-label="ページの移動">
    <a class="back-link" href="../../../index.html">← ページ一覧</a>
    <a class="back-link" href="../../../study/review/habit-planner/index.html">習慣プランナー →</a>
  </nav>
  <header class="hero">
    <p class="eyebrow">INVESTMENT · 用語帳</p>
    <h1>投資用語帳</h1>
    <p class="tagline">入門コースとシミュレーターに出てくる、お金と投資の言葉を短い説明でまとめました。</p>
    <nav class="site-nav" aria-label="投資シミュレーション道場のページ">
      <a href="course.html">入門コース</a>
      <a href="index.html">シミュレーター</a>
      <span aria-current="page">投資用語帳</span>
    </nav>
    <p class="notice">これは乱数で作った架空の相場による学習用のシミュレーションです。実際の値動きや将来の成果を示したり保証したりするものではなく、特定の商品や投資を勧めるものでもありません。税金・手数料・インフレは簡略化または省略しています。投資の判断はご自身の責任で行ってください。</p>
  </header>

  <div class="tabs" id="tabs" role="group" aria-label="用語の絞り込み">
    <button type="button" class="tab active" data-group="all" aria-pressed="true">すべて</button>
    <button type="button" class="tab" data-group="basic" aria-pressed="false">基本</button>
    <button type="button" class="tab" data-group="product" aria-pressed="false">商品・制度</button>
    <button type="button" class="tab" data-group="risk" aria-pressed="false">リスク</button>
    <button type="button" class="tab" data-group="strategy" aria-pressed="false">売買・戦略</button>
  </div>

  <section class="ref-grid" id="grid" aria-label="用語の一覧"></section>

  <footer class="page-foot">
    学習用のシミュレーションです。実際の投資成果を保証しません。<br>
    <a href="course.html">← 入門コース</a> ・ <a href="index.html">シミュレーター →</a>
  </footer>
</div>

<script src="terms.js"></script>
<script src="lessons.js"></script>
<script>
(function () {
  "use strict";

  var GROUP_LABEL = { basic: "基本", product: "商品・制度", risk: "リスク", strategy: "売買・戦略" };
  var TAB_LABEL = { dca: "積立と一括", compound: "複利と長期", diversify: "分散投資", timing: "売買ルール" };
  var grid = document.getElementById("grid");

  // 用語 → 最初に出てくるレッスン(lessons.js の terms から)
  var FIRST_LESSON = {};
  if (typeof INVEST_LESSONS !== "undefined") {
    INVEST_LESSONS.forEach(function (ls) {
      (ls.terms || []).forEach(function (id) { if (!FIRST_LESSON[id]) FIRST_LESSON[id] = ls; });
    });
  }
  var tabs = document.querySelectorAll("#tabs .tab");

  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function buildCard(t) {
    var card = el("article", "ref-card");
    card.id = t.id;
    card.dataset.group = t.group;

    var head = el("div", "card-head");
    head.appendChild(el("h2", "", t.name));
    head.appendChild(el("span", "yomi", t.yomi));
    head.appendChild(el("span", "chip", GROUP_LABEL[t.group]));
    card.appendChild(head);

    card.appendChild(el("p", "meaning", t.meaning));
    if (t.extra) card.appendChild(el("p", "extra", t.extra));
    var ls = FIRST_LESSON[t.id];
    if (ls) {
      var c = el("a", "try-link", "入門コースで読む: レッスン" + ls.no + " " + ls.short + " →");
      c.href = "course.html#lesson-" + ls.no;
      card.appendChild(c);
    }
    if (t.tryTab && TAB_LABEL[t.tryTab]) {
      var a = el("a", "try-link", "シミュレーターで試す(" + TAB_LABEL[t.tryTab] + ")→");
      a.href = "index.html#" + t.tryTab;
      card.appendChild(a);
    }
    return card;
  }

  function setFilter(group) {
    tabs.forEach(function (t) {
      var on = t.dataset.group === group;
      t.classList.toggle("active", on);
      t.setAttribute("aria-pressed", on ? "true" : "false");
    });
    grid.querySelectorAll(".ref-card").forEach(function (card) {
      card.hidden = !(group === "all" || card.dataset.group === group);
    });
  }

  // #id つきで開かれたとき、その項目を見えるようにして目立たせる
  function focusHash() {
    var id = "";
    try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) { /* こわれたアンカーは無視 */ }
    grid.querySelectorAll(".is-target").forEach(function (c) { c.classList.remove("is-target"); });
    if (!id) return;
    var card = document.getElementById(id);
    if (!card || !card.classList.contains("ref-card")) return;
    if (card.hidden) setFilter("all");
    card.classList.add("is-target");
    card.scrollIntoView({ block: "start" });
  }

  INVEST_TERMS.forEach(function (t) { grid.appendChild(buildCard(t)); });
  tabs.forEach(function (t) {
    t.addEventListener("click", function () { setFilter(t.dataset.group); });
  });
  window.addEventListener("hashchange", focusHash);
  focusHash();
})();
</script>
</body>
</html>
